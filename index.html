<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JRK AutoCAD Smart XLS-to-CSV Bridge | Engineering MTEXT Formatter</title>
  
  <!-- Google Fonts: Inter, JetBrains Mono & Libre Baskerville (for JRK Logo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            /* Theme-aware surface palette (switches automatically between Dark & Light mode) */
            cadslate: {
              950: 'rgb(var(--s-950) / <alpha-value>)',
              900: 'rgb(var(--s-900) / <alpha-value>)',
              850: 'rgb(var(--s-850) / <alpha-value>)',

            mono: ['"JetBrains Mono"', 'Consolas', 'monospace'],
            serif: ['"Libre Baskerville"', 'Georgia', 'serif'],

      }

  </script>

  <!-- SheetJS (xlsx) CDN -->

<body class="bg-cadslate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cadcyan-500 selection:text-black transition-colors duration-200">

  <div id="root" class="flex flex-col min-h-screen"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const STORAGE_KEY = 'autocad_smart_bridge_settings';
    const THEME_KEY = 'autocad_smart_bridge_theme';

    const DEFAULT_SETTINGS = {
      textWidthFactor: 0.5,
      shortPipeThreshold: 6,
      mediumPipeThreshold: 14,
      smartLengthFormatting: true,
      cleanGradientPrefix: true,
    };

    // Realistic Demo Datasets for 1-Click Testing (Including Duplicate IDs to test Lowest IL logic)
    const DEMO_DRAINAGE_DATA = [
      { 'Drain Name': '1A', 'U-Drain Width / Ø': '600', 'Length': 4.5, 'Grade': '1000', 'Invert Level (Upstream)': '8.70', 'Invert Level (Downstream)': '8.55' },
      { 'Drain Name': '1B', 'U-Drain Width / Ø': '600', 'Length': 6.0, 'Grade': '1000', 'Invert Level (Upstream)': '8.55', 'Invert Level (Downstream)': '8.40' },
      { 'Drain Name': '1B', 'U-Drain Width / Ø': '600', 'Length': 10.0, 'Grade': '800', 'Invert Level (Upstream)': '8.40', 'Invert Level (Downstream)': '8.15' },
      { 'Drain Name': '1C', 'U-Drain Width / Ø': '900', 'Length': 12.0, 'Grade': '800', 'Invert Level (Upstream)': '8.15', 'Invert Level (Downstream)': '7.95' },
      { 'Drain Name': '1D', 'U-Drain Width / Ø': '1200', 'Length': 14.0, 'Grade': '500', 'Invert Level (Upstream)': '7.95', 'Invert Level (Downstream)': '7.70' },
      { 'Drain Name': '1E', 'U-Drain Width / Ø': '1200', 'Length': 22.5, 'Grade': '500', 'Invert Level (Upstream)': '7.70', 'Invert Level (Downstream)': '7.40' },
      { 'Drain Name': '1F', 'U-Drain Width / Ø': '1500', 'Length': 30.0, 'Grade': '400', 'Invert Level (Upstream)': '7.40', 'Invert Level (Downstream)': '7.05' },
    ];

    const DEMO_SEWERAGE_DATA = [
      { 'Manhole No.': 'MH-01', 'Ground Level': '34.50', 'Invert Level': '32.10', 'Depth of Manhole': '2.40' },
      { 'Manhole No.': 'MH-02', 'Ground Level': '34.20', 'Invert Level': '31.85', 'Depth of Manhole': '2.35' },
      { 'Manhole No.': 'MH-02', 'Ground Level': '34.20', 'Invert Level': '31.60', 'Depth of Manhole': '2.60' },
      { 'Manhole No.': 'MH-03', 'Ground Level': '33.85', 'Invert Level': '30.95', 'Depth of Manhole': '2.90' },
      { 'Manhole No.': 'MH-04', 'Ground Level': '33.40', 'Invert Level': '30.10', 'Depth of Manhole': '3.30' },
      { 'Manhole No.': 'MH-05', 'Ground Level': '32.90', 'Invert Level': '29.20', 'Depth of Manhole': '3.70' },
      { 'Manhole No.': 'MH-06', 'Ground Level': '32.10', 'Invert Level': '28.50', 'Depth of Manhole': '3.60' },
      { 'Manhole No.': 'MH-06', 'Ground Level': '32.10', 'Invert Level': '28.00', 'Depth of Manhole': '4.10' },
    ];

    const DEMO_MIXED_DATA = [
      { 'ID': 'D01', 'Size': '600', 'Length': '5.2', 'Gradient': '1000', 'GL': '', 'IL': '7.32', 'Depth': '' },
      { 'ID': 'D02', 'Size': '900', 'Length': '10.5', 'Gradient': '800', 'GL': '', 'IL': '7.15', 'Depth': '' },
      { 'ID': 'D03', 'Size': '1200', 'Length': '24.0', 'Gradient': '500', 'GL': '', 'IL': '6.90', 'Depth': '' },
      { 'ID': 'MH-01', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '42.10', 'IL': '39.80', 'Depth': '2.30' },
      { 'ID': 'MH-02', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '41.80', 'IL': '39.00', 'Depth': '2.80' },
      { 'ID': 'MH-03', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '41.20', 'IL': '38.00', 'Depth': '3.20' },
    ];

    function escapeCSV(val) {
      if (val === null || val === undefined) return '';
      const str = String(val);
      if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    function App() {
      // 0. Theme State (Dark Mode is Default)
      const [theme, setTheme] = useState(() => {
        try {
          return localStorage.getItem(THEME_KEY) || 'dark';
        } catch (e) {
          return 'dark';
        }
      });

      useEffect(() => {
        const rootEl = document.documentElement;
        if (theme === 'light') {
          rootEl.classList.remove('dark');
          rootEl.classList.add('light');
        } else {
          rootEl.classList.remove('light');
          rootEl.classList.add('dark');
        }
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (e) {}
      }, [theme]);

      // 1. Settings state
      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SETTINGS;
        } catch (e) {
          return DEFAULT_SETTINGS;
        }
      });

      // Modals
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isGuideOpen, setIsGuideOpen] = useState(false);
      const [showManualMapper, setShowManualMapper] = useState(false);
      const [isFeedbackOpen, setIsFeedbackOpen] = useState(false);
      const [feedbackType, setFeedbackType] = useState('Bug Report');
      const [feedbackText, setFeedbackText] = useState('');

      const sendFeedbackEmail = () => {
        const to = 'nazreen@jrksb.com';
        const subject = `[JRK CAD Bridge] ${feedbackType}`;
        window.location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(feedbackText)}`;
        setIsFeedbackOpen(false);
      };

      // 2. Excel Parsing States
      const [fileInfo, setFileInfo] = useState(null);
      const [activeSheet, setActiveSheet] = useState('');
      const [workbook, setWorkbook] = useState(null);
      const [rawRows, setRawRows] = useState([]);
      const [columns, setColumns] = useState([]);

      // 3. Smart Column Mapping State
      const [columnMap, setColumnMap] = useState({
        drainId: '',
        drainIdSub: '', // Optional adjacent sub-ID column (e.g. '1' + 'A' -> '1A')
        size: '',
        length: '',
        gradient: '',
        drainIlUp: '',
        drainIlDown: '',
        sewerId: '',
        sewerIdSub: '', // Optional adjacent number column (e.g. 'MH' + '1' -> 'MH-01')
        gl: '',
        il: '',
        depth: '',
      });

      // Smart Auto-Detected Mode ('DRAINAGE', 'SEWERAGE', 'HYBRID')
      const [detectedMode, setDetectedMode] = useState('DRAINAGE');
      // User-Selected Mode Override ('AUTO', 'DRAINAGE', 'SEWERAGE', 'HYBRID')
      const [userDesignMode, setUserDesignMode] = useState('AUTO');
      // Confidence score details for UI transparency
      const [detectionReason, setDetectionReason] = useState('Ready for upload');

      // Effective mode combines Smart Auto-Detection with User Override
      const effectiveMode = userDesignMode === 'AUTO' ? detectedMode : userDesignMode;

      // 4. UI search & filter
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [toastMsg, setToastMsg] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (e) {}
      }, [settings]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // ─────────────────────────────────────────────────────────────
      // SMART MULTI-SIGNAL DISCIPLINE CLASSIFIER & COLUMN DETECTOR
      // ─────────────────────────────────────────────────────────────
      const detectColumns = (headerList, sampleRows = [], metaText = '') => {
        const mapping = {
          drainId: '',
          drainIdSub: '',
          size: '',
          length: '',
          gradient: '',
          drainIlUp: '',
          drainIlDown: '',
          sewerId: '',
          sewerIdSub: '',
          gl: '',
          il: '',
          depth: '',
        };

        const drainRules = {
          drainId: [
            /^(drain\s*name\.?|pipe\s*id\.?|drain\s*id\.?|pipe\s*name|line\s*id|drain\s*no\.?|pipe\s*no\.?|line\s*no\.?)$/i,
            /^(id|label|mark|tag)$/i,
          ],
          size: [
            /^(u-?drain\s*width.*|size|dia|diameter|pipe\s*size|drain\s*size|pipe\s*dia|width|span|dia\s*\(mm\)|size\s*\(mm\))$/i,
            /(u-?drain\s*width|dia|diameter|size)/i,
          ],
          length: [
            /^(length|len|pipe\s*len|pipe\s*length|distance|dist|run|length\s*\(m\)|len\s*\(m\))$/i,
            /(length|len)/i,
          ],
          gradient: [
            /^(grade|gradient|grad|1:?|slope|fall|ratio|gradient\s*\(1:s\))$/i,
            /(grade|gradient|grad|slope)/i,
          ],
          drainIlDown: [
            /invert\s*level\s*\(\s*downstream\s*\)/i,
            /(il\s*down|downstream\s*il|invert.*down)/i,
          ],
          drainIlUp: [
            /invert\s*level\s*\(\s*upstream\s*\)/i,
            /(il\s*up|upstream\s*il|invert.*up)/i,
          ],
        };

        const sewerRules = {
          sewerId: [
            /^(manhole\s*no\.?|mh\s*no\.?|mh|manhole|sewer\s*id|mh\s*id|node|node\s*id|chamber|structure\s*id)$/i,
            /(manhole\s*no|mh\s*no|^manhole$)/i,
            /^(id|label|mark)$/i,
          ],
          gl: [
            /^(gl|ground\s*level|ground\s*level\s*\(\s*upstream\s*\)|ground|cover\s*level|cl|surface\s*level|gl\s*\(m\)|top\s*level|rl\s*gl)$/i,
            /(ground\s*level|^gl$|cover\s*level)/i,
          ],
          il: [
            /^(il|invert\s*level|invert|sump\s*il|sewer\s*il|il\s*\(m\)|soffit|rl\s*il)$/i,
            /(invert\s*level|^il$)/i,
          ],
          depth: [
            /^(depth\s*of\s*manhole|depth|mh\s*depth|manhole\s*depth|drop|depth\s*\(m\)|depth\s*\(\s*downstream\s*\))$/i,
            /(depth)/i,
          ],
        };

        Object.entries(drainRules).forEach(([field, patterns]) => {
          for (const pattern of patterns) {
            const found = headerList.find(h => pattern.test(String(h).trim()));
            if (found && !mapping[field]) {
              mapping[field] = found;
              break;
            }
          }
        });

        Object.entries(sewerRules).forEach(([field, patterns]) => {
          for (const pattern of patterns) {
            const found = headerList.find(h => pattern.test(String(h).trim()));
            if (found && !mapping[field]) {
              mapping[field] = found;
              break;
            }
          }
        });

        // Fallback generic ID
        const genericId = headerList.find(h => /^(id|no\.?|name)$/i.test(String(h).trim()));
        if (genericId) {
          if (!mapping.drainId) mapping.drainId = genericId;
          if (!mapping.sewerId) mapping.sewerId = genericId;
        }

        // Row-Content ID Detector: If 'Manhole No.' was in a merged cell above the header row,
        // inspect the first 3 columns across the data rows to find where "MH" + numbers live!
        if (sampleRows.length > 0 && headerList.length >= 2) {
          const c0 = headerList[0];
          const c1 = headerList[1];
          const c0HasMH = sampleRows.slice(0, 20).some(r => /^MH$/i.test(String(r[c0] || '').trim()));
          const c1HasNum = sampleRows.slice(0, 20).some(r => /^\d+(\.\d+)?$/.test(String(r[c1] || '').trim()));
          if (c0HasMH && c1HasNum) {
            mapping.sewerId = c0;
            mapping.sewerIdSub = c1;
          }
        }

        // JRK Merged-Cell Fallback if first column is __EMPTY
        if (!mapping.drainId && !mapping.sewerId && headerList.length > 0) {
          const firstCol = headerList[0];
          if (firstCol && /empty/i.test(firstCol)) {
            mapping.drainId = firstCol;
            mapping.sewerId = firstCol;
          }
        }

        // Cross-fill IDs so switching between Drainage & Sewerage mode always has an ID column ready
        if (!mapping.drainId && mapping.sewerId) mapping.drainId = mapping.sewerId;
        if (!mapping.sewerId && mapping.drainId) mapping.sewerId = mapping.drainId;

        // Detect Split ID Columns in JRK Templates:
        // Case 1 (Sewerage): Col A ('Manhole No.') = "MH", Col B ('__EMPTY') = "1", "2", "3"
        if (mapping.sewerId && !mapping.sewerIdSub && sampleRows.length > 0) {
          const sIdx = headerList.indexOf(mapping.sewerId);
          if (sIdx !== -1 && sIdx + 1 < headerList.length) {
            const nextCol = headerList[sIdx + 1];
            const hasMhPrefix = sampleRows.slice(0, 20).some(
              r => /^MH$/i.test(String(r[mapping.sewerId] || '').trim()) && /^\d+(\.\d+)?$/.test(String(r[nextCol] || '').trim())
            );
            if (hasMhPrefix) {
              mapping.sewerIdSub = nextCol;
            }
          }
        }

        // Case 2 (Drainage): Col B ('Drain Name') = "1", Col C ('__EMPTY_1') = "A", "B", "C"
        if (mapping.drainId && !mapping.drainIdSub && sampleRows.length > 0) {
          const dIdx = headerList.indexOf(mapping.drainId);
          if (dIdx !== -1 && dIdx + 1 < headerList.length) {
            const nextCol = headerList[dIdx + 1];
            const hasSubLetter = sampleRows.slice(0, 20).some(
              r => /^\d+$/.test(String(r[mapping.drainId] || '').trim()) && /^[A-Z]$/i.test(String(r[nextCol] || '').trim())
            );
            if (hasSubLetter) {
              mapping.drainIdSub = nextCol;
            }
          }
        }

        // ───────────────────────────────────────────────────────────
        // MULTI-SIGNAL SCORING ENGINE (SEWERAGE VS DRAINAGE)
        // ───────────────────────────────────────────────────────────
        let sewScore = 0;
        let drnScore = 0;
        const reasons = [];
        const allContext = `${metaText} ${headerList.join(' ')}`.toLowerCase();

        // 1. File / Sheet / Banner keywords
        if (/(sewer|sewage|iwk|manhole\s*no|manhole\s*details|sewer\s*pipe|population\s*\(pe\)|accumulative\s*pe|peak\s*factor|backdrop)/i.test(allContext)) {
          sewScore += 8;
          reasons.push('Sewerage/PE/Manhole headers');
        }
        if (/(storm\s*drainage|masma|msma|catchment|coefficient\s*of\s*runoff|overland\s*time|time\s*of\s*concentration|rainfall\s*intensity|u-?drain|drain\s*name|receiveflow)/i.test(allContext)) {
          drnScore += 8;
          reasons.push('MSMA/Catchment/Drainage headers');
        }

        // 2. Specific Column Header Signals
        if (headerList.some(h => /^manhole/i.test(String(h).trim()))) sewScore += 5;
        if (headerList.some(h => /^drain\s*name|pipe\s*id|u-?drain/i.test(String(h).trim()))) drnScore += 5;

        // 3. Data Row Content Signals
        let mhRowCount = 0;
        let drainRowCount = 0;
        sampleRows.slice(0, 20).forEach(r => {
          const sId = String(r[mapping.sewerId] || '').trim();
          const dId = String(r[mapping.drainId] || '').trim();
          if (/^MH/i.test(sId)) mhRowCount++;
          if (/^(\d+[A-Z]|[A-Z]\d+|D\d+|P\d+|CROSSING)/i.test(dId)) drainRowCount++;
        });
        if (mhRowCount > 0) {
          sewScore += 6;
          reasons.push('MH IDs in rows');
        }
        if (drainRowCount > 0) {
          drnScore += 6;
          reasons.push('Drain IDs in rows');
        }

        // 4. Fallback to available column groups if scores are tied at 0
        const hasDrainCols = Boolean(mapping.size || mapping.length || mapping.gradient);
        const hasSewerCols = Boolean(mapping.gl || mapping.il || mapping.depth);

        let mode = 'DRAINAGE';
        if (sewScore > drnScore) {
          mode = 'SEWERAGE';
        } else if (drnScore > sewScore) {
          mode = 'DRAINAGE';
        } else if (hasDrainCols && hasSewerCols) {
          mode = 'HYBRID';
        } else if (hasSewerCols) {
          mode = 'SEWERAGE';
        }

        setDetectedMode(mode);
        setDetectionReason(reasons.length > 0 ? reasons.join(' • ') : `Auto-detected ${mode}`);
        setColumnMap(mapping);
      };

      // ─────────────────────────────────────────────────────────────
      // EXCEL FILE PARSING VIA SHEETJS (Auto-Finds Best Engineering Sheet)
      // ─────────────────────────────────────────────────────────────
      const isEngineeringHeaderRow = (rowText) => {
        return (
          rowText.includes('manhole no') ||
          rowText.includes('pipe size') ||
          rowText.includes('drain id') ||
          rowText.includes('drain name') ||
          rowText.includes('diameter') ||
          rowText.includes('u-drain') ||
          (rowText.includes('length') && (rowText.includes('grade') || rowText.includes('gradient') || rowText.includes('invert'))) ||
          rowText.includes('invert level')
        );
      };

      const handleFile = (file) => {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });

            // Smart Sheet Picker: Find the first sheet that contains a valid Drainage or Sewerage table
            // (Skips blank cover sheets like 'DNI' or 'COPYPASTE')
            let bestSheet = wb.SheetNames[0];
            for (const sn of wb.SheetNames) {
              if (/^(dni|copypaste|cover|instruction)/i.test(sn.trim())) continue;
              const ws = wb.Sheets[sn];
              const previewArr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }).slice(0, 25);
              const foundHeader = previewArr.some(r => isEngineeringHeaderRow(r.join(' ').toLowerCase()));
              if (foundHeader) {
                bestSheet = sn;
                break;
              }
            }

            setWorkbook(wb);
            setFileInfo({
              name: file.name,
              size: (file.size / 1024).toFixed(1) + ' KB',
              sheetNames: wb.SheetNames,
            });

            setActiveSheet(bestSheet);
            setUserDesignMode('AUTO'); // Reset to Smart Auto on new file upload
            parseSheet(wb, bestSheet, file.name);
            showToast(`Loaded "${file.name}" (${bestSheet})!`);
          } catch (err) {
            console.error('Error parsing Excel file:', err);
            alert('Failed to parse Excel file. Please ensure it is a valid .xls, .xlsx, or .xlsm file.');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const parseSheet = (wb, sheetName, fileNameOverride = '') => {
        const ws = wb.Sheets[sheetName];
        if (!ws) return;

        const rawArray = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

        // Scan down to find the true engineering header row
        let headerRowIndex = 0;
        for (let i = 0; i < Math.min(rawArray.length, 35); i++) {
          const rowText = rawArray[i].join(' ').toLowerCase();
          if (isEngineeringHeaderRow(rowText)) {
            headerRowIndex = i;
            break;
          }
        }

        // Collect metadata text from the top letterhead/title rows to help the classifier
        const topBannerText = [
          fileNameOverride || (fileInfo ? fileInfo.name : ''),
          sheetName,
          ...rawArray.slice(0, headerRowIndex + 1).map(r => r.join(' '))
        ].join(' ');

        const jsonData = XLSX.utils.sheet_to_json(ws, {
          defval: '',
          raw: false,
          range: headerRowIndex,
        });

        if (jsonData.length === 0) {
          showToast(`Warning: Sheet "${sheetName}" is empty.`);
          setRawRows([]);
          setColumns([]);
          return;
        }

        const headers = Object.keys(jsonData[0]);
        setColumns(headers);
        setRawRows(jsonData);
        detectColumns(headers, jsonData, topBannerText);
      };

      // ─────────────────────────────────────────────────────────────
      // LOAD DEMO DATASETS
      // ─────────────────────────────────────────────────────────────
      const loadDemo = (type) => {
        let data, name, headers;
        if (type === 'drainage') {
          data = DEMO_DRAINAGE_DATA;
          name = 'MSMA_Road_Drainage_Schedule.xlsx';
          headers = Object.keys(DEMO_DRAINAGE_DATA[0]);
        } else if (type === 'sewerage') {
          data = DEMO_SEWERAGE_DATA;
          name = 'Sewer_Manhole_Schedule.xlsx';
          headers = Object.keys(DEMO_SEWERAGE_DATA[0]);
        } else {
          data = DEMO_MIXED_DATA;
          name = 'Infrastructure_Combined_Schedule.xlsx';
          headers = Object.keys(DEMO_MIXED_DATA[0]);
        }

        setUserDesignMode('AUTO');
        setColumns(headers);
        setRawRows(data);
        setFileInfo({
          name: `${name} (Sample)`,
          size: '14.2 KB',
          sheetNames: ['Schedule'],
        });
        setActiveSheet('Schedule');
        detectColumns(headers, data, name);
        showToast(`Loaded sample ${type} schedule!`);
      };

      const downloadTemplate = () => {
        const wb = XLSX.utils.book_new();
        const wsDrain = XLSX.utils.json_to_sheet(DEMO_DRAINAGE_DATA);
        const wsSewer = XLSX.utils.json_to_sheet(DEMO_SEWERAGE_DATA);
        XLSX.utils.book_append_sheet(wb, wsDrain, 'Drainage_Pipes');
        XLSX.utils.book_append_sheet(wb, wsSewer, 'Sewer_Manholes');
        XLSX.writeFile(wb, 'JRK_AutoCAD_Smart_Schedule_Template.xlsx');
        showToast('Downloaded: JRK_AutoCAD_Smart_Schedule_Template.xlsx');
      };

      // ─────────────────────────────────────────────────────────────
      // AUTOCAD MTEXT STRING GENERATION ENGINE
      // ─────────────────────────────────────────────────────────────
      const buildDrainageCadString = (id, size, length, gradient) => {
        const widthVal = parseFloat(settings.textWidthFactor) || 0.5;
        const widthPrefix = `{\\W${widthVal};`;
        const sizeDisplay = size || '600';
        const gradDisplay = gradient || '1000';

        const lenNum = parseFloat(length);
        const hasValidLen = !isNaN(lenNum) && lenNum >= 0;
        const lenDisplay = hasValidLen
          ? (Number.isInteger(lenNum) ? lenNum.toString() : lenNum.toFixed(1))
          : '0';

        const isShort = hasValidLen && lenNum <= settings.shortPipeThreshold;
        const isMedium = hasValidLen && lenNum > settings.shortPipeThreshold && lenNum <= settings.mediumPipeThreshold;

        let cadString = '';
        let conditionBadge = '';

        if (settings.smartLengthFormatting && isShort) {
          cadString = `${widthPrefix}${id};\\P${sizeDisplay}%%c\\P${lenDisplay}m\\P1:${gradDisplay}}`;
          conditionBadge = `Short Pipe (<= ${settings.shortPipeThreshold}m, 4-Line)`;
        } else if (settings.smartLengthFormatting && isMedium) {
          cadString = `${widthPrefix}${id}; ${sizeDisplay}%%c\\P${lenDisplay}m 1:${gradDisplay}}`;
          conditionBadge = `Medium Pipe (<= ${settings.mediumPipeThreshold}m, 2-Line)`;
        } else {
          cadString = `${widthPrefix}${id}; ${sizeDisplay}%%c ${lenDisplay}m 1:${gradDisplay}}`;
          conditionBadge = settings.smartLengthFormatting
            ? `Long Pipe (> ${settings.mediumPipeThreshold}m, 1-Line)`
            : 'Smart Formatting OFF (1-Line)';
        }

        return { cadString, conditionBadge, sizeDisplay, lenDisplay, gradDisplay };
      };

      const buildSewerageCadString = (id, gl, il, depth) => {
        const widthVal = parseFloat(settings.textWidthFactor) || 0.5;
        const widthPrefix = `{\\W${widthVal};`;
        const numGL = parseFloat(gl);
        const numIL = parseFloat(il);
        let numDepth = parseFloat(depth);

        if (!isNaN(numGL) && !isNaN(numIL)) {
          numDepth = numGL - numIL;
        }

        const glDisplay = !isNaN(numGL) ? numGL.toFixed(2) : (gl || '00.00');
        const ilDisplay = !isNaN(numIL) ? numIL.toFixed(2) : (il || '00.00');
        const depthDisplay = !isNaN(numDepth) ? numDepth.toFixed(2) : (depth || '00.00');

        const cadString = `${widthPrefix}${id};\\PGL: ${glDisplay}m\\PIL: ${ilDisplay}m\\PDEPTH: ${depthDisplay}m}`;
        return { cadString, glDisplay, ilDisplay, depthDisplay };
      };

      const formatRow = (row) => {
        // 1. Raw Data Extraction (with Split-Cell Merger support)
        let sewerIdRaw = String(row[columnMap.sewerId] || '').trim();
        if (columnMap.sewerIdSub) {
          const subVal = String(row[columnMap.sewerIdSub] || '').trim();
          if (/^MH$/i.test(sewerIdRaw) && subVal) {
            sewerIdRaw = `MH-${subVal.replace(/\.0+$/, '')}`;
          } else if (!sewerIdRaw && subVal) {
            sewerIdRaw = subVal.replace(/\.0+$/, '');
          }
        }

        let drainIdRaw = String(row[columnMap.drainId] || '').trim();
        if (columnMap.drainIdSub) {
          const subLetter = String(row[columnMap.drainIdSub] || '').trim();
          if (/^\d+$/.test(drainIdRaw) && /^[A-Z]$/i.test(subLetter)) {
            drainIdRaw = `${drainIdRaw}${subLetter.toUpperCase()}`;
          }
        }

        let glRaw = String(row[columnMap.gl] || '').trim();
        let ilRaw = String(row[columnMap.il] || '').trim();
        let depthRaw = String(row[columnMap.depth] || '').trim();
        let sizeRaw = String(row[columnMap.size] || '').trim();
        let lengthRaw = String(row[columnMap.length] || '').trim();
        let gradRaw = String(row[columnMap.gradient] || '').trim();

        // Check if 3-column split gradient ('1' | ':' | '200') is used in JRK Sewerage sheets
        if (gradRaw === '1' && columnMap.gradient) {
          const gIdx = columns.indexOf(columnMap.gradient);
          if (gIdx !== -1 && gIdx + 2 < columns.length) {
            const colonCell = String(row[columns[gIdx + 1]] || '').trim();
            const denomCell = String(row[columns[gIdx + 2]] || '').trim();
            if (colonCell === ':' && /^\d+(\.\d+)?$/.test(denomCell)) {
              gradRaw = denomCell;
            }
          }
        }

        let ilUpRaw = String(row[columnMap.drainIlUp] || '').trim();
        let ilDownRaw = String(row[columnMap.drainIlDown] || '').trim();

        const cleanNumber = (val) => {
          if (!val) return '';
          if (val.includes('#DIV/0!') || val.includes('#REF!') || val.includes('#VALUE!')) return '?';
          return val.replace(/[^0-9.-]/g, '');
        };

        sizeRaw = cleanNumber(sizeRaw);
        lengthRaw = cleanNumber(lengthRaw);
        glRaw = cleanNumber(glRaw);
        ilRaw = cleanNumber(ilRaw);
        depthRaw = cleanNumber(depthRaw);
        ilUpRaw = cleanNumber(ilUpRaw);
        ilDownRaw = cleanNumber(ilDownRaw);

        if (settings.cleanGradientPrefix) {
          gradRaw = gradRaw.replace(/^1\s*[:/]\s*/i, '');
        }
        gradRaw = cleanNumber(gradRaw);

        // Skip Unit Rows & Sub-Header Rows (e.g., 'ha', 'min', 'm3/s', 'PE FROM MH 1 TO MH 5')
        const rawIdCheck = (sewerIdRaw || drainIdRaw).toUpperCase();
        if (!rawIdCheck || rawIdCheck === 'D' || rawIdCheck === 'ID' || rawIdCheck === 'MANHOLE' || rawIdCheck.startsWith('PE FROM')) {
          return null;
        }

        const hasSewerData = Boolean((glRaw && glRaw !== '?') || (ilRaw && ilRaw !== '?') || (depthRaw && depthRaw !== '?'));
        const hasDrainData = Boolean((sizeRaw && sizeRaw !== '?') || (lengthRaw && lengthRaw !== '?') || (gradRaw && gradRaw !== '?'));

        if (!hasSewerData && !hasDrainData) return null;

        // Decide whether this row is formatted as SEWERAGE or DRAINAGE based on effectiveMode
        let isSewerRow = false;
        if (effectiveMode === 'SEWERAGE') {
          if (!hasSewerData) return null;
          isSewerRow = true;
        } else if (effectiveMode === 'DRAINAGE') {
          if (!hasDrainData) return null;
          isSewerRow = false;
        } else {
          // HYBRID / Dual mode: decide per row
          isSewerRow = hasSewerData && (!hasDrainData || /^MH/i.test(sewerIdRaw));
        }

        let effectiveId = isSewerRow ? (sewerIdRaw || drainIdRaw) : (drainIdRaw || sewerIdRaw);

        // ====================================================================
        // SMART ID SANITIZER: Standardizes messy Excel IDs to match CAD exactly
        // ====================================================================
        if (isSewerRow) {
          if (/^\d+(\.0+)?$/.test(effectiveId)) {
            const cleanInt = effectiveId.replace(/\.0+$/, '');
            effectiveId = `MH-${cleanInt.padStart(2, '0')}`;
          } else if (/^MH\s*-?\s*\d+(\.0+)?$/i.test(effectiveId)) {
            let num = effectiveId.replace(/\.0+$/, '').replace(/[^0-9]/g, '');
            effectiveId = `MH-${num.padStart(2, '0')}`;
          }
        } else {
          if (/^[a-zA-Z]\d+$/.test(effectiveId)) {
            let letter = effectiveId.charAt(0);
            let num = effectiveId.substring(1);
            if (num.length === 1) effectiveId = `${letter}0${num}`;
          }
        }
        // ====================================================================

        if (!effectiveId || effectiveId === '?') return null;

        // Calculate Lowest Invert Level on this row (works for BOTH Sewerage and Drainage!)
        const candidateILs = [ilRaw, ilDownRaw, ilUpRaw]
          .map(v => parseFloat(v))
          .filter(n => !isNaN(n));
        const effectiveIL = candidateILs.length > 0 ? Math.min(...candidateILs) : NaN;

        if (isSewerRow) {
          const sewBuilt = buildSewerageCadString(
            effectiveId,
            glRaw,
            !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : ilRaw,
            depthRaw
          );
          const visualLines = sewBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').replace(/%%c/g, 'Ø').split('\\P');
          return {
            id: effectiveId,
            category: 'SEWERAGE',
            cadString: sewBuilt.cadString,
            conditionBadge: 'Manhole (4-Line Label)',
            visualLines,
            effectiveIL,
            drainDetails: { size: sizeRaw, length: lengthRaw, gradient: gradRaw, il: !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : '' },
            sewerDetails: { gl: sewBuilt.glDisplay, il: sewBuilt.ilDisplay, depth: sewBuilt.depthDisplay },
            rawRow: row,
          };
        } else {
          const drnBuilt = buildDrainageCadString(effectiveId, sizeRaw, lengthRaw, gradRaw);
          const visualLines = drnBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').replace(/%%c/g, 'Ø').split('\\P');
          return {
            id: effectiveId,
            category: 'DRAINAGE',
            cadString: drnBuilt.cadString,
            conditionBadge: drnBuilt.conditionBadge,
            visualLines,
            effectiveIL,
            drainDetails: {
              size: drnBuilt.sizeDisplay,
              length: drnBuilt.lenDisplay,
              gradient: drnBuilt.gradDisplay,
              il: !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : '',
            },
            sewerDetails: { gl: glRaw, il: ilRaw, depth: depthRaw },
            rawRow: row,
          };
        }
      };

      // ─────────────────────────────────────────────────────────────
      // PROCESS ROWS & SMART LOWEST-IL DEDUPLICATION (SEWERAGE + DRAINAGE)
      // ─────────────────────────────────────────────────────────────
      const processedRows = useMemo(() => {
        const rawFormatted = rawRows.map((r, i) => formatRow(r, i)).filter(Boolean);
        const uniqueMap = new Map();

        rawFormatted.forEach(item => {
          const cleanId = item.id.toUpperCase();

          if (!uniqueMap.has(cleanId)) {
            uniqueMap.set(cleanId, { ...item, duplicateCount: 1 });
          } else {
            // DUPLICATE ID FOUND (In Either Sewerage OR Drainage):
            // Always compare Invert Levels and keep the record with the LOWEST Invert Level!
            const existing = uniqueMap.get(cleanId);
            const dupCount = (existing.duplicateCount || 1) + 1;
            const existingIL = existing.effectiveIL;
            const newIL = item.effectiveIL;

            const newIsLower = (!isNaN(newIL) && (isNaN(existingIL) || newIL < existingIL));

            if (item.category === 'SEWERAGE') {
              if (newIsLower) {
                const gl = parseFloat(item.sewerDetails.gl) || parseFloat(existing.sewerDetails.gl) || 0;
                const sewBuilt = buildSewerageCadString(item.id, gl.toFixed(2), newIL.toFixed(2), '');
                const updatedItem = {
                  ...item,
                  duplicateCount: dupCount,
                  effectiveIL: newIL,
                  cadString: sewBuilt.cadString,
                  sewerDetails: { gl: sewBuilt.glDisplay, il: sewBuilt.ilDisplay, depth: sewBuilt.depthDisplay },
                  conditionBadge: `Merged ${dupCount} Rows (Lowest IL: ${newIL.toFixed(2)}m)`,
                  visualLines: sewBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').split('\\P'),
                };
                uniqueMap.set(cleanId, updatedItem);
              } else {
                const bestILText = !isNaN(existingIL) ? `${existingIL.toFixed(2)}m` : 'Kept';
                existing.duplicateCount = dupCount;
                existing.conditionBadge = `Merged ${dupCount} Rows (Lowest IL: ${bestILText})`;
              }
            } else {
              // DRAINAGE DUPLICATE: Also takes the row with the LOWEST Invert Level!
              if (newIsLower) {
                const updatedItem = {
                  ...item,
                  duplicateCount: dupCount,
                  effectiveIL: newIL,
                  conditionBadge: `${item.conditionBadge} • Lowest IL (${newIL.toFixed(2)}m of ${dupCount})`,
                };
                uniqueMap.set(cleanId, updatedItem);
              } else {
                const bestILText = !isNaN(existingIL) ? `${existingIL.toFixed(2)}m` : 'Kept';
                existing.duplicateCount = dupCount;
                if (!existing.conditionBadge.includes('Lowest IL')) {
                  existing.conditionBadge = `${existing.conditionBadge} • Lowest IL (${bestILText} of ${dupCount})`;
                }
              }
            }
          }
        });

        return Array.from(uniqueMap.values());
      }, [rawRows, columnMap, settings, effectiveMode]);

      // Filtered rows for table view
      const filteredRows = useMemo(() => {
        return processedRows.filter(item => {
          if (filterCategory === 'DRAINAGE' && item.category !== 'DRAINAGE') return false;
          if (filterCategory === 'SEWERAGE' && item.category !== 'SEWERAGE') return false;
          if (filterCategory === 'SHORT' && !item.conditionBadge.includes('Short')) return false;
          if (filterCategory === 'MEDIUM' && !item.conditionBadge.includes('Medium')) return false;
          if (filterCategory === 'LONG' && !item.conditionBadge.includes('Long')) return false;
          if (filterCategory === 'MERGED' && !(item.duplicateCount > 1)) return false;

          if (!searchTerm.trim()) return true;
          const s = searchTerm.toLowerCase();
          return (
            item.id.toLowerCase().includes(s) ||
            item.cadString.toLowerCase().includes(s) ||
            item.conditionBadge.toLowerCase().includes(s)
          );
        });
      }, [processedRows, searchTerm, filterCategory]);

      // Summary Statistics
      const stats = useMemo(() => {
        const total = processedRows.length;
        const drainageCount = processedRows.filter(r => r.category === 'DRAINAGE').length;
        const sewerageCount = processedRows.filter(r => r.category === 'SEWERAGE').length;
        const shortCount = processedRows.filter(r => r.conditionBadge.includes('Short')).length;
        const medCount = processedRows.filter(r => r.conditionBadge.includes('Medium')).length;
        const longCount = processedRows.filter(r => r.conditionBadge.includes('Long') || r.conditionBadge.includes('OFF')).length;
        const mergedCount = processedRows.filter(r => r.duplicateCount > 1).length;
        return { total, drainageCount, sewerageCount, shortCount, medCount, longCount, mergedCount };
      }, [processedRows]);

      // ─────────────────────────────────────────────────────────────
      // CSV EXPORT ENGINES
      // ─────────────────────────────────────────────────────────────
      const exportCSV = () => {
        if (processedRows.length === 0) {
          alert('No data to export.');
          return;
        }
        const csvLines = processedRows.map(item => {
          const id = escapeCSV(item.id);
          const category = escapeCSV(item.category);
          let val1, val2, val3;
          if (item.category === 'SEWERAGE') {
            val1 = escapeCSV(item.sewerDetails.gl || '00.00');
            val2 = escapeCSV(item.sewerDetails.il || '00.00');
            val3 = escapeCSV(item.sewerDetails.depth || '00.00');
          } else {
            val1 = escapeCSV(item.drainDetails.size || '600');
            val2 = escapeCSV(item.drainDetails.length || '0');
            val3 = escapeCSV(item.drainDetails.gradient || '1000');
          }
          return `${id},${val1},${val2},${val3},${category}`;
        });

        const csvContent = csvLines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'AutoCAD_Smart_Raw.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('Exported "AutoCAD_Smart_Raw.csv" (5-column format)!');
      };

      const exportMtextCSV = () => {
        if (processedRows.length === 0) {
          alert('No data to export.');
          return;
        }
        const csvLines = processedRows.map(item => {
          const col1 = escapeCSV(item.id);
          const col2 = escapeCSV(item.cadString);
          return `${col1},${col2}`;
        });

        const csvContent = csvLines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'AutoCAD_Smart_Import.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('Exported "AutoCAD_Smart_Import.csv" (2-column MTEXT)!');
      };

      const copyEntireCSV = () => {
        if (processedRows.length === 0) return;
        const csvContent = processedRows
          .map(item => `${escapeCSV(item.id)},${escapeCSV(item.cadString)}`)
          .join('\r\n');
        navigator.clipboard.writeText(csvContent).then(() => {
          showToast('Copied 2-column CSV directly to Clipboard!');
        });
      };

      const copySingleString = (str) => {
        navigator.clipboard.writeText(str).then(() => {
          showToast('Copied CAD string to Clipboard!');
        });
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* ─────────────────────────────────────────────────────────
              1. TOP HEADER BAR WITH JRK BRANDING & THEME TOGGLE
          ───────────────────────────────────────────────────────── */}
          <header className="border-b border-cadslate-800 bg-cadslate-900/95 backdrop-blur sticky top-0 z-40 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
              {/* JRK Corporate Brand & App Title */}
              <div className="flex items-center space-x-3.5">


                <div>
                  <div className="flex items-center space-x-2">
                    <h1 className="text-sm sm:text-base font-bold text-white tracking-tight">AutoCAD Smart XLS-to-CSV Bridge</h1>
                    <span className="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded-full bg-cadcyan-500/15 text-cadcyan-400 border border-cadcyan-500/30">
                      v2.5 JRK
                    </span>
                  </div>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    ODI Infrastructure Suite • Drainage & Sewerage MTEXT Automation
                  </p>
                </div>
              </div>

              {/* Action Buttons & Dark/Light Mode Toggle */}
              <div className="flex items-center space-x-2 sm:space-x-2.5">
                {/* Dark / Light Mode Toggle Button */}
                <button
                  type="button"
                  onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')}
                  className="inline-flex items-center space-x-1.5 px-3 py-1.5 text-xs font-semibold text-slate-200 bg-cadslate-800 hover:bg-cadslate-750 rounded-lg border border-cadslate-700 transition"
                  title={theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Night (Dark) Mode'}
                >
                  {theme === 'dark' ? (
                    <>
                      <svg className="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                      </svg>
                      <span className="hidden md:inline">Light Mode</span>
                    </>
                  ) : (
                    <>
                      <svg className="w-4 h-4 text-cadcyan-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                      </svg>
                      <span className="hidden md:inline">Night Mode</span>
                    </>
                  )}
                </button>

                <button

                      onChange={(e) => setFeedbackText(e.target.value)}
                      placeholder="Describe the Excel file, column, or AutoLISP command issue..."
                      className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg p-2.5 text-white focus:border-amber-500 resize-y"
                    />
                  </div>
                </div>

                <div className="flex items-center justify-end space-x-3 pt-4 border-t border-cadslate-800">
                  <button type="button" onClick={() => setIsFeedbackOpen(false)} className="px-4 py-2 text-xs text-slate-400 hover:text-white">
                    Cancel
                  </button>
                  <button type="button" onClick={sendFeedbackEmail} className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-lg text-xs transition">
                    Send via Email
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ─────────────────────────────────────────────────────────
              CAD LISP INTEGRATION GUIDE MODAL
          ───────────────────────────────────────────────────────── */}
          {isGuideOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-cadslate-900 border border-cadslate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between border-b border-cadslate-800 pb-3">
                  <div className="flex items-center space-x-2 text-white font-bold text-base">
                    <svg className="w-5 h-5 text-cadcyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                    <span>AutoCAD / GstarCAD Workflow</span>
                  </div>
                  <button onClick={() => setIsGuideOpen(false)} className="text-slate-400 hover:text-white p-1 rounded-lg">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                  <div className="p-3 rounded-lg bg-cadslate-950 border border-cadslate-800">
                    <div className="font-bold text-cadcyan-400 mb-1">Step 1: Upload & Verify Design Mode</div>
                    <p className="text-slate-400">
                      Drop your JRK Excel file. The app auto-detects <strong className="text-white">Drainage</strong> or <strong className="text-white">Sewerage</strong> (or you can click the mode buttons at the top to switch manually). Duplicate IDs automatically retain the lowest Invert Level.
                    </p>
                  </div>
                  <div className="p-3 rounded-lg bg-cadslate-950 border border-cadslate-800">
                    <div className="font-bold text-cadcyan-400 mb-1">Step 2: Export Smart Raw .CSV</div>
                    <p className="text-slate-400">
                      Click <strong className="text-white">"Export Smart Raw .CSV (5-Column)"</strong> to download <code className="text-cadcyan-400">AutoCAD_Smart_Raw.csv</code>.
                    </p>
                  </div>
                  <div className="p-3 rounded-lg bg-cadslate-950 border border-cadslate-800">
                    <div className="font-bold text-cadcyan-400 mb-1">Step 3: Run CSVUPDATE in AutoCAD / GstarCAD</div>
                    <p className="text-slate-400">
                      Type <code className="text-cadcyan-400">CSVUPDATE</code>, select the exported CSV file, and click one text on the target layer. Missing items are highlighted in <strong className="text-red-400">Red</strong> and duplicate CAD IDs in <strong className="text-blue-400">Blue</strong>.
                    </p>
                  </div>
                </div>

                <div className="text-right pt-2 border-t border-cadslate-800">
                  <button type="button" onClick={() => setIsGuideOpen(false)} className="px-4 py-2 bg-cadcyan-500 hover:bg-cadcyan-400 text-black font-bold rounded-lg text-xs transition">
                    Got it
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-20 right-6 z-50 bg-cadcyan-500 text-black font-bold text-xs px-4 py-2.5 rounded-xl shadow-2xl flex items-center space-x-2">
              <svg className="w-4 h-4 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
              </svg>
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
