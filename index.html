<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCAD Smart XLS-to-CSV Bridge | Engineering MTEXT Formatter</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cadslate: {
              950: '#070a13',
              900: '#0c1222',
              850: '#11192e',
              800: '#17223b',
              750: '#1e2b4a',
              700: '#233355',
              600: '#334873',
              500: '#4a6499',
              400: '#647ea8',
            },
            cadcyan: {
              300: '#67e8f9',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            },
            cademerald: {
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- SheetJS (xlsx) CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for In-Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0c1222;
    }
    ::-webkit-scrollbar-thumb {
      background: #233355;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334873;
    }

    /* CAD Canvas Simulation Style */
    .cad-preview-box {
      background-color: #000000;
      background-image: 
        radial-gradient(#1e293b 0.75px, transparent 0.75px),
        radial-gradient(#1e293b 0.75px, #000000 0.75px);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-cadslate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cadcyan-500 selection:text-black">

  <div id="root" class="flex flex-col min-h-screen"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Default configuration rules (Saved in LocalStorage)
    const STORAGE_KEY = 'autocad_smart_bridge_settings';
    const DEFAULT_SETTINGS = {
      textWidthFactor: 0.5,
      shortPipeThreshold: 6,
      mediumPipeThreshold: 14,
      smartLengthFormatting: true,
      cleanGradientPrefix: true, // cleans '1:' if already present in gradient
    };

    // Realistic Demo Datasets for 1-Click Testing
    const DEMO_DRAINAGE_DATA = [
      { 'Pipe ID': 'D01', 'Diameter': '600', 'Length': 4.5, 'Gradient': '1000' },
      { 'Pipe ID': 'D02', 'Diameter': '600', 'Length': 6.0, 'Gradient': '1000' },
      { 'Pipe ID': 'D03', 'Diameter': '900', 'Length': 8.5, 'Gradient': '800' },
      { 'Pipe ID': 'D04', 'Diameter': '900', 'Length': 12.0, 'Gradient': '800' },
      { 'Pipe ID': 'D05', 'Diameter': '1200', 'Length': 14.0, 'Gradient': '500' },
      { 'Pipe ID': 'D06', 'Diameter': '1200', 'Length': 22.5, 'Gradient': '500' },
      { 'Pipe ID': 'D07', 'Diameter': '1500', 'Length': 30.0, 'Gradient': '400' },
    ];

    const DEMO_SEWERAGE_DATA = [
      { 'Manhole': 'MH01', 'Ground Level': '34.50', 'Invert Level': '32.10', 'Depth': '2.40' },
      { 'Manhole': 'MH02', 'Ground Level': '34.20', 'Invert Level': '31.60', 'Depth': '2.60' },
      { 'Manhole': 'MH03', 'Ground Level': '33.85', 'Invert Level': '30.95', 'Depth': '2.90' },
      { 'Manhole': 'MH04', 'Ground Level': '33.40', 'Invert Level': '30.10', 'Depth': '3.30' },
      { 'Manhole': 'MH05', 'Ground Level': '32.90', 'Invert Level': '29.20', 'Depth': '3.70' },
      { 'Manhole': 'MH06', 'Ground Level': '32.10', 'Invert Level': '28.00', 'Depth': '4.10' },
    ];

    const DEMO_MIXED_DATA = [
      { 'ID': 'P101', 'Size': '600', 'Length': '5.2', 'Gradient': '1000', 'GL': '', 'IL': '', 'Depth': '' },
      { 'ID': 'P102', 'Size': '900', 'Length': '10.5', 'Gradient': '800', 'GL': '', 'IL': '', 'Depth': '' },
      { 'ID': 'P103', 'Size': '1200', 'Length': '24.0', 'Gradient': '500', 'GL': '', 'IL': '', 'Depth': '' },
      { 'ID': 'SMH-01', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '42.10', 'IL': '39.80', 'Depth': '2.30' },
      { 'ID': 'SMH-02', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '41.80', 'IL': '39.00', 'Depth': '2.80' },
      { 'ID': 'SMH-03', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '41.20', 'IL': '38.00', 'Depth': '3.20' },
    ];

    // Helper: Escape CSV cell value according to RFC 4180
    function escapeCSV(val) {
      if (val === null || val === undefined) return '';
      const str = String(val);
      if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    // Helper: Normalize string for fuzzy matching (case-insensitive, trims & strips extra symbols)
    function cleanStr(s) {
      return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function App() {
      // 1. Settings state (persisted to LocalStorage)
      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SETTINGS;
        } catch (e) {
          return DEFAULT_SETTINGS;
        }
      });

      // Modals
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isGuideOpen, setIsGuideOpen] = useState(false);
      const [showManualMapper, setShowManualMapper] = useState(false);

      // 2. Excel Parsing States
      const [fileInfo, setFileInfo] = useState(null); // { name, size, sheetNames }
      const [activeSheet, setActiveSheet] = useState('');
      const [workbook, setWorkbook] = useState(null);
      const [rawRows, setRawRows] = useState([]);
      const [columns, setColumns] = useState([]); // List of headers in sheet

      // 3. Smart Column Mapping State
      const [columnMap, setColumnMap] = useState({
        // Drainage columns
        drainId: '',
        size: '',
        length: '',
        gradient: '',
        // Sewerage columns
        sewerId: '',
        gl: '',
        il: '',
        depth: '',
      });

      // Detected network mode: 'DRAINAGE', 'SEWERAGE', 'HYBRID', or 'UNSET'
      const [detectedMode, setDetectedMode] = useState('UNSET');

      // 4. UI search & filter
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL'); // ALL, DRAINAGE, SEWERAGE, SHORT, MEDIUM, LONG
      const [toastMsg, setToastMsg] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);

      // Save settings to LocalStorage whenever they change
      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (e) {
          console.error('Failed to save settings:', e);
        }
      }, [settings]);

      // Show temporary toast notification
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // ─────────────────────────────────────────────────────────────
      // SMART HEADER AUTO-DETECTION (Fuzzy Matching Engine)
      // ─────────────────────────────────────────────────────────────
      const detectColumns = (headerList) => {
        const mapping = {
          drainId: '',
          size: '',
          length: '',
          gradient: '',
          sewerId: '',
          gl: '',
          il: '',
          depth: '',
        };

        // Fuzzy match rules
        // Group A: Drainage rules
        const drainRules = {
          drainId: [
            /^(drain\s*name|pipe\s*id|drain\s*id|pipe\s*name|line\s*id|drain\s*no|pipe\s*no|line\s*no)$/i,
            /^(id|label|mark|tag)$/i,
          ],
          size: [
            /^(size|dia|diameter|pipe\s*size|drain\s*size|pipe\s*dia|width|span|dia\s*\(mm\)|size\s*\(mm\))$/i,
            /(dia|diameter|size)/i,
          ],
          length: [
            /^(length|len|pipe\s*len|pipe\s*length|distance|dist|run|length\s*\(m\)|len\s*\(m\))$/i,
            /(length|len)/i,
          ],
          gradient: [
            /^(gradient|grad|1:?|slope|fall|grade|ratio|gradient\s*\(1:s\))$/i,
            /(gradient|grad|slope)/i,
          ],
        };

        // Group B: Sewerage rules
        const sewerRules = {
          sewerId: [
            /^(mh|manhole|sewer\s*id|mh\s*no|manhole\s*no|mh\s*id|node|node\s*id|chamber|structure\s*id)$/i,
            /^(id|label|mark)$/i,
          ],
          gl: [
            /^(gl|ground\s*level|ground|cover\s*level|cl|surface\s*level|gl\s*\(m\)|top\s*level|rl\s*gl)$/i,
            /(ground\s*level|^gl$|cover\s*level)/i,
          ],
          il: [
            /^(il|invert\s*level|invert|sump\s*il|sewer\s*il|il\s*\(m\)|soffit|rl\s*il)$/i,
            /(invert\s*level|^il$)/i,
          ],
          depth: [
            /^(depth|mh\s*depth|manhole\s*depth|drop|depth\s*\(m\))$/i,
            /(depth)/i,
          ],
        };

        // Match drainage fields
        Object.entries(drainRules).forEach(([field, patterns]) => {
          for (const pattern of patterns) {
            const found = headerList.find(h => pattern.test(String(h).trim()));
            if (found && !mapping[field]) {
              mapping[field] = found;
              break;
            }
          }
        });

        // Match sewerage fields
        Object.entries(sewerRules).forEach(([field, patterns]) => {
          for (const pattern of patterns) {
            const found = headerList.find(h => pattern.test(String(h).trim()));
            if (found && !mapping[field]) {
              mapping[field] = found;
              break;
            }
          }
        });

        // Fallback for ID: if only generic ID was found
        const genericId = headerList.find(h => /^(id|no|name)$/i.test(String(h).trim()));
        if (genericId) {
          if (!mapping.drainId) mapping.drainId = genericId;
          if (!mapping.sewerId) mapping.sewerId = genericId;
        }

        // Determine detected mode
        const hasDrain = Boolean(mapping.size || mapping.length || mapping.gradient);
        const hasSewer = Boolean(mapping.gl || mapping.il || mapping.depth);

        let mode = 'UNSET';
        if (hasDrain && hasSewer) mode = 'HYBRID';
        else if (hasSewer) mode = 'SEWERAGE';
        else if (hasDrain) mode = 'DRAINAGE';
        else mode = 'DRAINAGE'; // Default

        setDetectedMode(mode);
        setColumnMap(mapping);
      };

      // ─────────────────────────────────────────────────────────────
      // EXCEL FILE PARSING VIA SHEETJS
      // ─────────────────────────────────────────────────────────────
      const handleFile = (file) => {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            
            setWorkbook(wb);
            setFileInfo({
              name: file.name,
              size: (file.size / 1024).toFixed(1) + ' KB',
              sheetNames: wb.SheetNames,
            });

            const firstSheet = wb.SheetNames[0];
            setActiveSheet(firstSheet);
            parseSheet(wb, firstSheet);
            showToast(`Loaded ${file.name} successfully!`);
          } catch (err) {
            console.error('Error parsing Excel file:', err);
            alert('Failed to parse Excel file. Please ensure it is a valid .xls, .xlsx, or .xlsm file.');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const parseSheet = (wb, sheetName) => {
        const ws = wb.Sheets[sheetName];
        if (!ws) return;

        // Parse JSON with raw = false to preserve formatted numbers/text
        const jsonData = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
        if (jsonData.length === 0) {
          showToast(`Warning: Sheet "${sheetName}" is empty.`);
          setRawRows([]);
          setColumns([]);
          return;
        }

        const headers = Object.keys(jsonData[0]);
        setColumns(headers);
        setRawRows(jsonData);
        detectColumns(headers);
      };

      // ─────────────────────────────────────────────────────────────
      // LOAD DEMO DATASETS (Drainage, Sewerage, Mixed)
      // ─────────────────────────────────────────────────────────────
      const loadDemo = (type) => {
        let data, name, headers;
        if (type === 'drainage') {
          data = DEMO_DRAINAGE_DATA;
          name = 'MSMA_Road_Drainage_Schedule.xlsx';
          headers = ['Pipe ID', 'Diameter', 'Length', 'Gradient'];
        } else if (type === 'sewerage') {
          data = DEMO_SEWERAGE_DATA;
          name = 'Sewer_Manhole_Schedule.xlsx';
          headers = ['Manhole', 'Ground Level', 'Invert Level', 'Depth'];
        } else {
          data = DEMO_MIXED_DATA;
          name = 'Infrastructure_Combined_Schedule.xlsx';
          headers = ['ID', 'Size', 'Length', 'Gradient', 'GL', 'IL', 'Depth'];
        }

        setColumns(headers);
        setRawRows(data);
        setFileInfo({
          name: `${name} (Sample)`,
          size: '12.8 KB',
          sheetNames: ['Schedule'],
        });
        setActiveSheet('Schedule');
        detectColumns(headers);
        showToast(`Loaded sample ${type} schedule!`);
      };

      // Download an Excel Template for Users
      const downloadTemplate = () => {
        const wb = XLSX.utils.book_new();
        const wsDrain = XLSX.utils.json_to_sheet(DEMO_DRAINAGE_DATA);
        const wsSewer = XLSX.utils.json_to_sheet(DEMO_SEWERAGE_DATA);
        XLSX.utils.book_append_sheet(wb, wsDrain, 'Drainage_Pipes');
        XLSX.utils.book_append_sheet(wb, wsSewer, 'Sewer_Manholes');
        XLSX.writeFile(wb, 'AutoCAD_Smart_Schedule_Template.xlsx');
        showToast('Downloaded: AutoCAD_Smart_Schedule_Template.xlsx');
      };

      // ─────────────────────────────────────────────────────────────
      // AUTOCAD MTEXT STRING GENERATION ENGINE (Core Rule Engine)
      // ─────────────────────────────────────────────────────────────
      const formatRow = (row, index) => {
        const widthVal = parseFloat(settings.textWidthFactor) || 0.5;
        const widthPrefix = `{\\W${widthVal};`;

        // Extract raw values for Sewerage
        const sewerIdRaw = String(row[columnMap.sewerId] || '').trim();
        const glRaw = String(row[columnMap.gl] || '').trim().replace(/m$/i, '');
        const ilRaw = String(row[columnMap.il] || '').trim().replace(/m$/i, '');
        let depthRaw = String(row[columnMap.depth] || '').trim().replace(/m$/i, '');

        // Extract raw values for Drainage
        const drainIdRaw = String(row[columnMap.drainId] || '').trim();
        const sizeRaw = String(row[columnMap.size] || '').trim().replace(/%%c/g, '').replace(/mm$/i, '');
        const lengthRaw = String(row[columnMap.length] || '').trim().replace(/m$/i, '');
        let gradRaw = String(row[columnMap.gradient] || '').trim();

        // Standardize Gradient: if user entered '1:1000' or '1 / 1000', strip '1:' or '1/'
        if (settings.cleanGradientPrefix) {
          gradRaw = gradRaw.replace(/^1\s*[:/]\s*/i, '');
        }

        // Check if row has Sewerage data
        const hasSewerData = Boolean(glRaw || ilRaw || depthRaw);
        // Check if row has Drainage data
        const hasDrainData = Boolean(sizeRaw || lengthRaw || gradRaw);

        let rowCategory = 'DRAINAGE';
        let cadString = '';
        let conditionBadge = '';
        let effectiveId = '';

        if (hasSewerData && (!hasDrainData || detectedMode === 'SEWERAGE')) {
          // ─── SEWERAGE MANHOLE FORMATTING RULE ───
          rowCategory = 'SEWERAGE';
          effectiveId = sewerIdRaw || drainIdRaw || `MH_${index + 1}`;

          // If depth is not provided but GL & IL are numbers, compute depth = GL - IL
          if (!depthRaw && glRaw && ilRaw) {
            const numGL = parseFloat(glRaw);
            const numIL = parseFloat(ilRaw);
            if (!isNaN(numGL) && !isNaN(numIL)) {
              depthRaw = (numGL - numIL).toFixed(2);
            }
          }

          const glDisplay = glRaw || '00.00';
          const ilDisplay = ilRaw || '00.00';
          const depthDisplay = depthRaw || '0.00';

          // Rule: {\W[Width];[ID];\PGL: [GL]m\PIL: [IL]m\PDEPTH: [Depth]m}
          cadString = `${widthPrefix}${effectiveId};\\PGL: ${glDisplay}m\\PIL: ${ilDisplay}m\\PDEPTH: ${depthDisplay}m}`;
          conditionBadge = 'Manhole (4-Line Label)';
        } else {
          // ─── DRAINAGE PIPING FORMATTING RULES ───
          rowCategory = 'DRAINAGE';
          effectiveId = drainIdRaw || sewerIdRaw || `P_${index + 1}`;
          const sizeDisplay = sizeRaw || '600';
          const gradDisplay = gradRaw || '1000';

          const lenNum = parseFloat(lengthRaw);
          const hasValidLen = !isNaN(lenNum) && lenNum >= 0;
          const lenDisplay = hasValidLen 
            ? (Number.isInteger(lenNum) ? lenNum.toString() : lenNum.toFixed(1))
            : (lengthRaw || '0');

          const isShort = hasValidLen && lenNum <= settings.shortPipeThreshold;
          const isMedium = hasValidLen && lenNum > settings.shortPipeThreshold && lenNum <= settings.mediumPipeThreshold;

          if (settings.smartLengthFormatting && isShort) {
            // Condition A (Length <= [ShortThreshold]): 4 Paragraphs
            // {\W[Width];[ID];\P[Size]%%c\P[Length]m\P1:[Gradient]}
            cadString = `${widthPrefix}${effectiveId};\\P${sizeDisplay}%%c\\P${lenDisplay}m\\P1:${gradDisplay}}`;
            conditionBadge = `Short Pipe (<= ${settings.shortPipeThreshold}m, 4-Line)`;
          } else if (settings.smartLengthFormatting && isMedium) {
            // Condition B (Length > [ShortThreshold] AND <= [MedThreshold]): 2 Paragraphs
            // {\W[Width];[ID]; [Size]%%c\P[Length]m 1:[Gradient]}
            cadString = `${widthPrefix}${effectiveId}; ${sizeDisplay}%%c\\P${lenDisplay}m 1:${gradDisplay}}`;
            conditionBadge = `Medium Pipe (<= ${settings.mediumPipeThreshold}m, 2-Line)`;
          } else {
            // Condition C (Length > [MedThreshold] OR Auto-Format OFF): 1 Straight Line
            // {\W[Width];[ID]; [Size]%%c [Length]m 1:[Gradient]}
            cadString = `${widthPrefix}${effectiveId}; ${sizeDisplay}%%c ${lenDisplay}m 1:${gradDisplay}}`;
            conditionBadge = settings.smartLengthFormatting 
              ? `Long Pipe (> ${settings.mediumPipeThreshold}m, 1-Line)`
              : 'Smart Formatting OFF (1-Line)';
          }
        }

        // Simulated visual display lines for CAD canvas rendering
        const visualLines = cadString
          .replace(/^\{\\W[\d.]+;/, '')
          .replace(/\}$/, '')
          .replace(/%%c/g, 'Ø')
          .split('\\P');

        return {
          id: effectiveId,
          category: rowCategory,
          cadString,
          conditionBadge,
          visualLines,
          // Stored extracted attributes for preview
          drainDetails: { size: sizeRaw, length: lengthRaw, gradient: gradRaw },
          sewerDetails: { gl: glRaw, il: ilRaw, depth: depthRaw },
          rawRow: row,
        };
      };

      // Process rows through formatting engine
      const processedRows = useMemo(() => {
        return rawRows.map((r, i) => formatRow(r, i));
      }, [rawRows, columnMap, settings, detectedMode]);

      // Filtered rows for table view
      const filteredRows = useMemo(() => {
        return processedRows.filter(item => {
          // Category / Condition filter
          if (filterCategory === 'DRAINAGE' && item.category !== 'DRAINAGE') return false;
          if (filterCategory === 'SEWERAGE' && item.category !== 'SEWERAGE') return false;
          if (filterCategory === 'SHORT' && !item.conditionBadge.includes('Short')) return false;
          if (filterCategory === 'MEDIUM' && !item.conditionBadge.includes('Medium')) return false;
          if (filterCategory === 'LONG' && !item.conditionBadge.includes('Long')) return false;

          // Text Search
          if (!searchTerm.trim()) return true;
          const s = searchTerm.toLowerCase();
          return (
            item.id.toLowerCase().includes(s) ||
            item.cadString.toLowerCase().includes(s) ||
            item.conditionBadge.toLowerCase().includes(s)
          );
        });
      }, [processedRows, searchTerm, filterCategory]);

      // Summary Statistics
      const stats = useMemo(() => {
        const total = processedRows.length;
        const drainageCount = processedRows.filter(r => r.category === 'DRAINAGE').length;
        const sewerageCount = processedRows.filter(r => r.category === 'SEWERAGE').length;
        const shortCount = processedRows.filter(r => r.conditionBadge.includes('Short')).length;
        const medCount = processedRows.filter(r => r.conditionBadge.includes('Medium')).length;
        const longCount = processedRows.filter(r => r.conditionBadge.includes('Long') || r.conditionBadge.includes('OFF')).length;
        return { total, drainageCount, sewerageCount, shortCount, medCount, longCount };
      }, [processedRows]);

      // ─────────────────────────────────────────────────────────────
      // CSV EXPORT ENGINE (Exactly 2 columns, NO headers)
      // ─────────────────────────────────────────────────────────────
      const exportCSV = () => {
        if (processedRows.length === 0) {
          alert('No data to export. Please upload an Excel file or load demo data first.');
          return;
        }

        // Exactly 2 columns: Column 1 = ID, Column 2 = CAD_String
        const csvLines = processedRows.map(item => {
          const col1 = escapeCSV(item.id);
          const col2 = escapeCSV(item.cadString);
          return `${col1},${col2}`;
        });

        const csvContent = csvLines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'AutoCAD_Smart_Import.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        showToast('Exported "AutoCAD_Smart_Import.csv" successfully!');
      };

      // Copy whole CSV to clipboard
      const copyEntireCSV = () => {
        if (processedRows.length === 0) return;
        const csvContent = processedRows
          .map(item => `${escapeCSV(item.id)},${escapeCSV(item.cadString)}`)
          .join('\r\n');
        navigator.clipboard.writeText(csvContent).then(() => {
          showToast('Copied 2-column CSV directly to Clipboard!');
        });
      };

      // Copy single row string
      const copySingleString = (str) => {
        navigator.clipboard.writeText(str).then(() => {
          showToast(`Copied string to Clipboard!`);
        });
      };

      return (
        <div className="flex flex-col min-h-screen">
          {/* ─────────────────────────────────────────────────────────

                          onChange={(e) => setColumnMap({ ...columnMap, depth: e.target.value })}
                          className="w-full bg-cadslate-950 border border-cadslate-700 rounded p-1.5 text-white focus:border-emerald-500 font-mono"
                        >
                          <option value="">-- None / Compute --</option>
                          {columns.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ─────────────────────────────────────────────────────────
                4. DATA PREVIEW TABLE & STATS BAR
            ───────────────────────────────────────────────────────── */}
            {processedRows.length > 0 && (
              <div className="bg-cadslate-900 border border-cadslate-800 rounded-xl overflow-hidden shadow-2xl space-y-4">
                
                {/* Statistics & Filters Bar */}
                <div className="p-4 bg-cadslate-850 border-b border-cadslate-800 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                  
                  {/* Category Filter Pills */}
                  <div className="flex flex-wrap items-center gap-1.5 text-xs">
                    <button
                      onClick={() => setFilterCategory('ALL')}
                      className={`px-3 py-1.5 rounded-lg font-medium transition ${
                        filterCategory === 'ALL'
                          ? 'bg-cadcyan-600 text-white shadow'
                          : 'bg-cadslate-800 text-slate-300 hover:bg-cadslate-750'
                      }`}
                    >
                      All ({stats.total})
                    </button>
                    {stats.drainageCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('DRAINAGE')}
                        className={`px-3 py-1.5 rounded-lg font-medium transition ${
                          filterCategory === 'DRAINAGE'
                            ? 'bg-cadcyan-600 text-white shadow'
                            : 'bg-cadslate-800 text-slate-300 hover:bg-cadslate-750'
                        }`}
                      >
                        Drainage ({stats.drainageCount})
                      </button>
                    )}
                    {stats.sewerageCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('SEWERAGE')}
                        className={`px-3 py-1.5 rounded-lg font-medium transition ${
                          filterCategory === 'SEWERAGE'
                            ? 'bg-emerald-600 text-white shadow'
                            : 'bg-cadslate-800 text-slate-300 hover:bg-cadslate-750'
                        }`}
                      >
                        Sewerage ({stats.sewerageCount})
                      </button>
                    )}
                    {stats.shortCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('SHORT')}
                        className={`px-2.5 py-1.5 rounded-lg font-medium transition ${
                          filterCategory === 'SHORT'
                            ? 'bg-blue-600 text-white shadow'
                            : 'bg-cadslate-800 text-slate-400 hover:bg-cadslate-750'
                        }`}
                      >
                        Short (4-Line): {stats.shortCount}
                      </button>
                    )}
                    {stats.medCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('MEDIUM')}
                        className={`px-2.5 py-1.5 rounded-lg font-medium transition ${
                          filterCategory === 'MEDIUM'
                            ? 'bg-indigo-600 text-white shadow'
                            : 'bg-cadslate-800 text-slate-400 hover:bg-cadslate-750'
                        }`}
                      >
                        Med (2-Line): {stats.medCount}
                      </button>
                    )}
                    {stats.longCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('LONG')}
                        className={`px-2.5 py-1.5 rounded-lg font-medium transition ${
                          filterCategory === 'LONG'
                            ? 'bg-slate-600 text-white shadow'
                            : 'bg-cadslate-800 text-slate-400 hover:bg-cadslate-750'
                        }`}
                      >
                        Long (1-Line): {stats.longCount}
                      </button>
                    )}
                  </div>

                  {/* Search Input & Quick Copy */}
                  <div className="flex items-center space-x-2">
                    <div className="relative flex-1 md:w-64">
                      <input
                        type="text"
                        placeholder="Search ID or CAD string..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cadcyan-500"
                      />
                      <svg className="w-4 h-4 text-slate-500 absolute left-2.5 top-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                      </svg>
                    </div>

                    <button
                      type="button"
                      onClick={copyEntireCSV}
                      className="px-3 py-1.5 text-xs font-semibold text-slate-200 bg-cadslate-800 hover:bg-cadslate-700 border border-cadslate-700 rounded-lg transition flex items-center space-x-1.5 whitespace-nowrap"
                      title="Copy all 2-column CSV data directly to clipboard"
                    >
                      <svg className="w-3.5 h-3.5 text-cadcyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                      </svg>
                      <span>Copy CSV</span>
                    </button>
                  </div>
                </div>

                {/* The Preview Table */}
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-cadslate-950 text-slate-400 border-b border-cadslate-800 uppercase tracking-wider font-semibold">
                        <th className="py-3 px-4 w-12 text-center">#</th>
                        <th className="py-3 px-4 w-28">Type</th>
                        <th className="py-3 px-4 w-32">CAD ID</th>
                        <th className="py-3 px-4 w-64">Extracted Parameters</th>
                        <th className="py-3 px-4">Generated AutoCAD MTEXT String (Column 2)</th>
                        <th className="py-3 px-4 w-52">Visual CAD Render</th>
                        <th className="py-3 px-4 w-16 text-center">Copy</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-cadslate-800/60 font-mono">
                      {filteredRows.map((row, idx) => (
                        <tr key={idx} className="hover:bg-cadslate-800/40 transition">
                          {/* Row Index */}
                          <td className="py-3 px-4 text-center text-slate-500 font-sans text-[11px]">
                            {idx + 1}
                          </td>

                          {/* Network Type Badge */}
                          <td className="py-3 px-4 font-sans">
                            {row.category === 'SEWERAGE' ? (
                              <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                Sewerage
                              </span>
                            ) : (
                              <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-cadcyan-500/10 text-cadcyan-400 border border-cadcyan-500/20">
                                Drainage
                              </span>
                            )}
                          </td>

                          {/* CAD ID (Column 1) */}
                          <td className="py-3 px-4 font-bold text-white tracking-wide">
                            <span className="bg-cadslate-950 px-2 py-1 rounded border border-cadslate-800 text-cadcyan-300">
                              {row.id}
                            </span>
                          </td>

                          {/* Extracted Details */}
                          <td className="py-3 px-4 font-sans text-xs">
                            {row.category === 'SEWERAGE' ? (
                              <div className="space-y-0.5 text-slate-300">
                                <div><span className="text-slate-500">GL:</span> {row.sewerDetails.gl || '—'}m</div>
                                <div><span className="text-slate-500">IL:</span> {row.sewerDetails.il || '—'}m</div>
                                <div><span className="text-slate-500">Depth:</span> {row.sewerDetails.depth || '—'}m</div>
                              </div>
                            ) : (
                              <div className="space-y-0.5 text-slate-300">
                                <div><span className="text-slate-500">Dia:</span> {row.drainDetails.size || '—'}%%c</div>
                                <div><span className="text-slate-500">Len:</span> {row.drainDetails.length || '—'}m</div>
                                <div><span className="text-slate-500">Slope:</span> 1:{row.drainDetails.gradient || '—'}</div>
                              </div>
                            )}
                            <div className="text-[10px] text-slate-400 italic mt-1 font-mono">
                              {row.conditionBadge}
                            </div>
                          </td>

                          {/* Generated CAD String */}
                          <td className="py-3 px-4">
                            <div className="bg-cadslate-950 text-cadcyan-300 px-3 py-2 rounded-lg border border-cadslate-800 text-[11px] break-all select-all shadow-inner">
                              {row.cadString}
                            </div>
                          </td>

                          {/* Visual CAD Canvas Simulation */}
                          <td className="py-3 px-4">
                            <div className="cad-preview-box text-white p-2.5 rounded-lg border border-cadslate-800 text-xs shadow-inner leading-relaxed font-sans">
                              {row.visualLines.map((line, lidx) => (
                                <div key={lidx} className="whitespace-nowrap truncate font-medium text-slate-100">
                                  {line}
                                </div>
                              ))}
                            </div>
                          </td>

                          {/* Copy Button */}
                          <td className="py-3 px-4 text-center">
                            <button
                              type="button"
                              onClick={() => copySingleString(row.cadString)}
                              className="p-1.5 rounded-md hover:bg-cadslate-750 text-slate-400 hover:text-white transition"
                              title="Copy CAD string"
                            >
                              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                              </svg>
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  {filteredRows.length === 0 && (
                    <div className="text-center py-12 text-slate-500 font-sans text-sm">
                      No records match the active search or category filter.
                    </div>
                  )}
                </div>
              </div>
            )}
          </main>

          {/* ─────────────────────────────────────────────────────────
              5. LARGE BOTTOM FOOTER WITH EXPORT BUTTON
          ───────────────────────────────────────────────────────── */}
          <footer className="border-t border-cadslate-800 bg-cadslate-900/95 backdrop-blur p-4 sticky bottom-0 z-40">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="text-xs text-slate-400 flex items-center space-x-2">
                <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>
                  {processedRows.length > 0
                    ? `Ready to export ${processedRows.length} CAD MTEXT strings (2-column format)`
                    : 'Awaiting spreadsheet upload or sample selection'}
                </span>
              </div>

              <div className="flex items-center space-x-3 w-full sm:w-auto">
                <button
                  type="button"
                  onClick={exportCSV}
                  disabled={processedRows.length === 0}
                  className={`w-full sm:w-auto inline-flex items-center justify-center space-x-2 px-6 py-3 rounded-xl font-bold text-sm tracking-wide shadow-xl transition ${
                    processedRows.length > 0
                      ? 'bg-gradient-to-r from-cadcyan-500 to-cadcyan-600 hover:from-cadcyan-400 hover:to-cadcyan-500 text-cadslate-950 shadow-cadcyan-500/20 cursor-pointer scale-100 hover:scale-[1.02]'
                      : 'bg-cadslate-800 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  <svg className="w-5 h-5 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                  </svg>
                  <span>Export CAD .CSV (AutoCAD_Smart_Import.csv)</span>
                </button>
              </div>
            </div>
          </footer>

          {/* ─────────────────────────────────────────────────────────
              USER SETTINGS MODAL (LocalStorage)
          ───────────────────────────────────────────────────────── */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="bg-cadslate-900 border border-cadslate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-6">
                
                <div className="flex items-center justify-between border-b border-cadslate-800 pb-3">
                  <div className="flex items-center space-x-2 text-white font-bold text-base">
                    <svg className="w-5 h-5 text-cadcyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                    <span>Formatting Settings</span>
                  </div>
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="text-slate-400 hover:text-white p-1 rounded-lg"
                  >
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <div className="space-y-4 text-xs">
                  {/* Text Width Factor */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">
                      Text Width Factor: <span className="text-cadcyan-400 font-mono font-bold">{settings.textWidthFactor}</span>
                    </label>
                    <input
                      type="number"
                      step="0.05"
                      min="0.1"
                      max="2.0"
                      value={settings.textWidthFactor}
                      onChange={(e) => setSettings({ ...settings, textWidthFactor: parseFloat(e.target.value) || 0.5 })}
                      className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg p-2.5 text-white font-mono focus:border-cadcyan-500"
                    />
                    <p className="text-[11px] text-slate-500 mt-1">
                      Injected as <code className="text-cadcyan-300">{\W[Width];...}</code> to condense AutoCAD MTEXT labels.
                    </p>
                  </div>

                  {/* Short Pipe Threshold */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">
                      Short Pipe Threshold: <span className="text-cadcyan-400 font-mono font-bold">{settings.shortPipeThreshold}m</span>
                    </label>
                    <input
                      type="number"
                      step="0.5"
                      min="1"
                      max="100"
                      value={settings.shortPipeThreshold}
                      onChange={(e) => setSettings({ ...settings, shortPipeThreshold: parseFloat(e.target.value) || 6 })}
                      className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg p-2.5 text-white font-mono focus:border-cadcyan-500"
                    />
                    <p className="text-[11px] text-slate-500 mt-1">
                      Pipes ≤ this length get 4 paragraphs (compact multi-line).
                    </p>
                  </div>

                  {/* Medium Pipe Threshold */}
                  <div>
                    <label className="block text-slate-300 font-semibold mb-1">
                      Medium Pipe Threshold: <span className="text-cadcyan-400 font-mono font-bold">{settings.mediumPipeThreshold}m</span>
                    </label>
                    <input
                      type="number"
                      step="0.5"
                      min="1"
                      max="100"
                      value={settings.mediumPipeThreshold}
                      onChange={(e) => setSettings({ ...settings, mediumPipeThreshold: parseFloat(e.target.value) || 14 })}
                      className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg p-2.5 text-white font-mono focus:border-cadcyan-500"
                    />
                    <p className="text-[11px] text-slate-500 mt-1">
                      Pipes between Short and Medium threshold get 2 paragraphs.
                    </p>
                  </div>

                  {/* Smart Length Formatting Switch */}
                  <div className="pt-2 border-t border-cadslate-800 flex items-center justify-between">
                    <div>
                      <div className="font-semibold text-slate-300">Smart Length Formatting</div>
                      <div className="text-[11px] text-slate-500">
                        {settings.smartLengthFormatting
                          ? 'Auto-partitions into 4, 2, or 1 lines based on pipe length'
                          : 'OFF: Forces all pipes into 1 single line format'}
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={() => setSettings({ ...settings, smartLengthFormatting: !settings.smartLengthFormatting })}
                      className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                        settings.smartLengthFormatting ? 'bg-cadcyan-500' : 'bg-cadslate-700'
                      }`}
                    >
                      <span
                        className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${
                          settings.smartLengthFormatting ? 'translate-x-5' : 'translate-x-0'
                        }`}
                      />
                    </button>
                  </div>

                  {/* Clean 1: in gradient */}
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="font-semibold text-slate-300">Clean "1:" Gradient Prefix</div>
                      <div className="text-[11px] text-slate-500">Prevents double prefix ("1:1:500") if Excel already has "1:500"</div>
                    </div>
                    <button
                      type="button"
                      onClick={() => setSettings({ ...settings, cleanGradientPrefix: !settings.cleanGradientPrefix })}
                      className={`relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none ${
                        settings.cleanGradientPrefix ? 'bg-cadcyan-500' : 'bg-cadslate-700'
                      }`}
                    >
                      <span
                        className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow ring-0 transition duration-200 ease-in-out ${
                          settings.cleanGradientPrefix ? 'translate-x-5' : 'translate-x-0'
                        }`}
                      />
                    </button>
                  </div>
                </div>

                <div className="flex items-center justify-between pt-4 border-t border-cadslate-800">
                  <button
                    type="button"
                    onClick={() => setSettings(DEFAULT_SETTINGS)}
                    className="text-xs text-slate-400 hover:text-white"
                  >
                    Reset Defaults
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setIsSettingsOpen(false);
                      showToast('Settings saved to LocalStorage!');
                    }}
                    className="px-4 py-2 bg-cadcyan-600 hover:bg-cadcyan-500 text-cadslate-950 font-bold rounded-lg text-xs transition"
                  >
                    Done & Save
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ─────────────────────────────────────────────────────────
              CAD LISP INTEGRATION GUIDE MODAL
          ───────────────────────────────────────────────────────── */}
          {isGuideOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm animate-fade-in">
              <div className="bg-cadslate-900 border border-cadslate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5">
                
                <div className="flex items-center justify-between border-b border-cadslate-800 pb-3">
                  <div className="flex items-center space-x-2 text-white font-bold text-base">
                    <svg className="w-5 h-5 text-cadcyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                    <span>AutoCAD / GstarCAD Workflow</span>
                  </div>
                  <button
                    onClick={() => setIsGuideOpen(false)}
                    className="text-slate-400 hover:text-white p-1 rounded-lg"
                  >
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-300 leading-relaxed font-sans">
                  <div className="p-3 rounded-lg bg-cadslate-950 border border-cadslate-800">
                    <div className="font-bold text-cadcyan-300 mb-1">Step 1: Export CSV from this Web App</div>
                    <p className="text-slate-400">
                      Upload your Excel calculation sheet, verify the Preview table, and click <strong className="text-white">"Export CAD .CSV"</strong>. A 2-column file named <code className="text-cadcyan-400">AutoCAD_Smart_Import.csv</code> will be downloaded.
                    </p>
                  </div>

                  <div className="p-3 rounded-lg bg-cadslate-950 border border-cadslate-800">
                    <div className="font-bold text-cadcyan-300 mb-1">Step 2: Run CSVUPDATE in AutoCAD / GstarCAD</div>
                    <p className="text-slate-400">
                      In CAD, load <code className="text-cadcyan-400">csvupdate.lsp</code> (or run <code className="text-cadcyan-400">LOADALL</code>) and type:
                    </p>
                    <div className="bg-cadslate-900 p-2 mt-1 rounded font-mono text-[11px] text-cadcyan-300 border border-cadslate-800">
                      Command: CSVUPDATE
                    </div>
                  </div>

                  <div className="p-3 rounded-lg bg-cadslate-950 border border-cadslate-800">
                    <div className="font-bold text-cadcyan-300 mb-1">Step 3: Select File & CAD Placeholders</div>
                    <p className="text-slate-400">
                      1. Pick the exported <code className="text-cadcyan-400">AutoCAD_Smart_Import.csv</code> file.<br/>
                      2. Click any reference text to match target layer (or press Enter for all).<br/>
                      3. Select placeholder texts (e.g. <code className="text-white">P101</code>, <code className="text-white">MH01</code>).<br/>
                      4. Every placeholder is instantly replaced with its formatted MTEXT string!
                    </p>
                  </div>
                </div>

                <div className="text-right pt-2 border-t border-cadslate-800">
                  <button
                    type="button"
                    onClick={() => setIsGuideOpen(false)}
                    className="px-4 py-2 bg-cadslate-800 hover:bg-cadslate-700 text-white font-medium rounded-lg text-xs transition"
                  >
                    Got it
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-20 right-6 z-50 bg-cadcyan-500 text-cadslate-950 font-bold text-xs px-4 py-2.5 rounded-xl shadow-2xl animate-bounce flex items-center space-x-2">
              <svg className="w-4 h-4 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" />
              </svg>
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    // Render the App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
