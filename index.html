<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCAD XLS-to-CSV Bridge | Engineering MTEXT Formatter</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cadslate: {
              950: '#070a13',
              900: '#0c1222',
              850: '#11192e',
              800: '#17223b',
              700: '#233355',
              600: '#334873',
              500: '#4a6499',
            },
            cadcyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- SheetJS (xlsx) CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for In-Browser JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0c1222;
    }
    ::-webkit-scrollbar-thumb {
      background: #233355;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334873;
    }

    /* CAD Canvas Simulation Style */
    .cad-preview-box {
      background-color: #000000;
      background-image: 
        radial-gradient(#1e293b 0.75px, transparent 0.75px),
        radial-gradient(#1e293b 0.75px, #000000 0.75px);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
    }

    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    .animate-pulse-subtle {
      animation: pulse-subtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>
<body class="bg-cadslate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cadcyan-500 selection:text-black">

  <div id="root" class="flex flex-col min-h-screen"></div>

  <!-- React Application -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Default configuration rules
    const DEFAULT_SETTINGS = {
      textWidthFactor: 0.5,
      shortPipeThreshold: 6,
      mediumPipeThreshold: 14,
      autoFormat: true,
      cleanGradientPrefix: true, // cleans '1:' if already in gradient
    };

    // Realistic Demo Data for 1-Click Testing
    const DEMO_EXCEL_DATA = [
      { ID: 'P101', Type: 'Drain', Code: 'A01', Size: 600, Length: 4.5, Gradient: 1000 },
      { ID: 'P102', Type: 'Drain', Code: 'A01', Size: 600, Length: 6.0, Gradient: 1000 },
      { ID: 'P103', Type: 'Drain', Code: 'A02', Size: 900, Length: 8.5, Gradient: 800 },
      { ID: 'P104', Type: 'Drain', Code: 'A02', Size: 900, Length: 12.0, Gradient: 800 },
      { ID: 'P105', Type: 'Drain', Code: 'A03', Size: 1200, Length: 14.0, Gradient: 500 },
      { ID: 'P106', Type: 'Drain', Code: 'A03', Size: 1200, Length: 22.5, Gradient: 500 },
      { ID: 'S201', Type: 'SIL', Code: '', Size: '', Length: '', Gradient: '' },
      { ID: 'S202', Type: 'SIL', Code: '', Size: '', Length: '', Gradient: '' },
      { ID: 'P107', Type: 'Drain', Code: 'B01', Size: 450, Length: 5.2, Gradient: 250 },
      { ID: 'P108', Type: 'Drain', Code: 'B01', Size: 450, Length: 18.0, Gradient: 250 },
    ];

    function App() {
      // 1. Settings state (persisted to LocalStorage)
      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('autocad_bridge_settings');
          return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SETTINGS;
        } catch (e) {
          return DEFAULT_SETTINGS;
        }
      });

      // Settings Modal Visibility
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isLispModalOpen, setIsLispModalOpen] = useState(false);

      // 2. Excel Parsing States
      const [fileInfo, setFileInfo] = useState(null); // { name, size, sheetNames }
      const [activeSheet, setActiveSheet] = useState('');
      const [workbook, setWorkbook] = useState(null);
      const [rawRows, setRawRows] = useState([]); // array of objects from SheetJS
      const [columns, setColumns] = useState([]); // list of headers

      // 3. Column Mapping State
      const [columnMap, setColumnMap] = useState({
        id: '',
        type: '',
        code: '',
        size: '',
        length: '',
        gradient: '',
      });

      // Column Defaults (fallback if column not present or cell empty)
      const [fallbackDefaults, setFallbackDefaults] = useState({
        code: 'A01',
        size: '600',
        gradient: '1000',
      });

      // 4. UI search & filter
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCondition, setFilterCondition] = useState('ALL'); // ALL, SIL, SHORT, MEDIUM, LONG
      const [toastMsg, setToastMsg] = useState(null);
      const fileInputRef = useRef(null);

      // Save settings to LocalStorage whenever they change
      useEffect(() => {
        try {
          localStorage.setItem('autocad_bridge_settings', JSON.stringify(settings));
        } catch (e) {
          console.error('Failed to save settings:', e);
        }
      }, [settings]);

      // Show temporary toast message
      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // Auto-detect columns based on heuristics
      const detectColumns = (headerList) => {
        const mapping = { id: '', type: '', code: '', size: '', length: '', gradient: '' };

        const patterns = {
          id: /^(id|pipe\s*id|sump\s*id|manhole\s*id|label|mark|no|pipe\s*no|line\s*id|tag)$/i,
          type: /^(type|pipe\s*type|drain\s*type|category|item\s*type)$/i,
          code: /^(code|drain\s*code|pipe\s*code|prefix|system)$/i,
          size: /^(size|dia|diameter|pipe\s*size|width|dimension|dim)$/i,
          length: /^(length|len|dist|distance|span|run|chainage)$/i,
          gradient: /^(gradient|grad|slope|fall|grade|1:s)$/i,
        };

        headerList.forEach(header => {
          const trimmed = String(header).trim();
          for (const [key, regex] of Object.entries(patterns)) {
            if (!mapping[key] && regex.test(trimmed)) {
              mapping[key] = trimmed;
              break;
            }
          }
        });

        // Secondary fallback search if exact match failed
        headerList.forEach(header => {
          const trimmed = String(header).trim().toLowerCase();
          if (!mapping.id && trimmed.includes('id')) mapping.id = header;
          if (!mapping.type && (trimmed.includes('type') || trimmed.includes('kind'))) mapping.type = header;
          if (!mapping.code && trimmed.includes('code')) mapping.code = header;
          if (!mapping.size && (trimmed.includes('size') || trimmed.includes('dia'))) mapping.size = header;
          if (!mapping.length && (trimmed.includes('len') || trimmed.includes('dist'))) mapping.length = header;
          if (!mapping.gradient && (trimmed.includes('grad') || trimmed.includes('slope'))) mapping.gradient = header;
        });

        setColumnMap(mapping);
      };

      // Handle Excel File Parsing via SheetJS
      const handleFile = (file) => {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });
            
            setWorkbook(wb);
            setFileInfo({
              name: file.name,
              size: (file.size / 1024).toFixed(1) + ' KB',
              sheetNames: wb.SheetNames,
            });

            const firstSheet = wb.SheetNames[0];
            setActiveSheet(firstSheet);
            parseSheet(wb, firstSheet);
            showToast(`Loaded ${file.name} successfully!`);
          } catch (err) {
            console.error('Error parsing Excel:', err);
            alert('Failed to parse Excel file. Please ensure it is a valid .xls or .xlsx spreadsheet.');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      // Parse a specific sheet from the workbook
      const parseSheet = (wb, sheetName) => {
        const ws = wb.Sheets[sheetName];
        if (!ws) return;

        // Convert to array of objects with raw values
        const jsonData = XLSX.utils.sheet_to_json(ws, { defval: '', raw: false });
        if (jsonData.length === 0) {
          showToast(`Warning: Sheet "${sheetName}" is empty.`);
          setRawRows([]);
          setColumns([]);
          return;
        }

        // Extract column headers
        const headers = Object.keys(jsonData[0]);
        setColumns(headers);
        setRawRows(jsonData);
        detectColumns(headers);
      };

      // Load interactive demo data
      const loadDemoData = () => {
        const headers = ['ID', 'Type', 'Code', 'Size', 'Length', 'Gradient'];
        setColumns(headers);
        setRawRows(DEMO_EXCEL_DATA);
        setFileInfo({
          name: 'MSMA_Drain_Schedule_Demo.xlsx',
          size: '14.2 KB (Sample)',
          sheetNames: ['Drainage_Network', 'Hydraulics'],
        });
        setActiveSheet('Drainage_Network');
        setColumnMap({
          id: 'ID',
          type: 'Type',
          code: 'Code',
          size: 'Size',
          length: 'Length',
          gradient: 'Gradient',
        });
        showToast('Sample MSMA drainage schedule loaded!');
      };

      // Download a pre-formatted Excel template
      const downloadTemplate = () => {
        const ws = XLSX.utils.json_to_sheet(DEMO_EXCEL_DATA);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Drainage_Schedule');
        XLSX.writeFile(wb, 'AutoCAD_Drainage_Template.xlsx');
        showToast('Template downloaded: AutoCAD_Drainage_Template.xlsx');
      };

      // ─────────────────────────────────────────────────────────────
      // THE AUTOCAD FORMATTING ENGINE (Core Logic)
      // ─────────────────────────────────────────────────────────────
      const formatRow = (row, index) => {
        const idRaw = String(row[columnMap.id] || `ROW_${index + 1}`).trim();
        const typeRaw = String(row[columnMap.type] || '').trim();
        const codeRaw = String(row[columnMap.code] || fallbackDefaults.code || 'A01').trim();
        const sizeRaw = String(row[columnMap.size] || fallbackDefaults.size || '600').trim();
        const lengthRaw = String(row[columnMap.length] || '').trim();
        let gradRaw = String(row[columnMap.gradient] || fallbackDefaults.gradient || '1000').trim();

        // Standardize Gradient: if user entered '1:1000', strip '1:' so we don't end up with '1:1:1000'
        if (settings.cleanGradientPrefix) {
          gradRaw = gradRaw.replace(/^1\s*:\s*/i, '');
        }

        // Numeric length parsing
        const lenNum = parseFloat(lengthRaw);
        const hasValidLen = !isNaN(lenNum) && lenNum >= 0;
        // Clean display of length (round to integer or clean float)
        const lenDisplay = hasValidLen ? (Number.isInteger(lenNum) ? lenNum.toString() : lenNum.toFixed(1)) : (lengthRaw || '0');

        const widthTag = `{\\W${parseFloat(settings.textWidthFactor) || 0.5};`;
        let cadString = '';
        let conditionType = ''; // 'SIL', 'A' (Short), 'B' (Medium), 'C' (Long/Override)

        // 1. Condition: SIL Check
        if (typeRaw.toUpperCase().includes('SIL')) {
          cadString = `${widthTag}SIL00.00}`;
          conditionType = 'SIL';
        } else {
          // 2. Condition: Drain Processing
          const isShort = hasValidLen && lenNum <= settings.shortPipeThreshold;
          const isMedium = hasValidLen && lenNum > settings.shortPipeThreshold && lenNum <= settings.mediumPipeThreshold;

          if (settings.autoFormat && isShort) {
            // Condition A (Length <= Short Pipe Threshold): 4 paragraphs
            cadString = `${widthTag}${codeRaw};\\P${sizeRaw}%%c\\P${lenDisplay}m\\P1:${gradRaw}}`;
            conditionType = 'A (Short <= ' + settings.shortPipeThreshold + 'm)';
          } else if (settings.autoFormat && isMedium) {
            // Condition B (Length > Short AND <= Medium Threshold): 2 paragraphs
            cadString = `${widthTag}${codeRaw}; ${sizeRaw}%%c\\P${lenDisplay}m 1:${gradRaw}}`;
            conditionType = 'B (Med <= ' + settings.mediumPipeThreshold + 'm)';
          } else {
            // Condition C (Length > Medium Threshold OR Auto-Format is OFF): 1-line format
            cadString = `${widthTag}${codeRaw}; ${sizeRaw}%%c ${lenDisplay}m 1:${gradRaw}}`;
            conditionType = settings.autoFormat 
              ? 'C (Long > ' + settings.mediumPipeThreshold + 'm)'
              : 'C (Override: 1-Line)';
          }
        }

        // Simulated visual display (how AutoCAD displays it visually)
        // \P -> line breaks, %%c -> Ø, strip {\W0.5; and }
        const visualLines = cadString
          .replace(/^\{\\W[\d.]+;/, '')
          .replace(/\}$/, '')
          .replace(/%%c/g, 'Ø')
          .split('\\P');

        return {
          originalRow: row,
          id: idRaw,
          type: typeRaw || 'Drain',
          code: codeRaw,
          size: sizeRaw,
          length: lenDisplay,
          gradient: gradRaw,
          lenNum: lenNum,
          cadString,
          conditionType,
          visualLines,
        };
      };

      // Processed rows memo
      const processedData = useMemo(() => {
        return rawRows.map((row, idx) => formatRow(row, idx));
      }, [rawRows, columnMap, settings, fallbackDefaults]);

      // Filtered rows for table search/filter
      const filteredData = useMemo(() => {
        return processedData.filter(item => {
          // Condition filter
          if (filterCondition === 'SIL' && !item.conditionType.startsWith('SIL')) return false;
          if (filterCondition === 'SHORT' && !item.conditionType.startsWith('A')) return false;
          if (filterCondition === 'MEDIUM' && !item.conditionType.startsWith('B')) return false;
          if (filterCondition === 'LONG' && !item.conditionType.startsWith('C')) return false;

          // Search text
          if (!searchTerm.trim()) return true;
          const s = searchTerm.toLowerCase();
          return (
            item.id.toLowerCase().includes(s) ||
            item.code.toLowerCase().includes(s) ||
            item.size.toLowerCase().includes(s) ||
            item.cadString.toLowerCase().includes(s)
          );
        });
      }, [processedData, searchTerm, filterCondition]);

      // Summary statistics
      const stats = useMemo(() => {
        const total = processedData.length;
        const silCount = processedData.filter(d => d.conditionType.startsWith('SIL')).length;
        const shortCount = processedData.filter(d => d.conditionType.startsWith('A')).length;
        const medCount = processedData.filter(d => d.conditionType.startsWith('B')).length;
        const longCount = processedData.filter(d => d.conditionType.startsWith('C')).length;
        return { total, silCount, shortCount, medCount, longCount };
      }, [processedData]);

      // ─────────────────────────────────────────────────────────────
      // CSV EXPORT (Exactly 2 columns, NO headers)
      // ─────────────────────────────────────────────────────────────
      const exportCSV = () => {
        if (processedData.length === 0) {
          alert('No data to export. Please upload an Excel file or load demo data first.');
          return;
        }

        // Proper RFC4180 CSV escaping for 2 columns
        const csvRows = processedData.map(item => {
          const col1 = escapeCSV(item.id);
          const col2 = escapeCSV(item.cadString);
          return `${col1},${col2}`;
        });

        const csvContent = csvRows.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'AutoCAD_Import.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);

        showToast('Exported AutoCAD_Import.csv successfully!');
      };

      // Copy entire CSV to clipboard
      const copyCSVToClipboard = () => {
        if (processedData.length === 0) return;
        const csvContent = processedData
          .map(item => `${escapeCSV(item.id)},${escapeCSV(item.cadString)}`)
          .join('\r\n');
        navigator.clipboard.writeText(csvContent).then(() => {
          showToast('Copied 2-column CSV to clipboard!');
        });
      };

      // Helper for CSV escaping
      const escapeCSV = (str) => {
        const s = String(str);
        if (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\r')) {
          return `"${s.replace(/"/g, '""')}"`;
        }
        return s;
      };

      // Drag and drop handlers
      const [isDragging, setIsDragging] = useState(false);
      const onDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };
      const onDragLeave = () => {
        setIsDragging(false);
      };
      const onDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          handleFile(e.dataTransfer.files[0]);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          
          {/* ═════════════════════════════════════════════════════════ */}
          {/* 1. TOP BAR                                                */}
          {/* ═════════════════════════════════════════════════════════ */}
          <header className="bg-cadslate-900 border-b border-cadslate-700/80 px-6 py-3.5 flex flex-wrap items-center justify-between gap-4 sticky top-0 z-30 shadow-lg shadow-black/40">
            <div className="flex items-center space-x-3.5">
              <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-cadcyan-500 to-cadcyan-700 flex items-center justify-center shadow-md shadow-cadcyan-500/20 text-cadslate-950 font-black text-xl">
                <span>CAD</span>
              </div>
              <div>
                <div className="flex items-center space-x-2.5">
                  <h1 className="text-lg font-bold text-white tracking-tight">AutoCAD XLS-to-CSV Bridge</h1>
                  <span className="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-cadcyan-500/10 text-cadcyan-400 border border-cadcyan-500/30">
                    MTEXT Parser v2.1
                  </span>
                </div>
                <p className="text-xs text-slate-400">Transform engineering drainage schedules into AutoCAD-compliant 2-column CSV</p>
              </div>
            </div>

            {/* Quick Actions */}
            <div className="flex items-center space-x-2.5">
              <button
                onClick={loadDemoData}
                className="px-3 py-1.5 rounded-md text-xs font-medium text-slate-300 bg-cadslate-800 hover:bg-cadslate-700 border border-cadslate-600 transition flex items-center space-x-1.5 shadow-sm"
                title="Load sample MSMA drainage schedule for instant demonstration"
              >
                <svg className="w-3.5 h-3.5 text-cadcyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <span>Load Sample Data</span>
              </button>

              <button
                onClick={downloadTemplate}
                className="px-3 py-1.5 rounded-md text-xs font-medium text-slate-300 bg-cadslate-800 hover:bg-cadslate-700 border border-cadslate-600 transition flex items-center space-x-1.5 shadow-sm"
                title="Download ready-to-fill Excel template"
              >
                <svg className="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>Excel Template</span>
              </button>

              <button
                onClick={() => setIsLispModalOpen(true)}
                className="px-3 py-1.5 rounded-md text-xs font-medium text-slate-300 bg-cadslate-800 hover:bg-cadslate-700 border border-cadslate-600 transition flex items-center space-x-1.5 shadow-sm"
                title="View how to load this CSV into AutoCAD or GstarCAD"
              >
                <svg className="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                </svg>
                <span>CAD Workflow</span>
              </button>

              {/* Settings Button */}
              <button
                onClick={() => setIsSettingsOpen(true)}
                className="px-3.5 py-1.5 rounded-md text-xs font-semibold text-cadcyan-400 bg-cadcyan-500/10 hover:bg-cadcyan-500/20 border border-cadcyan-500/40 transition flex items-center space-x-1.5 shadow-sm"
              >
                <svg className="w-4 h-4 text-cadcyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <span>Formatting Settings</span>
              </button>
            </div>
          </header>

          {/* ═════════════════════════════════════════════════════════ */}
          {/* MAIN CONTENT AREA                                         */}
          {/* ═════════════════════════════════════════════════════════ */}
          <main className="flex-1 p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 overflow-hidden">
            
            {/* ── LEFT COLUMN: File Upload & Column Mapper (4 Cols) ─ */}
            <div className="lg:col-span-4 flex flex-col space-y-6">
              
              {/* File Upload Zone */}
              <div 
                onDragOver={onDragOver}
                onDragLeave={onDragLeave}
                onDrop={onDrop}
                onClick={() => fileInputRef.current && fileInputRef.current.click()}
                className={`border-2 border-dashed rounded-xl p-6 text-center cursor-pointer transition-all duration-200 relative group ${
                  isDragging 
                    ? 'border-cadcyan-400 bg-cadcyan-500/10 scale-[1.01]' 
                    : 'border-cadslate-700 bg-cadslate-900/90 hover:border-cadcyan-500/60 hover:bg-cadslate-850'
                }`}
              >
                <input
                  type="file"
                  ref={fileInputRef}
                  className="hidden"
                  accept=".xlsx, .xls, .csv"
                  onChange={(e) => e.target.files && handleFile(e.target.files[0])}
                />

                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                  </svg>
                </div>

                <h3 className="mt-3 text-sm font-semibold text-white">
                  Drop Engineering Excel (.xls, .xlsx)
                </h3>
                <p className="mt-1 text-xs text-slate-400">

                </p>

                <div className="mt-3 flex items-center justify-center space-x-2 text-[10px] text-slate-400">
                  <span className="px-2 py-0.5 rounded bg-cadslate-800 border border-cadslate-700 font-mono">.XLSX</span>
                  <span className="px-2 py-0.5 rounded bg-cadslate-800 border border-cadslate-700 font-mono">.XLS</span>
                  <span className="px-2 py-0.5 rounded bg-cadslate-800 border border-cadslate-700 font-mono">.CSV</span>
                </div>

                {/* Uploaded File Pill Indicator */}
                {fileInfo && (
                  <div className="mt-4 pt-3 border-t border-cadslate-700/60 flex items-center justify-between text-left text-xs bg-cadslate-950/60 px-3 py-2 rounded-lg" onClick={(e) => e.stopPropagation()}>
                    <div className="truncate mr-2">
                      <p className="font-medium text-cadcyan-400 truncate">{fileInfo.name}</p>
                      <p className="text-[10px] text-slate-400 font-mono">{fileInfo.size} • {rawRows.length} rows</p>
                    </div>
                    <button
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                      className="text-[10px] bg-cadslate-800 hover:bg-cadslate-700 text-slate-300 px-2 py-1 rounded border border-cadslate-600 shrink-0"
                    >
                      Change
                    </button>
                  </div>
                )}
              </div>

              {/* Sheet Selector (if multiple sheets exist) */}
              {fileInfo && fileInfo.sheetNames.length > 1 && (
                <div className="bg-cadslate-900 border border-cadslate-700 rounded-xl p-3.5">
                  <label className="text-xs font-semibold text-slate-300 block mb-1.5 flex items-center justify-between">
                    <span>Active Sheet</span>
                    <span className="text-[10px] text-cadcyan-400 font-mono">{fileInfo.sheetNames.length} sheets found</span>
                  </label>
                  <select
                    value={activeSheet}
                    onChange={(e) => {
                      setActiveSheet(e.target.value);
                      parseSheet(workbook, e.target.value);
                    }}
                    className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-cadcyan-500 font-mono"
                  >
                    {fileInfo.sheetNames.map((sheet) => (
                      <option key={sheet} value={sheet}>{sheet}</option>
                    ))}
                  </select>
                </div>
              )}

              <div className="bg-cadslate-900 border border-cadslate-700 rounded-xl p-5 shadow-lg flex-1 flex flex-col">

                    <span className="w-2 h-2 rounded-full bg-cadcyan-400 animate-pulse"></span>

                  </div>

                    <p className="text-xs">Upload an Excel file or load demo data to map columns.</p>

                          <span className="w-1.5 h-1.5 rounded-full bg-cadcyan-400"></span>
                          <span>1. ID Column</span>
                          <span className="text-red-400 text-[10px]">*Required</span>
                        </label>
                        <span className="text-[10px] text-slate-400 font-mono">e.g. P1, MH1</span>
                      </div>
                      <select
                        value={columnMap.id}
                        onChange={(e) => setColumnMap({ ...columnMap, id: e.target.value })}
                        className={`w-full bg-cadslate-950 border rounded-lg px-2.5 py-1.5 text-xs focus:outline-none font-mono ${
                          columnMap.id ? 'border-cadcyan-500/80 text-white' : 'border-amber-500/60 text-amber-300'
                        }`}
                      >
                        <option value="">-- Select Excel Column --</option>
                        {columns.map(col => <option key={col} value={col}>{col}</option>)}
                      </select>
                    </div>

                    {/* 2. Type */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="font-semibold text-slate-200 flex items-center space-x-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-cadcyan-400"></span>
                          <span>2. Type Column</span>
                        </label>
                        <span className="text-[10px] text-slate-400 font-mono">"Drain" or "SIL"</span>
                      </div>
                      <select
                        value={columnMap.type}
                        onChange={(e) => setColumnMap({ ...columnMap, type: e.target.value })}
                        className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cadcyan-500 font-mono"
                      >
                        <option value="">-- None (Defaults to Drain) --</option>
                        {columns.map(col => <option key={col} value={col}>{col}</option>)}
                      </select>
                    </div>

                    {/* 3. Code */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="font-semibold text-slate-200 flex items-center space-x-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-cadcyan-400"></span>
                          <span>3. Code Column</span>
                        </label>
                        <span className="text-[10px] text-slate-400 font-mono">e.g. A01</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <select
                          value={columnMap.code}
                          onChange={(e) => setColumnMap({ ...columnMap, code: e.target.value })}
                          className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cadcyan-500 font-mono"
                        >
                          <option value="">-- Default Below --</option>
                          {columns.map(col => <option key={col} value={col}>{col}</option>)}
                        </select>
                        <input
                          type="text"
                          value={fallbackDefaults.code}
                          onChange={(e) => setFallbackDefaults({ ...fallbackDefaults, code: e.target.value })}
                          placeholder="Fallback (A01)"
                          className="bg-cadslate-950 border border-cadslate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-cadcyan-500 font-mono"
                          title="Used if cell in Excel is empty"
                        />
                      </div>
                    </div>

                    {/* 4. Size */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="font-semibold text-slate-200 flex items-center space-x-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-cadcyan-400"></span>
                          <span>4. Size Column</span>
                        </label>
                        <span className="text-[10px] text-slate-400 font-mono">e.g. 600, 900</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <select
                          value={columnMap.size}
                          onChange={(e) => setColumnMap({ ...columnMap, size: e.target.value })}
                          className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cadcyan-500 font-mono"
                        >
                          <option value="">-- Default Below --</option>
                          {columns.map(col => <option key={col} value={col}>{col}</option>)}
                        </select>
                        <input
                          type="text"
                          value={fallbackDefaults.size}
                          onChange={(e) => setFallbackDefaults({ ...fallbackDefaults, size: e.target.value })}
                          placeholder="Fallback (600)"
                          className="bg-cadslate-950 border border-cadslate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-cadcyan-500 font-mono"
                        />
                      </div>
                    </div>

                    {/* 5. Length */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="font-semibold text-slate-200 flex items-center space-x-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-cadcyan-400"></span>
                          <span>5. Length Column</span>
                        </label>
                        <span className="text-[10px] text-slate-400 font-mono">e.g. 12 (in meters)</span>
                      </div>
                      <select
                        value={columnMap.length}
                        onChange={(e) => setColumnMap({ ...columnMap, length: e.target.value })}
                        className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cadcyan-500 font-mono"
                      >
                        <option value="">-- Select Excel Column --</option>
                        {columns.map(col => <option key={col} value={col}>{col}</option>)}
                      </select>
                    </div>

                    {/* 6. Gradient */}
                    <div>
                      <div className="flex justify-between items-center mb-1">
                        <label className="font-semibold text-slate-200 flex items-center space-x-1.5">
                          <span className="w-1.5 h-1.5 rounded-full bg-cadcyan-400"></span>
                          <span>6. Gradient Column</span>
                        </label>
                        <span className="text-[10px] text-slate-400 font-mono">e.g. 1000 or 1:1000</span>
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <select
                          value={columnMap.gradient}
                          onChange={(e) => setColumnMap({ ...columnMap, gradient: e.target.value })}
                          className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-cadcyan-500 font-mono"
                        >
                          <option value="">-- Default Below --</option>
                          {columns.map(col => <option key={col} value={col}>{col}</option>)}
                        </select>
                        <input
                          type="text"
                          value={fallbackDefaults.gradient}
                          onChange={(e) => setFallbackDefaults({ ...fallbackDefaults, gradient: e.target.value })}
                          placeholder="Fallback (1000)"
                          className="bg-cadslate-950 border border-cadslate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-300 focus:outline-none focus:border-cadcyan-500 font-mono"
                        />
                      </div>
                    </div>

                  </div>
                )}
              </div>

            </div>

            {/* ── RIGHT COLUMN: Stats & Data Preview Table (8 Cols) ─── */}
            <div className="lg:col-span-8 flex flex-col space-y-4">
              
              {/* Stats Bar */}
              <div className="grid grid-cols-2 sm:grid-cols-5 gap-3">
                <div className="bg-cadslate-900 border border-cadslate-700/80 rounded-xl p-3">
                  <p className="text-[10px] font-mono uppercase text-slate-400">Total Rows</p>
                  <p className="text-xl font-bold text-white mt-0.5">{stats.total}</p>
                </div>
                <div className="bg-cadslate-900 border border-cadslate-700/80 rounded-xl p-3">
                  <p className="text-[10px] font-mono uppercase text-cadcyan-400">Short (&le; {settings.shortPipeThreshold}m)</p>
                  <p className="text-xl font-bold text-cadcyan-400 mt-0.5">{stats.shortCount}</p>
                </div>
                <div className="bg-cadslate-900 border border-cadslate-700/80 rounded-xl p-3">
                  <p className="text-[10px] font-mono uppercase text-amber-400">Med (&le; {settings.mediumPipeThreshold}m)</p>
                  <p className="text-xl font-bold text-amber-400 mt-0.5">{stats.medCount}</p>
                </div>
                <div className="bg-cadslate-900 border border-cadslate-700/80 rounded-xl p-3">
                  <p className="text-[10px] font-mono uppercase text-emerald-400">Long (&gt; {settings.mediumPipeThreshold}m)</p>
                  <p className="text-xl font-bold text-emerald-400 mt-0.5">{stats.longCount}</p>
                </div>
                <div className="bg-cadslate-900 border border-cadslate-700/80 rounded-xl p-3 col-span-2 sm:col-span-1">
                  <p className="text-[10px] font-mono uppercase text-purple-400">SIL Points</p>
                  <p className="text-xl font-bold text-purple-400 mt-0.5">{stats.silCount}</p>
                </div>
              </div>

              {/* Table Card */}
              <div className="bg-cadslate-900 border border-cadslate-700 rounded-xl shadow-lg flex-1 flex flex-col overflow-hidden">
                
                {/* Search & Filter Header */}
                <div className="p-3.5 border-b border-cadslate-700/80 flex flex-wrap items-center justify-between gap-3 bg-cadslate-850">
                  <div className="flex items-center space-x-2">
                    <span className="text-xs font-bold text-white">Data Preview &amp; CAD Output</span>
                    <span className="text-[11px] px-2 py-0.5 rounded-full bg-cadslate-700 text-slate-300 font-mono">
                      {filteredData.length} of {processedData.length} rows
                    </span>
                  </div>

                  <div className="flex items-center space-x-2">
                    {/* Filter buttons */}
                    <div className="flex rounded-lg bg-cadslate-950 p-0.5 border border-cadslate-700 text-[11px]">
                      {['ALL', 'SHORT', 'MEDIUM', 'LONG', 'SIL'].map(f => (
                        <button
                          key={f}
                          onClick={() => setFilterCondition(f)}
                          className={`px-2 py-1 rounded-md font-medium transition ${
                            filterCondition === f
                              ? 'bg-cadcyan-500 text-cadslate-950 font-bold shadow-sm'
                              : 'text-slate-400 hover:text-white'
                          }`}
                        >
                          {f}
                        </button>
                      ))}
                    </div>

                    {/* Search box */}
                    <div className="relative">
                      <input
                        type="text"
                        placeholder="Search ID, Code..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="bg-cadslate-950 border border-cadslate-700 rounded-lg pl-7 pr-3 py-1 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cadcyan-500 w-36 sm:w-44 font-mono"
                      />
                      <svg className="w-3.5 h-3.5 text-slate-400 absolute left-2 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                      </svg>
                    </div>
                  </div>
                </div>

                {/* Table Content */}
                <div className="flex-1 overflow-auto max-h-[calc(100vh-370px)]">
                  {processedData.length === 0 ? (
                    <div className="py-20 text-center text-slate-400 flex flex-col items-center justify-center">
                      <div className="w-16 h-16 rounded-full bg-cadslate-800 border border-cadslate-700 flex items-center justify-center mb-3 text-cadslate-600">
                        <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                      </div>
                      <p className="text-sm font-semibold text-slate-300">No Data Loaded Yet</p>
                      <p className="text-xs text-slate-400 mt-1 max-w-sm">
                        Drop an Excel file on the left or click "Load Sample Data" in the top bar to preview formatted AutoCAD MTEXT output.
                      </p>
                      <button
                        onClick={loadDemoData}
                        className="mt-4 px-4 py-2 rounded-lg bg-cadcyan-500 hover:bg-cadcyan-400 text-cadslate-950 font-bold text-xs shadow-md transition"
                      >
                        Load Interactive Sample
                      </button>
                    </div>
                  ) : (
                    <table className="w-full text-left border-collapse text-xs">
                      <thead className="bg-cadslate-950/80 sticky top-0 z-10 border-b border-cadslate-700/80 backdrop-blur-sm">
                        <tr className="text-slate-400 font-mono text-[11px]">
                          <th className="py-2.5 px-3 w-12 text-center">#</th>
                          <th className="py-2.5 px-3 w-24">Col 1: ID</th>
                          <th className="py-2.5 px-3 w-28">Type &amp; Rule</th>
                          <th className="py-2.5 px-3 w-36">Parsed Specs</th>
                          <th className="py-2.5 px-3">Col 2: Raw CAD String</th>
                          <th className="py-2.5 px-3 w-48">CAD Visual Render</th>
                          <th className="py-2.5 px-2 w-12 text-center">Copy</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-cadslate-800/80 font-mono">
                        {filteredData.map((item, idx) => (
                          <tr key={idx} className="hover:bg-cadslate-800/50 transition-colors group">
                            
                            {/* Row Index */}
                            <td className="py-2.5 px-3 text-center text-slate-400 text-[10px]">
                              {idx + 1}
                            </td>

                            {/* Column 1: ID */}
                            <td className="py-2.5 px-3 font-bold text-white tracking-wider">
                              <span className="px-1.5 py-0.5 rounded bg-cadslate-800 border border-cadslate-700">
                                {item.id}
                              </span>
                            </td>

                            {/* Type & Condition Badge */}
                            <td className="py-2.5 px-3 text-[11px]">
                              {item.conditionType.startsWith('SIL') ? (
                                <span className="inline-block px-2 py-0.5 rounded bg-purple-500/10 text-purple-300 border border-purple-500/30 font-medium">
                                  SIL Sump
                                </span>
                              ) : item.conditionType.startsWith('A') ? (
                                <span className="inline-block px-2 py-0.5 rounded bg-cadcyan-500/10 text-cadcyan-400 border border-cadcyan-500/30 font-medium">
                                  Cond. A (4-Line)
                                </span>
                              ) : item.conditionType.startsWith('B') ? (
                                <span className="inline-block px-2 py-0.5 rounded bg-amber-500/10 text-amber-300 border border-amber-500/30 font-medium">
                                  Cond. B (2-Line)
                                </span>
                              ) : (
                                <span className="inline-block px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 font-medium">
                                  Cond. C (1-Line)
                                </span>
                              )}
                            </td>

                            {/* Parsed Specs */}
                            <td className="py-2.5 px-3 text-[11px] text-slate-300">
                              {item.conditionType.startsWith('SIL') ? (
                                <span className="text-slate-400 italic">Invert Level Mark</span>
                              ) : (
                                <div className="space-x-1">
                                  <span className="text-cadcyan-400 font-semibold">{item.code}</span>
                                  <span>•</span>
                                  <span>{item.size}Ø</span>
                                  <span>•</span>
                                  <span>{item.length}m</span>
                                  <span>•</span>
                                  <span className="text-slate-400">1:{item.gradient}</span>
                                </div>
                              )}
                            </td>

                            {/* Col 2: Raw CAD String */}
                            <td className="py-2.5 px-3">
                              <div className="bg-cadslate-950 px-2 py-1.5 rounded border border-cadslate-800 text-[11px] text-cadcyan-300 break-all select-all hover:border-cadcyan-500/40 transition">
                                {item.cadString}
                              </div>
                            </td>

                            {/* CAD Visual Render Simulation */}
                            <td className="py-2.5 px-3">
                              <div className="cad-preview-box p-2 rounded border border-cadslate-700/60 shadow-inner flex flex-col justify-center min-h-[48px]">
                                {item.visualLines.map((line, lIdx) => (
                                  <div 
                                    key={lIdx} 
                                    className="text-[11px] leading-tight font-semibold tracking-tighter text-amber-300"
                                    style={{ transform: `scaleX(${settings.textWidthFactor || 0.5})`, transformOrigin: 'left' }}
                                  >
                                    {line}
                                  </div>
                                ))}
                              </div>
                            </td>

                            {/* Copy button */}
                            <td className="py-2.5 px-2 text-center">
                              <button
                                onClick={() => {
                                  navigator.clipboard.writeText(item.cadString);
                                  showToast(`Copied string for ${item.id}`);
                                }}
                                className="p-1 rounded bg-cadslate-800 hover:bg-cadslate-700 text-slate-400 hover:text-white transition"
                                title="Copy raw CAD MTEXT string"
                              >
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                                </svg>
                              </button>
                            </td>

                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>

              </div>

            </div>

          </main>

          {/* ═════════════════════════════════════════════════════════ */}
          {/* 5. BOTTOM BAR (Export Action Zone)                         */}
          {/* ═════════════════════════════════════════════════════════ */}
          <footer className="bg-cadslate-900 border-t border-cadslate-700/80 px-6 py-4 flex flex-wrap items-center justify-between gap-4 sticky bottom-0 z-30 shadow-2xl">
            <div className="flex items-center space-x-3 text-xs text-slate-400">
              <span className="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
              <span>
                Ready: <strong className="text-white font-mono">{processedData.length}</strong> CAD string pairs generated
              </span>
              <span className="hidden sm:inline text-cadslate-600">|</span>
              <span className="hidden sm:inline">
                Format: <strong className="text-slate-300 font-mono">2-Column CSV (No Header)</strong>
              </span>
            </div>

            <div className="flex items-center space-x-3">
              <button
                onClick={copyCSVToClipboard}
                disabled={processedData.length === 0}
                className={`px-4 py-2 rounded-lg text-xs font-semibold border transition flex items-center space-x-2 ${
                  processedData.length === 0
                    ? 'border-cadslate-700 text-cadslate-600 cursor-not-allowed'
                    : 'border-cadslate-600 bg-cadslate-800 hover:bg-cadslate-700 text-slate-200'
                }`}
              >
                <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
                <span>Copy Full CSV</span>
              </button>

              <button
                onClick={exportCSV}
                disabled={processedData.length === 0}
                className={`px-6 py-2.5 rounded-lg text-xs font-bold transition flex items-center space-x-2 shadow-lg shadow-cadcyan-500/20 ${
                  processedData.length === 0
                    ? 'bg-cadslate-800 text-cadslate-600 border border-cadslate-700 cursor-not-allowed'
                    : 'bg-gradient-to-r from-cadcyan-500 to-cadcyan-400 hover:from-cadcyan-400 hover:to-cadcyan-300 text-cadslate-950 transform hover:-translate-y-0.5 active:translate-y-0'
                }`}
              >
                <svg className="w-4 h-4 text-cadslate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span>Export AutoCAD CSV (AutoCAD_Import.csv)</span>
              </button>
            </div>
          </footer>

          {/* ═════════════════════════════════════════════════════════ */}
          {/* USER SETTINGS MODAL                                       */}
          {/* ═════════════════════════════════════════════════════════ */}
          {isSettingsOpen && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-cadslate-900 border border-cadslate-700 rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
                
                {/* Modal Header */}
                <div className="p-5 border-b border-cadslate-700 flex items-center justify-between bg-cadslate-850">
                  <div className="flex items-center space-x-2.5">
                    <div className="w-8 h-8 rounded-lg bg-cadcyan-500/10 border border-cadcyan-500/30 flex items-center justify-center text-cadcyan-400">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                      </svg>
                    </div>
                    <div>
                      <h3 className="text-sm font-bold text-white">Formatting Settings</h3>
                      <p className="text-[11px] text-slate-400">Configure MTEXT formatting rules &amp; paragraph break limits</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setIsSettingsOpen(false)}
                    className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-cadslate-700 transition"
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                {/* Modal Body */}
                <div className="p-6 space-y-5 text-xs">
                  
                  {/* Setting 1: Text Width Factor */}
                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="font-semibold text-slate-200">Text Width Factor</label>
                      <span className="font-mono text-cadcyan-400 font-bold">\W{settings.textWidthFactor};</span>
                    </div>
                    <p className="text-[11px] text-slate-400 mb-2">Controls horizontal character compression in AutoCAD MTEXT (standard is 0.5 for tight drainage annotations).</p>
                    <input
                      type="number"
                      step="0.05"
                      min="0.1"
                      max="2.0"
                      value={settings.textWidthFactor}
                      onChange={(e) => setSettings({ ...settings, textWidthFactor: parseFloat(e.target.value) || 0.5 })}
                      className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-3 py-2 text-white font-mono focus:outline-none focus:border-cadcyan-500"
                    />
                  </div>

                  {/* Setting 2 & 3: Pipe Length Thresholds */}
                  <div className="grid grid-cols-2 gap-4">
                    <div>
                      <label className="font-semibold text-slate-200 block mb-1">Short Pipe Threshold (m)</label>
                      <p className="text-[10px] text-slate-400 mb-2">&le; this length gets 4 paragraphs</p>
                      <input
                        type="number"
                        min="1"
                        max="30"
                        value={settings.shortPipeThreshold}
                        onChange={(e) => setSettings({ ...settings, shortPipeThreshold: parseFloat(e.target.value) || 6 })}
                        className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-3 py-2 text-white font-mono focus:outline-none focus:border-cadcyan-500"
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-200 block mb-1">Medium Pipe Threshold (m)</label>
                      <p className="text-[10px] text-slate-400 mb-2">&le; this length gets 2 paragraphs</p>
                      <input
                        type="number"
                        min="1"
                        max="50"
                        value={settings.mediumPipeThreshold}
                        onChange={(e) => setSettings({ ...settings, mediumPipeThreshold: parseFloat(e.target.value) || 14 })}
                        className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg px-3 py-2 text-white font-mono focus:outline-none focus:border-cadcyan-500"
                      />
                    </div>
                  </div>

                  {/* Setting 4: Format Override Toggle */}
                  <div className="p-3.5 rounded-xl bg-cadslate-950 border border-cadslate-800 flex items-center justify-between">
                    <div>
                      <p className="font-semibold text-slate-200">Auto-Format by Length</p>
                      <p className="text-[11px] text-slate-400 mt-0.5">
                        {settings.autoFormat 
                          ? 'Active: Pipes auto-break paragraphs based on thresholds' 
                          : 'Disabled: All pipes forced into single-line format'}
                      </p>
                    </div>
                    <button
                      onClick={() => setSettings({ ...settings, autoFormat: !settings.autoFormat })}
                      className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none ${
                        settings.autoFormat ? 'bg-cadcyan-500' : 'bg-cadslate-700'
                      }`}
                    >
                      <span
                        className={`inline-block h-4 w-4 transform rounded-full bg-cadslate-950 transition-transform ${
                          settings.autoFormat ? 'translate-x-6' : 'translate-x-1'
                        }`}
                      />
                    </button>
                  </div>

                  {/* Visual Rule Explainer Box */}
                  <div className="p-3.5 rounded-xl bg-cadslate-850 border border-cadslate-700/60 font-mono text-[11px] space-y-1.5 text-slate-300">
                    <p className="text-cadcyan-400 font-bold uppercase text-[10px]">Active Rule Summary:</p>
                    <p className="flex justify-between">
                      <span>• Length &le; {settings.shortPipeThreshold}m:</span>
                      <span className="text-amber-300 font-semibold">{settings.autoFormat ? '4-Lines [Code; / Size%%c / Len / 1:G]' : '1-Line (Override)'}</span>
                    </p>
                    <p className="flex justify-between">
                      <span>• Length {settings.shortPipeThreshold}m – {settings.mediumPipeThreshold}m:</span>
                      <span className="text-amber-300 font-semibold">{settings.autoFormat ? '2-Lines [Code; Size%%c / Len 1:G]' : '1-Line (Override)'}</span>
                    </p>
                    <p className="flex justify-between">
                      <span>• Length &gt; {settings.mediumPipeThreshold}m:</span>
                      <span className="text-emerald-300 font-semibold">1-Line [Code; Size%%c Len 1:G]</span>
                    </p>
                    <p className="flex justify-between">
                      <span>• SIL Invert Level:</span>
                      <span className="text-purple-300 font-semibold">{"{\\W" + settings.textWidthFactor + ";SIL00.00}"}</span>
                    </p>
                  </div>

                </div>

                {/* Modal Footer */}
                <div className="p-4 border-t border-cadslate-700 bg-cadslate-850 flex items-center justify-between">
                  <button
                    onClick={() => setSettings(DEFAULT_SETTINGS)}
                    className="text-xs text-slate-400 hover:text-white transition underline"
                  >
                    Reset to Defaults
                  </button>
                  <button
                    onClick={() => {
                      setIsSettingsOpen(false);
                      showToast('Settings saved successfully!');
                    }}
                    className="px-4 py-2 rounded-lg bg-cadcyan-500 hover:bg-cadcyan-400 text-cadslate-950 font-bold text-xs shadow-md transition"
                  >
                    Save &amp; Apply Changes
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* ═════════════════════════════════════════════════════════ */}
          {/* AUTOLISP INTEGRATION MODAL                                */}
          {/* ═════════════════════════════════════════════════════════ */}
          {isLispModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-cadslate-900 border border-cadslate-700 rounded-2xl max-w-xl w-full shadow-2xl overflow-hidden animate-in fade-in zoom-in-95 duration-150">
                <div className="p-5 border-b border-cadslate-700 flex items-center justify-between bg-cadslate-850">
                  <div className="flex items-center space-x-2">
                    <span className="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                    <h3 className="text-sm font-bold text-white">How to Use in AutoCAD / GstarCAD</h3>
                  </div>
                  <button onClick={() => setIsLispModalOpen(false)} className="text-slate-400 hover:text-white p-1">
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <div className="p-6 space-y-4 text-xs text-slate-300">
                  <p>
                    The generated <code className="text-cadcyan-400 bg-cadslate-950 px-1 py-0.5 rounded font-mono">AutoCAD_Import.csv</code> contains exactly two columns:
                  </p>
                  <div className="bg-cadslate-950 p-3 rounded-lg border border-cadslate-800 font-mono text-[11px] text-slate-300">
                    <div>P101,{"{\\W0.5;A01;\\P600%%c\\P4.5m\\P1:1000}"}</div>
                    <div>P103,{"{\\W0.5;A02; 900%%c\\P8.5m 1:800}"}</div>
                    <div>S201,{"{\\W0.5;SIL00.00}"}</div>
                  </div>

                  <h4 className="font-bold text-white text-xs mt-3">AutoLISP Reader Snippet:</h4>
                  <p className="text-slate-400">You can use this simple loop in your AutoLISP routines to update text matching the ID:</p>
                  <pre className="bg-cadslate-950 p-3 rounded-lg border border-cadslate-800 text-[11px] font-mono text-emerald-400 overflow-x-auto">
{`(defun c:csvupdate ( / *error* filename file line pos id val dict ss count i ent elist oldTxt cleanTxt match newTxt updated oldCmd )
  (vl-load-com)
  (setq oldCmd (getvar "CMDECHO"))
  (defun *error* (msg)
    (if oldCmd (setvar "CMDECHO" oldCmd))
    (if (and file (not (vl-catch-all-error-p (vl-catch-all-apply 'close (list file))))))
    (if (not (wcmatch (strcat msg "") "*Cancel*,*QUIT*")) (princ (strcat "\\nError: " msg)))
    (princ)
  )
  (setq filename (getfiled "Select Engineer's CSV File" "" "csv" 0))
  (if (not filename) (progn (princ "\\nNo file selected.") (exit)))
  (setq file (open filename "r") dict nil)
  (while (setq line (read-line file))
    (setq pos (vl-string-search "," line))
    (if pos
      (progn
        (setq id  (vl-string-trim " \\"\t" (substr line 1 pos)))
        (setq val (vl-string-trim " \\"\t" (substr line (+ pos 2))))
        (if (and (/= id "") (/= val ""))
          (setq dict (cons (cons (strcase id) val) dict))))))
  (close file)
  (if (not dict) (progn (princ "\\nError: No valid data found.") (exit)))
  (princ "\\nSelect placeholder TEXT/MTEXT to update (or type ALL): ")
  (setq ss (ssget '((0 . "TEXT,MTEXT"))))
  (if ss
    (progn
      (setq count (sslength ss) i 0 updated 0)
      (while (< i count)
        (setq ent (ssname ss i) elist (entget ent))
        (setq oldTxt (cdr (assoc 1 elist)))
        (setq cleanTxt (strcase (vl-string-trim " \t" oldTxt)))
        (setq match (assoc cleanTxt dict))
        (if match
          (progn
            (setq newTxt (cdr match))
            (setq elist (subst (cons 1 newTxt) (assoc 1 elist) elist))
            (entmod elist)
            (setq updated (1+ updated))))
        (setq i (1+ i)))
      (princ (strcat "\\nSuccess! " (itoa updated) " placeholders updated.")))
    (princ "\\nNo text selected."))
  (princ)
)`}
                  </pre>
                </div>

                <div className="p-4 border-t border-cadslate-700 bg-cadslate-850 text-right">
                  <button
                    onClick={() => setIsLispModalOpen(false)}
                    className="px-4 py-2 rounded-lg bg-cadslate-800 hover:bg-cadslate-700 text-slate-200 font-bold text-xs"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed top-16 right-6 z-50 bg-cadcyan-500 text-cadslate-950 font-bold text-xs px-4 py-2.5 rounded-lg shadow-2xl flex items-center space-x-2 animate-bounce">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" />
              </svg>
              <span>{toastMsg}</span>
            </div>
          )}

        </div>
      );
    }

    // Render the React application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
