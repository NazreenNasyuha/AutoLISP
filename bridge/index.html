      { 'Manhole No.': 'MH4', 'Type of Building': 'Shoplot', 'Length': '27', 'Pipe Size': '225', 'Gradient': '204', 'Pipe Type': 'VCP', 'Ground Level': '6.50', 'Invert Level': '4.08', 'Depth of Manhole': '2.42', 'Backdrop': '' },
      { 'Manhole No.': 'EXTG MH8', 'Type of Building': 'EXTG', 'Length': '', 'Pipe Size': '', 'Gradient': '', 'Pipe Type': '', 'Ground Level': '6.40', 'Invert Level': '3.62', 'Depth of Manhole': '2.78', 'Backdrop': '0.33' },
      { 'Manhole No.': 'MH21', 'Type of Building': 'Terrace', 'Length': '55', 'Pipe Size': '300', 'Gradient': '294', 'Pipe Type': 'VCP', 'Ground Level': '16.00', 'Invert Level': '14.12', 'Depth of Manhole': '1.88', 'Backdrop': '' },
      { 'Manhole No.': 'MH26', 'Type of Building': 'Terrace', 'Length': '9',  'Pipe Size': '375', 'Gradient': '400', 'Pipe Type': 'VCP', 'Ground Level': '15.80', 'Invert Level': '13.93', 'Depth of Manhole': '1.87', 'Backdrop': '' },
      { 'Manhole No.': 'MH27', 'Type of Building': 'Terrace', 'Length': '39', 'Pipe Size': '375', 'Gradient': '294', 'Pipe Type': 'VCP', 'Ground Level': '15.80', 'Invert Level': '13.91', 'Depth of Manhole': '1.89', 'Backdrop': '' },
      { 'Manhole No.': 'MH28', 'Type of Building': 'Terrace', 'Length': '12', 'Pipe Size': '375', 'Gradient': '400', 'Pipe Type': 'VCP', 'Ground Level': '15.70', 'Invert Level': '13.78', 'Depth of Manhole': '1.92', 'Backdrop': '' },
      { 'Manhole No.': 'MH30', 'Type of Building': 'Terrace', 'Length': '19', 'Pipe Size': '375', 'Gradient': '400', 'Pipe Type': 'VCP', 'Ground Level': '15.70', 'Invert Level': '13.75', 'Depth of Manhole': '1.95', 'Backdrop': '' },
      { 'Manhole No.': 'STP',  'Type of Building': 'STP',     'Length': '',   'Pipe Size': '',    'Gradient': '',    'Pipe Type': '',    'Ground Level': '15.55', 'Invert Level': '13.70', 'Depth of Manhole': '1.85', 'Backdrop': '' },
    ];

    const DEMO_MIXED_DATA = [
      { 'ID': 'D01', 'Size': '600', 'Length': '5.2', 'Gradient': '1000', 'GL': '', 'IL': '7.32', 'Depth': '' },
      { 'ID': 'EXTG D02', 'Size': '900', 'Length': '10.5', 'Gradient': '800', 'GL': '', 'IL': '7.15', 'Depth': '' },
      { 'ID': 'OUTFALL', 'Size': '1200', 'Length': '24.0', 'Gradient': '500', 'GL': '', 'IL': '6.90', 'Depth': '' },
      { 'ID': 'MH-01', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '42.10', 'IL': '39.80', 'Depth': '2.30' },
      { 'ID': 'EXTG MH-02', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '41.80', 'IL': '39.00', 'Depth': '2.80' },
      { 'ID': 'STP', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '41.20', 'IL': '38.00', 'Depth': '3.20' },
    ];

    function escapeCSV(val) {
      if (val === null || val === undefined) return '';
      const str = String(val);
      if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    // =============================================================
    // SMART SHEET ENGINE
    //   1. seBuildTable    : finds the true header block (multi-row / merged
    //                        cells), labels every column, builds clean rows.
    //   2. seAnalyzeTable  : (a) classifies the file as DRAINAGE / SEWERAGE /
    //                        HYBRID / UNKNOWN from several independent signals,
    //                        (b) maps each engineering column by header text
    //                        AND by what the cells actually contain,
    //                        (c) works out how split ID columns combine
    //                        (e.g. "MH" + "1" -> MH-01, "EXTG" + "MH 1" -> EXTG MH-01,
    //                         "STP", "OUTFALL", "CROSSING 1", etc.).
    // =============================================================
    const SE_NUM_RE = /^-?\d+(\.\d+)?$/;
    const SE_MARKER_RE = /^\(\s*\d+\s*\)$/;
    const SE_UNIT_RE = /^\(?\s*(m|mm|ha|m2|m\u00b2|m3\/min|m3\/s|m\/s|m\/sec|m\/km|lps|l\/s|yr|yrs|min|mins|mm\/hr|%|nos?\.?)\s*\)?$/i;

    // Matches standard and special infrastructure IDs: MH1, EXTG MH1, EXTG, STP, SUMP 1, OUTFALL, CROSSING 1, FMH1, PS1, etc.
    const SE_MH_FULL_RE = /^(?:(?:EXTG\.?|EXISTING|EXT|PROP\.?|PROPOSED|NEW|TO|FROM)\s*[-_.]?\s*)?(?:MH|FMH|SMH|DMH|WMH|STP|PS|SPS|SUMP|OUTFALL|OUTLET|CROSSING|CULVERT|IC)\s*[-_.]?\s*\d*[A-Za-z]?(?:\s*\((?:EXTG\.?|EXISTING|STP|PROP\.?|NEW)\))?$/i;

    // Detects special tags anywhere in a row (EXTG, EXISTING, STP, OUTFALL, SUMP, CROSSING, PUMP STATION, FMH, TIE-IN)
    const SE_SPECIAL_TAG_EXTRACT_RE = /\b(EXTG\.?\s*MH\s*[-_.]?\s*\d+[A-Za-z]?|EXISTING\s*MH\s*[-_.]?\s*\d+[A-Za-z]?|EXTG\.?\s*MH|EXISTING\s*MH|PROPOSED\s*STP|EXTG\.?\s*STP|STP\s*[-_.]?\s*\d*[A-Za-z]?|EXTG\.?|EXISTING|OUTFALL\s*[-_.]?\s*\d*[A-Za-z]?|OUTLET\s*[-_.]?\s*\d*[A-Za-z]?|PUMP\s*STATION|SPS\s*[-_.]?\s*\d*|FMH\s*[-_.]?\s*\d*[A-Za-z]?|SUMP\s*[-_.]?\s*\d*[A-Za-z]?|CROSSING\s*[-_.]?\s*\d*[A-Za-z]?|TIE[\s-]*IN)\b/i;

    const seText = (v) => String(v === null || v === undefined ? '' : v).replace(/\s+/g, ' ').trim();

    const seColLetter = (idx) => {
      let n = idx + 1;
      let s = '';
      while (n > 0) {
        const m = (n - 1) % 26;
        s = String.fromCharCode(65 + m) + s;
        n = Math.floor((n - 1) / 26);
      }
      return s;
    };

    // Joins a split ID ("MH" + "1", "EXTG" + "1", "EXTG. MH" + "1", "STP" + "", "A" + "1", "1" + "A") into one clean CAD ID.
    const composeId = (mainRaw, subRaw) => {
      const main = String(mainRaw === undefined || mainRaw === null ? '' : mainRaw).replace(/\s+/g, ' ').trim().replace(/\.0+$/, '');
      const sub = String(subRaw === undefined || subRaw === null ? '' : subRaw).replace(/\s+/g, ' ').trim().replace(/\.0+$/, '');
      if (!sub || sub === '-') return main === '-' ? '' : main;
      if (!main || main === '-') return sub;

      const uMain = main.toUpperCase();
      const uSub = sub.toUpperCase();

      if (uMain === uSub) return main;
      if (uSub.startsWith(uMain) && /^[\s\-_.]/.test(uSub.slice(uMain.length))) return sub;

      // "MH" + "1" -> "MH-1" | "MH" + "EXTG 1" -> "EXTG MH-1"
      if (/^MH$/i.test(main)) {
        if (/^(EXTG|EXISTING|STP)/i.test(sub)) return `${sub} MH`.replace(/\s+/g, ' ').trim();
        return `MH-${sub}`;
      }

      // "EXTG" / "EXTG. MH" / "EXISTING MH" / "STP" / "PROP" + "1" or "MH 1"
      if (/^(EXTG\.?|EXISTING|EXT|EXTG\.?\s*MH|EXISTING\s*MH|STP|PROP\.?|PROPOSED|NEW|SUMP|OUTFALL|CROSSING|FMH|PS|SPS)$/i.test(main)) {
        if (/^\d+[A-Za-z]?$/.test(sub)) {
          if (/^(EXTG\.?|EXISTING|EXT)$/i.test(main)) return `EXTG MH-${sub}`;
          if (/MH$/i.test(main)) return `EXTG MH-${sub}`;
          return `${uMain.replace(/\.$/, '')} ${sub}`;
        }
        return `${uMain.replace(/\.$/, '')} ${sub}`;
      }

      // If sub is a special tag like "EXTG" or "STP" and main is "MH 1" or "1"
      if (/^(EXTG\.?|EXISTING|STP|PROP\.?|NEW|OUTFALL|SUMP)$/i.test(sub)) {
        return `${main} (${uSub.replace(/\.$/, '')})`;
      }

      // Short letter prefix + number/alnum (e.g. "A" + "1" -> "A1", "D" + "01" -> "D01")
      if (/^[A-Za-z]{1,4}$/.test(main) && /^[A-Za-z0-9]+$/.test(sub)) {
        return uSub.startsWith(uMain) ? sub : `${main}${sub}`;
      }

      // Number + sub-letter (e.g. "1" + "A" -> "1A")
      if (/^\d+$/.test(main) && /^[A-Za-z]{1,2}$/.test(sub)) {
        return `${main}${sub.toUpperCase()}`;
      }

      return `${main} ${sub}`;
    };

    // Scans a row for special tags (EXTG, STP, OUTFALL, SUMP, CROSSING, etc.) in ID or descriptor cells
    // and merges them into the ID if present in that row.
    const seEnrichIdWithRowTags = (baseId, row, columnMap, columns) => {
      let id = String(baseId || '').replace(/\s+/g, ' ').trim();

      // Check adjacent/descriptor columns in the row for EXTG, STP, OUTFALL, SUMP, CROSSING, etc.
      const extraTags = [];
      const numericCols = new Set([
        columnMap.size, columnMap.length, columnMap.gradient,
        columnMap.gl, columnMap.il, columnMap.depth,
        columnMap.drainIlUp, columnMap.drainIlDown, columnMap.backdrop, columnMap.pipeType
      ].filter(Boolean));

      columns.forEach((colKey, idx) => {
        if (numericCols.has(colKey)) return;
        const cellVal = seText(row[colKey]);
        if (!cellVal || cellVal === '-' || SE_NUM_RE.test(cellVal)) return;
        // Skip branch header banners or pipe roughness notes
        if (/^(PE\s+FROM|TOTAL|NOTE|VALUES\s+INDICATED|REMEMBER\s+TO|NEW\s+PIPE|OLD\s+PIPE|SEWER\s+IL\s+UNDER)/i.test(cellVal)) return;
        // Only inspect early location/ID/building columns (idx <= 4) or Remarks/Status columns
        const isEarlyOrRemarkCol = idx <= 4 || /remark|status|location|building|type|receive|note|desc/i.test(colKey);
        if (!isEarlyOrRemarkCol) return;

        const mTag = cellVal.match(SE_SPECIAL_TAG_EXTRACT_RE);
        if (mTag) {
          let tag = mTag[1].toUpperCase().replace(/\s+/g, ' ').replace(/\.$/, '').trim();
          if (tag === 'EXISTING') tag = 'EXTG';
          if (tag === 'EXISTING MH' || tag === 'EXTG. MH') tag = 'EXTG MH';
          if (!extraTags.includes(tag)) extraTags.push(tag);
        }
      });

      if (extraTags.length === 0) return id;

      // If the row had no primary ID (e.g. a standalone "STP" or "EXTG MH" row where the ID column was blank),
      // use the detected special tag as the row ID!
      if (!id || id === '?') {
        return extraTags.join(' ');
      }

      // Otherwise, if the row has a primary ID (e.g. "MH-08" or "1A") and also has a special tag like "EXTG" or "STP"
      // in the row that isn't already part of the ID string, include it in the ID!
      const uId = id.toUpperCase();
      extraTags.forEach(tag => {
        const coreWord = tag.split(/[\s-]/)[0]; // e.g. 'EXTG', 'STP', 'CROSSING', 'OUTFALL', 'SUMP'
        if (!uId.includes(coreWord)) {
          if (tag === 'EXTG' || tag === 'EXTG MH') {
            id = `EXTG ${id}`;
          } else {
            id = `${id} (${tag})`;
          }
        }
      });

      return id.replace(/\s+/g, ' ').trim();
    };

    const SE_HEADER_KEY_RES = [
      /manhole\s*no|mh\s*no|drain\s*name|drain\s*id|pipe\s*id|sewer\s*id|^no\.?$|^id$/,
      /\bsize\b|\bdia(meter)?\b|u-?drain/,
      /\blength\b|\blen\b/,
      /\bgrad(e|ient)?\b|\bslope\b/,
      /invert|\bil\b/,
      /ground\s*level|\bgl\b/,
      /\bdepth\b/,
      /back\s*-?\s*drop/,
      /pipe\s*type|material/,
      /capacity/,
      /velocity/,
      /type\s*of\s*(drain|building)/,
    ];

    const seHeaderRowScore = (cells) => {
      let hit = 0;
      SE_HEADER_KEY_RES.forEach(re => {
        if (cells.some(c => re.test(String(c).toLowerCase()))) hit++;
      });
      return hit;
    };

    // True when a row looks like real data rather than a header / note row.
    const seIsDataLikeRow = (cells) => {
      if (cells.some(c => SE_MH_FULL_RE.test(c))) return true;
      const nums = cells.filter(c => SE_NUM_RE.test(c));
      if (nums.length === 0) return false;
      const vals = nums.map(Number);
      const isCounterRow = vals.length >= 2 && vals.every((v, i) => (i === 0 ? v === 1 : v === vals[i - 1] + 1));
      return !isCounterRow;
    };

    function seBuildTable({ aoa, merges = [], rowOffset = 0, colOffset = 0, sheetName = '', fileName = '' }) {
      const rowsText = aoa.map(r => (r || []).map(seText));
      if (rowsText.length === 0) return null;

      const scanLimit = Math.min(rowsText.length, 45);
      let leafRow = -1;
      let bestScore = 0;
      for (let i = 0; i < scanLimit; i++) {
        const sc = seHeaderRowScore(rowsText[i].filter(Boolean));
        if (sc > bestScore) {
          bestScore = sc;
          leafRow = i;
        }
      }
      if (leafRow < 0 || bestScore < 2) {
        leafRow = rowsText.findIndex(r => r.filter(Boolean).length >= 3);
        if (leafRow < 0) return null;
      }

      let lastHdr = leafRow;
      for (let r = leafRow + 1; r < Math.min(rowsText.length, leafRow + 10); r++) {
        const cells = rowsText[r].filter(Boolean);
        if (cells.length === 0) continue;
        if (seIsDataLikeRow(cells)) break;
        if (cells.length === 1 && cells[0].length > 12) break;
        lastHdr = r;
      }

      const nCols = rowsText.reduce((mx, r) => Math.max(mx, r.length), 0);
      const H = [];
      for (let r = leafRow; r <= lastHdr; r++) {
        H.push(Array.from({ length: nCols }, (_, c) => rowsText[r][c] || ''));
      }

      merges.forEach(m => {
        const origin = rowsText[m.s.r] ? rowsText[m.s.r][m.s.c] : '';
        if (!origin) return;
        if (m.e.c - m.s.c + 1 > 14) return;
        for (let r = Math.max(m.s.r, leafRow); r <= Math.min(m.e.r, lastHdr); r++) {
          for (let c = m.s.c; c <= m.e.c; c++) {
            if (c < nCols && !H[r - leafRow][c]) H[r - leafRow][c] = origin;
          }
        }
      });

      const usable = (t) => t && !SE_MARKER_RE.test(t) && !SE_UNIT_RE.test(t) && !/^1\s*:\s*x$/i.test(t) && !(t.length === 1 && /[A-Za-z0-9]/.test(t));
      const labels = [];
      for (let c = 0; c < nCols; c++) {
        const parts = [];
        H.forEach(hr => {
          const t = hr[c];
          if (usable(t) && !parts.includes(t)) parts.push(t);
        });
        if (parts.length === 0) {
          for (let r = leafRow - 1; r >= Math.max(0, leafRow - 3); r--) {
            const t = rowsText[r][c];
            if (usable(t) && t.length <= 40 && !SE_NUM_RE.test(t)) {
              parts.push(t);
              break;
            }
          }
        }
        labels.push(parts.join(' '));
      }

      const dataRows = [];
      for (let r = lastHdr + 1; r < rowsText.length; r++) {
        if (rowsText[r].some(Boolean)) dataRows.push(rowsText[r]);
      }

      const keepCols = [];
      for (let c = 0; c < nCols; c++) {
        if (labels[c] || dataRows.some(row => row[c])) keepCols.push(c);
      }

      const usedKeys = new Set();
      const headers = [];
      const headerInfo = [];
      keepCols.forEach(c => {
        const letter = seColLetter(c + colOffset);
        let key = labels[c] || `Col ${letter}`;
        if (usedKeys.has(key)) key = `${key} [${letter}]`;
        usedKeys.add(key);
        headers.push(key);
        headerInfo.push({ key, label: labels[c] || '', letter, index: c });
      });

      const rows = dataRows.map(row => {
        const obj = {};
        keepCols.forEach((c, i) => {
          obj[headers[i]] = row[c] || '';
        });
        return obj;
      });

      const metaText = [
        fileName,
        sheetName,
        ...rowsText.slice(0, leafRow).map(r => r.filter(Boolean).join(' ')),
      ].join(' ');

      return { headers, rows, headerInfo, metaText, headerRow: leafRow + rowOffset + 1 };
    }

    function seBuildTableFromSheet(ws, { sheetName = '', fileName = '' } = {}) {
      if (!ws || !ws['!ref']) return null;
      const range = XLSX.utils.decode_range(ws['!ref']);
      const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: true });
      const merges = (ws['!merges'] || [])
        .map(m => ({
          s: { r: m.s.r - range.s.r, c: m.s.c - range.s.c },
          e: { r: m.e.r - range.s.r, c: m.e.c - range.s.c },
        }))
        .filter(m => m.s.r >= 0 && m.s.c >= 0);
      return seBuildTable({ aoa, merges, rowOffset: range.s.r, colOffset: range.s.c, sheetName, fileName });
    }

    // -- Column profiling (what do the cells actually contain?) --
    function seProfile(rows, key) {
      const vals = [];
      for (let i = 0; i < Math.min(rows.length, 400); i++) {
        const v = seText(rows[i][key]);
        if (v !== '' && v !== '-') vals.push(v);
      }
      const n = vals.length;
      const nums = vals
        .map(v => (SE_NUM_RE.test(v.replace(/,/g, '')) ? parseFloat(v.replace(/,/g, '')) : NaN))
        .filter(x => !isNaN(x));
      const sorted = [...nums].sort((a, b) => a - b);
      const uniq = new Set(vals).size;
      return {
        n,
        vals,
        numRatio: n ? nums.length / n : 0,
        median: sorted.length ? sorted[Math.floor(sorted.length / 2)] : NaN,
        unique: uniq,
        uniqueRatio: n ? uniq / n : 0,
        ratio: (re) => (n ? vals.filter(v => re.test(v)).length / n : 0),
      };
    }

    const SE_FIELD_SPECS = {
      size: {
        pos: [[/u-?drain\s*(width|size)|pipe\s*size|drain\s*size|pipe\s*dia|\bdia(meter)?\b|\bsize\b|\u00f8|\u2300/, 10]],
        neg: /capacity|velocity|roughness|\bks\b|time|area|coeff|rainfall|intensity|flow|height|peak|type/,
      },
      length: {
        pos: [[/\blength\b|\blen\b/, 10]],
        neg: /overland|time|roughness|\bks\b|capacity|velocity|travel|flow\s*len/,
      },
      gradient: {
        pos: [[/\bgrad(e|ient)?\b|\bslope\b|1\s*:\s*x|\bfall\b/, 10]],
        neg: /hydraulic|peak|velocity|capacity|\bflow\b|rainfall|intensity|check/,
      },
      gl: {
        pos: [[/ground\s*level|\bgl\b|cover\s*level|surface\s*level|\brl\b/, 10]],
        adj: [[/upstream|u\/s/, 3], [/downstream|d\/s/, -3]],
      },
      il: {
        pos: [[/invert\s*level|\binvert\b|\bil\b/, 10]],
        neg: /upstream|downstream|u\/s|d\/s|check|soffit/,
      },
      drainIlUp: {
        pos: [[/(invert|\bil\b).*(upstream|u\/s)|(upstream|u\/s).*(invert|\bil\b)/, 12]],
      },
      drainIlDown: {
        pos: [[/(invert|\bil\b).*(downstream|d\/s)|(downstream|d\/s).*(invert|\bil\b)/, 12]],
      },
      depth: {
        pos: [[/depth\s*of\s*manhole|\bmh\s*depth|\bdepth\b/, 10]],
        adj: [[/manhole|\bmh\b/, 3], [/upstream/, 1], [/downstream/, -2]],
      },
      pipeType: {
        pos: [[/pipe\s*type|type\s*of\s*pipe|pipe\s*material|\bmaterial\b|\bmat\b/, 10]],
        neg: /type\s*of\s*(drain|building)/,
      },
      backdrop: {
        pos: [[/back\s*-?\s*drop|\bb\/d\b/, 10], [/\bdrop\b/, 5]],
        neg: /capacity|velocity/,
      },
    };

    const SE_MATERIAL_RE = /^(VCP|RCP|HDPE|UPVC|PVC|DIP|DI|GRP|PE|CI|ST|STEEL|PP|ACP|CONCRETE)\b/i;

    function seHeaderScore(field, label) {
      const spec = SE_FIELD_SPECS[field];
      const t = String(label || '').toLowerCase();
      if (!t) return 0;
      if (spec.neg && spec.neg.test(t)) return 0;
      let best = 0;
      spec.pos.forEach(([re, w]) => {
        if (re.test(t)) best = Math.max(best, w);
      });
      if (best === 0) return 0;
      (spec.adj || []).forEach(([re, w]) => {
        if (re.test(t)) best += w;
      });
      return best;
    }

    function seContentScore(field, prof, nextProf) {
      if (!prof || prof.n === 0) return 0;
      const isLevel = ['gl', 'il', 'drainIlUp', 'drainIlDown', 'depth', 'backdrop'].includes(field);
      if (isLevel) return prof.numRatio >= 0.6 ? 3 : -8;
      if (field === 'size') {
        if (prof.numRatio < 0.6) return -8;
        return prof.median >= 40 && prof.median <= 3000 ? 4 : -3;
      }
      if (field === 'length') {
        if (prof.numRatio < 0.6) return -8;
        return prof.median >= 0.2 && prof.median <= 500 ? 3 : -2;
      }
      if (field === 'gradient') {
        if (prof.numRatio >= 0.6) {
          if (prof.median >= 20) return 3;
          if (prof.ratio(/^1$/) >= 0.6 && nextProf && nextProf.ratio(/^:$/) >= 0.6) return 3;
          return -3;
        }
        return prof.ratio(/^1\s*[:\/]\s*\d+/) >= 0.6 ? 3 : -6;
      }
      if (field === 'pipeType') {
        if (prof.numRatio >= 0.6) return -8;
        return prof.ratio(SE_MATERIAL_RE) >= 0.5 ? 6 : 0;
      }
      return 0;
    }

    const SE_ID_HDR_RE = /manhole|mh\s*no|drain\s*name|drain\s*id|pipe\s*id|sewer\s*id|\bid\b|\bno\.?(\s|$)|\bname\b|node|chamber|structure/;

    // Works out which column(s) form the ID, and whether two columns must be joined.
    function seDetectIdColumns(headers, headerInfo, rows, profile, excluded) {
      const cands = [];
      headers.forEach((h, i) => {
        if (i < 10 && !excluded.has(h)) cands.push(i);
      });

      const kinds = {};
      cands.forEach(i => {
        const p = profile(headers[i]);
        kinds[i] = {
          p,
          label: String((headerInfo[i] && headerInfo[i].label) || headers[i]).toLowerCase(),
          mhFull: p.ratio(SE_MH_FULL_RE),
          mhPrefix: p.ratio(/^(MH|EXTG\.?|EXISTING|EXTG\.?\s*MH|STP|FMH|SMH|SUMP|OUTFALL|CROSSING)$/i),
          prefix: p.unique <= 12 ? p.ratio(/^[A-Za-z.\s]{1,10}$/) : 0,
          int: p.ratio(/^\d{1,4}(\.0+)?$/),
          alnum: p.ratio(/^([A-Za-z.\s]{1,10}\s*[-_]?\s*\d+[A-Za-z]?|\d+[A-Za-z]{1,2}|STP|EXTG.*|OUTFALL.*|CROSSING.*|SUMP.*)$/i),
          letter1: p.ratio(/^[A-Za-z]$/),
        };
        kinds[i].hdr = SE_ID_HDR_RE.test(kinds[i].label);
      });

      const options = [];

      cands.forEach(i => {
        const k = kinds[i];
        if (k.p.n < 2) return;
        if (k.mhFull >= 0.4) options.push({ score: 22 + (k.hdr ? 10 : 0), main: i, sub: -1 });
        else if (k.alnum >= 0.4) options.push({ score: 14 + (k.hdr ? 10 : 0), main: i, sub: -1 });
        else if (k.int >= 0.5 && k.hdr) options.push({ score: 12, main: i, sub: -1 });
        else if (k.hdr && k.p.uniqueRatio >= 0.7 && k.numRatio !== 1) options.push({ score: 8, main: i, sub: -1 });
      });

      cands.forEach(i => {
        const a = kinds[i];
        if (a.p.n < 2) return;
        [1, 2].forEach(step => {
          const j = i + step;
          if (!kinds[j] || kinds[j].p.n < 2) return;
          const b = kinds[j];
          let base = 0;
          if (a.prefix >= 0.4 && b.int >= 0.4) base = 26;
          else if (a.prefix >= 0.4 && b.alnum >= 0.4) base = 22;
          else if (a.int >= 0.4 && b.letter1 >= 0.4) base = 22;
          if (!base) return;

          let both = 0;
          for (let r = 0; r < Math.min(rows.length, 400); r++) {
            if (seText(rows[r][headers[i]]) && seText(rows[r][headers[j]])) both++;
          }
          if (both / Math.max(a.p.n, b.p.n) < 0.4) return;

          const hasHdr = a.hdr || b.hdr;
          const mhPrefix = a.mhPrefix >= 0.4;
          const subUnique = b.p.uniqueRatio >= 0.4;
          if (!hasHdr && !mhPrefix && !subUnique) return;

          options.push({
            score: base + (hasHdr ? 10 : 0) + (mhPrefix ? 8 : 0) + b.p.uniqueRatio * 6 - (step - 1),
            main: i,
            sub: j,
          });
        });
      });

      if (options.length === 0) {
        const fallback = cands.find(i => kinds[i] && kinds[i].hdr);
        return fallback === undefined ? null : { main: fallback, sub: -1, score: 1 };
      }
      options.sort((x, y) => (y.score - x.score) || (x.main - y.main));
      return options[0];
    }

    const SE_SEWER_SIGNALS = [
      [/sewer(age)?|sewage/, 8, 'Sewer / Sewage wording'],
      [/\biwk\b/, 6, 'IWK'],
      [/manhole/, 5, 'Manhole headers'],
      [/peak\s*factor|cumulative\s*peak\s*flow/, 6, 'Peak Factor / Peak Flow'],
      [/population|\(\s*pe\s*\)|accumulative\s*pe|\bpe\b/, 5, 'Population (PE)'],
      [/back\s*-?\s*drop/, 4, 'Backdrop'],
      [/vcp|vitrified/, 2, 'VCP pipe'],
      [/reticulation/, 3, 'Reticulation'],
    ];
    const SE_DRAIN_SIGNALS = [
      [/storm\s*(water\s*)?drain(age)?|stormwater/, 8, 'Storm Drainage wording'],
      [/\bmasma\b|\bmsma\b/, 6, 'MSMA / MASMA'],
      [/catchment/, 5, 'Catchment'],
      [/runoff/, 5, 'Runoff coefficient'],
      [/time\s*of\s*concentration|overland/, 5, 'Time of concentration'],
      [/rainfall|intensity|return\s*period/, 4, 'Rainfall / ARI'],
      [/u-?drain/, 6, 'U-Drain'],
      [/drain\s*name|drain\s*id/, 6, 'Drain Name'],
      [/type\s*of\s*drain|culvert/, 5, 'Type of Drain'],
      [/crossing/, 2, 'Crossing'],
    ];

    function seAnalyzeTable({ headers, rows, headerInfo = null, metaText = '' }) {
      const info = headerInfo && headerInfo.length === headers.length
        ? headerInfo
        : headers.map((h, i) => ({ key: h, label: h, letter: seColLetter(i), index: i }));

      const profCache = {};
      const profile = (key) => {
        if (!profCache[key]) profCache[key] = seProfile(rows, key);
        return profCache[key];
      };

      const mapping = {
        drainId: '', drainIdSub: '', size: '', length: '', gradient: '',
        drainIlUp: '', drainIlDown: '', sewerId: '', sewerIdSub: '',
        gl: '', il: '', depth: '', pipeType: '', backdrop: '',
      };

      const cands = [];
      Object.keys(SE_FIELD_SPECS).forEach(field => {
        headers.forEach((key, i) => {
          const hs = seHeaderScore(field, info[i].label || key);
          if (hs <= 0) return;
          const next = headers[i + 1] ? profile(headers[i + 1]) : null;
          const total = hs + seContentScore(field, profile(key), next);
          if (total >= 8) cands.push({ field, key, idx: i, score: total });
        });
      });
      cands.sort((a, b) => (b.score - a.score) || (a.idx - b.idx));
      const usedCols = new Set();
      cands.forEach(c => {
        if (mapping[c.field] || usedCols.has(c.key)) return;
        mapping[c.field] = c.key;
        usedCols.add(c.key);
      });

      if (mapping.gradient) {
        const gi = headers.indexOf(mapping.gradient);
        const p0 = profile(headers[gi]);
        const p1 = headers[gi + 1] ? profile(headers[gi + 1]) : null;
        const p2 = headers[gi + 2] ? profile(headers[gi + 2]) : null;
        if (p0.ratio(/^1$/) >= 0.6 && p1 && p1.ratio(/^:$/) >= 0.6 && p2 && p2.numRatio >= 0.6) {
          mapping.gradient = headers[gi + 2];
        }
      }

      const reasons = [];
      const notes = [];
      if (mapping.gl && mapping.il) {
        let ok = 0;
        let bad = 0;
        rows.slice(0, 400).forEach(r => {
          const g = parseFloat(seText(r[mapping.gl]));
          const l = parseFloat(seText(r[mapping.il]));
          if (!isNaN(g) && !isNaN(l)) (g >= l ? ok++ : bad++);
        });
        if (bad > ok && bad >= 2) {
          const tmp = mapping.gl;
          mapping.gl = mapping.il;
          mapping.il = tmp;
          notes.push('GL and IL columns were swapped after checking the levels (GL must be above IL)');
        }
      }

      const idPick = seDetectIdColumns(headers, info, rows, profile, usedCols);
      const idInfo = { kind: 'none', mainKey: '', subKey: '', samples: [] };
      if (idPick) {
        mapping.drainId = mapping.sewerId = headers[idPick.main];
        idInfo.mainKey = headers[idPick.main];
        idInfo.kind = 'single';
        if (idPick.sub >= 0) {
          mapping.drainIdSub = mapping.sewerIdSub = headers[idPick.sub];
          idInfo.subKey = headers[idPick.sub];
          idInfo.kind = 'pair';
        }
      }

      const composedIds = [];
      rows.slice(0, 400).forEach(r => {
        const rawCombined = composeId(seText(r[mapping.sewerId]), mapping.sewerIdSub ? seText(r[mapping.sewerIdSub]) : '');
        const enriched = seEnrichIdWithRowTags(rawCombined, r, mapping, headers);
        if (enriched && !/^PE\s+FROM/i.test(enriched)) composedIds.push(enriched);
      });
      idInfo.samples = composedIds.filter((v, i, a) => a.indexOf(v) === i).slice(0, 5);

      let sew = 0;
      let drn = 0;
      const sewHits = [];
      const drnHits = [];
      const corpus = `${metaText} ${info.map(x => x.label || x.key).join(' ')}`.toLowerCase();
      SE_SEWER_SIGNALS.forEach(([re, w, name]) => { if (re.test(corpus)) { sew += w; sewHits.push(name); } });
      SE_DRAIN_SIGNALS.forEach(([re, w, name]) => { if (re.test(corpus)) { drn += w; drnHits.push(name); } });

      if (mapping.backdrop) { sew += 2; sewHits.push('Backdrop column'); }
      if (mapping.drainIlUp && mapping.drainIlDown) { drn += 4; drnHits.push('Invert Level Up/Downstream pair'); }

      const hasSewerCols = Boolean(mapping.gl || mapping.il || mapping.depth);
      const hasDrainCols = Boolean(mapping.size || mapping.length || mapping.gradient);

      const mhRatio = composedIds.length ? composedIds.filter(v => /(^|\b)(MH|STP|FMH)/i.test(v)).length / composedIds.length : 0;
      const drainStyleRatio = composedIds.length
        ? composedIds.filter(v => !/(^|\b)(MH|STP|FMH)/i.test(v) && /^([A-Za-z]{1,3}[-\s]?\d+[A-Za-z]?|\d+[A-Za-z]{1,2}|CROSSING.*|OUTFALL.*|SUMP.*)$/i.test(v)).length / composedIds.length
        : 0;
      if (mhRatio >= 0.3) { sew += 8; sewHits.push(`MH/STP IDs in ${Math.round(mhRatio * 100)}% of rows`); }
      if (drainStyleRatio >= 0.5 && (drn > 0 || (mapping.size && mapping.length))) {
        drn += 5;
        drnHits.push(`Drain-style IDs in ${Math.round(drainStyleRatio * 100)}% of rows`);
      }

      const diff = sew - drn;

      let mode;
      if (!hasSewerCols && !hasDrainCols) {
        mode = 'UNKNOWN';
      } else if (mhRatio >= 0.1 && mhRatio <= 0.9 && drainStyleRatio >= 0.1 && hasSewerCols && hasDrainCols) {
        mode = 'HYBRID';
      } else if (Math.max(sew, drn) < 6) {
        mode = 'UNKNOWN';
      } else if (Math.abs(diff) < 4) {
        mode = 'UNKNOWN';
      } else {
        mode = diff > 0 ? 'SEWERAGE' : 'DRAINAGE';
      }

      let confidence = 'NONE';
      if (mode === 'HYBRID') confidence = 'MEDIUM';
      else if (mode !== 'UNKNOWN') confidence = Math.abs(diff) >= 12 ? 'HIGH' : (Math.abs(diff) >= 7 ? 'MEDIUM' : 'LOW');

      if (mode === 'SEWERAGE' || mode === 'HYBRID') reasons.push(`Sewerage: ${sewHits.join(', ') || 'none'}`);
      if (mode === 'DRAINAGE' || mode === 'HYBRID') reasons.push(`Drainage: ${drnHits.join(', ') || 'none'}`);
      if (mode === 'UNKNOWN') reasons.push(`Not enough evidence (sewerage ${sew} vs drainage ${drn})`);

      return {
        mapping,
        mode,
        confidence,
        reasons,
        notes,
        scores: { sew, drn },
        idInfo,
        evidence: { sew: sewHits, drn: drnHits },
      };
    }

        } catch (e) {}
      }, [settings]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // ─────────────────────────────────────────────────────────────
      // SMART DISCIPLINE CLASSIFIER & COLUMN DETECTOR
      // ─────────────────────────────────────────────────────────────
      const detectColumns = (headerList, sampleRows = [], metaText = '', headerInfo = null) => {
        const res = seAnalyzeTable({ headers: headerList, rows: sampleRows, headerInfo, metaText });
        const notes = [...res.notes];

        if (res.mode === 'DRAINAGE' && targetTool === 'SEWSECTION') {
          setTargetTool('CSVUPDATE');
          notes.push('This is a drainage file and Long Section is sewerage-only, so the tool was switched to CSVUPDATE automatically.');
        }

        setColumnMap(res.mapping);
        setDetectedMode(res.mode);
        setDetectionConfidence(res.confidence);
        setDetectionScores(res.scores);
        setDetectionNotes(notes);
        setIdInfo(res.idInfo);
        setDetectionReason(res.reasons.length > 0 ? res.reasons.join(' • ') : `Auto-detected ${res.mode}`);
        return res;
      };

      // ─────────────────────────────────────────────────────────────
      // EXCEL FILE PARSING VIA SHEETJS
      // ─────────────────────────────────────────────────────────────
      const handleFile = (file) => {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });

            let bestSheet = wb.SheetNames[0];
            let bestScore = -1;
            for (const sn of wb.SheetNames) {
              if (/^(dni|copypaste|cover|instruction)/i.test(sn.trim())) continue;
              const previewArr = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '', raw: false }).slice(0, 45);
              const score = previewArr.reduce((mx, r) => Math.max(mx, seHeaderRowScore(r.map(seText).filter(Boolean))), 0);
              if (score > bestScore) {
                bestScore = score;
                bestSheet = sn;
              }
            }

            setWorkbook(wb);
            setFileInfo({
              name: file.name,
              size: (file.size / 1024).toFixed(1) + ' KB',
              sheetNames: wb.SheetNames,
            });

            setActiveSheet(bestSheet);
            setActiveSecIdx(0);
            const res = parseSheet(wb, bestSheet, file.name);
            const verdict = res
              ? (res.mode === 'UNKNOWN' ? 'please choose Drainage or Sewerage' : `detected ${res.mode}`)
              : 'no table found';
            showToast(`Loaded "${file.name}" (${bestSheet}) - ${verdict}`);
          } catch (err) {
            console.error('Error parsing Excel file:', err);
            alert('Failed to parse Excel file. Please ensure it is a valid .xls, .xlsx, or .xlsm file.');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const parseSheet = (wb, sheetName, fileNameOverride = '') => {
        const ws = wb.Sheets[sheetName];
        if (!ws) return null;

        const table = seBuildTableFromSheet(ws, {
          sheetName,
          fileName: fileNameOverride || (fileInfo ? fileInfo.name : ''),
        });

        if (!table || table.rows.length === 0) {
          showToast(`Warning: Sheet "${sheetName}" is empty.`);
          setRawRows([]);
          setColumns([]);
          return null;
        }

        setColumns(table.headers);
        setRawRows(table.rows);
        setUserDesignMode('AUTO');
        return detectColumns(table.headers, table.rows, table.metaText, table.headerInfo);
      };

      // ─────────────────────────────────────────────────────────────
      // LOAD DEMO DATASETS
      // ─────────────────────────────────────────────────────────────
      const loadDemo = (type) => {
        let data, name, headers;
        if (type === 'drainage') {
          data = DEMO_DRAINAGE_DATA;
          name = 'MSMA_Road_Drainage_Schedule.xlsx';
          headers = Object.keys(DEMO_DRAINAGE_DATA[0]);
        } else if (type === 'sewerage' || type === 'sewsection') {
          data = DEMO_SEWERAGE_DATA;
          name = 'JRK_Sewerage_LongSection_Calculation.xlsx';
          headers = Object.keys(DEMO_SEWERAGE_DATA[0]);
          if (type === 'sewsection') {
            setTargetTool('SEWSECTION');
          }
        } else {
          data = DEMO_MIXED_DATA;
          name = 'Infrastructure_Combined_Schedule.xlsx';
          headers = Object.keys(DEMO_MIXED_DATA[0]);
        }

        setActiveSecIdx(0);
        setUserDesignMode('AUTO');
        setColumns(headers);
        setRawRows(data);
        setFileInfo({
          name: `${name} (Sample)`,
          size: '14.8 KB',
          sheetNames: ['Schedule'],
        });
        setActiveSheet('Schedule');
        detectColumns(headers, data, name);
        showToast(`Loaded sample ${type} schedule!`);
      };

      const downloadTemplate = () => {
        const wb = XLSX.utils.book_new();
        const wsDrain = XLSX.utils.json_to_sheet(DEMO_DRAINAGE_DATA);
        const wsSewer = XLSX.utils.json_to_sheet(DEMO_SEWERAGE_DATA);
        XLSX.utils.book_append_sheet(wb, wsDrain, 'Drainage_Pipes');
        XLSX.utils.book_append_sheet(wb, wsSewer, 'Sewer_LongSection');
        XLSX.writeFile(wb, 'JRK_AutoCAD_Smart_Schedule_Template.xlsx');
        showToast('Downloaded: JRK_AutoCAD_Smart_Schedule_Template.xlsx');
      };

      // ─────────────────────────────────────────────────────────────
      // 1. CSVUPDATE ENGINE (Plan View MTEXT & Lowest IL Deduplication)
      //    Supports EXTG, STP, OUTFALL, SUMP, CROSSING & Custom IDs
      // ─────────────────────────────────────────────────────────────
      const buildDrainageCadString = (id, size, length, gradient) => {
        const widthVal = parseFloat(settings.textWidthFactor) || 0.5;
        const widthPrefix = `{\\W${widthVal};`;
        const sizeDisplay = size || '600';
        const gradDisplay = gradient || '1000';

        const lenNum = parseFloat(length);
        const hasValidLen = !isNaN(lenNum) && lenNum >= 0;
        const lenDisplay = hasValidLen
          ? (Number.isInteger(lenNum) ? lenNum.toString() : lenNum.toFixed(1))
          : '0';

        const isShort = hasValidLen && lenNum <= settings.shortPipeThreshold;
        const isMedium = hasValidLen && lenNum > settings.shortPipeThreshold && lenNum <= settings.mediumPipeThreshold;

        let cadString = '';
        let conditionBadge = '';

        if (settings.smartLengthFormatting && isShort) {
          cadString = `${widthPrefix}${id};\\P${sizeDisplay}%%c\\P${lenDisplay}m\\P1:${gradDisplay}}`;
          conditionBadge = `Short Pipe (<= ${settings.shortPipeThreshold}m, 4-Line)`;
        } else if (settings.smartLengthFormatting && isMedium) {
          cadString = `${widthPrefix}${id}; ${sizeDisplay}%%c\\P${lenDisplay}m 1:${gradDisplay}}`;
          conditionBadge = `Medium Pipe (<= ${settings.mediumPipeThreshold}m, 2-Line)`;
        } else {
          cadString = `${widthPrefix}${id}; ${sizeDisplay}%%c ${lenDisplay}m 1:${gradDisplay}}`;
          conditionBadge = settings.smartLengthFormatting
            ? `Long Pipe (> ${settings.mediumPipeThreshold}m, 1-Line)`
            : 'Smart Formatting OFF (1-Line)';
        }

        return { cadString, conditionBadge, sizeDisplay, lenDisplay, gradDisplay };
      };

      const buildSewerageCadString = (id, gl, il, depth) => {
        const widthVal = parseFloat(settings.textWidthFactor) || 0.5;
        const widthPrefix = `{\\W${widthVal};`;
        const numGL = parseFloat(gl);
        const numIL = parseFloat(il);
        let numDepth = parseFloat(depth);

        if (!isNaN(numGL) && !isNaN(numIL)) {
          numDepth = numGL - numIL;
        }

        const glDisplay = !isNaN(numGL) ? numGL.toFixed(2) : (gl || '00.00');
        const ilDisplay = !isNaN(numIL) ? numIL.toFixed(2) : (il || '00.00');
        const depthDisplay = !isNaN(numDepth) ? numDepth.toFixed(2) : (depth || '00.00');

        const cadString = `${widthPrefix}${id};\\PGL: ${glDisplay}m\\PIL: ${ilDisplay}m\\PDEPTH: ${depthDisplay}m}`;
        return { cadString, glDisplay, ilDisplay, depthDisplay };
      };

      // Standardizes Sewer / Drain ID while preserving EXTG, STP, OUTFALL, SUMP, CROSSING, etc.
      const normalizeCadId = (rawId, isSewerRow) => {
        const s = String(rawId || '').replace(/\s+/g, ' ').trim();
        if (!s) return '';

        if (isSewerRow) {
          // 1. Pure number: "1" -> "MH-01"
          const mBare = s.match(/^0*(\d+)(?:\.0+)?([A-Za-z]?)$/);
          if (mBare) return `MH-${mBare[1].padStart(2, '0')}${mBare[2].toUpperCase()}`;

          // 2. Standard MH with optional prefix/suffix: e.g. "MH 1", "EXTG MH 1", "MH 1 (EXTG)", "MH1 STP"
          const mPref = s.match(/^(?:(EXTG\.?|EXISTING|PROP\.?|NEW)\s*[-_.]?\s*)?MH\s*[-_.]?\s*0*(\d+)(?:\.0+)?([A-Za-z]?)(?:\s*\(?([A-Za-z0-9.\s-]+)\)?)?$/i);
          if (mPref) {
            const lead = mPref[1] ? `${mPref[1].toUpperCase().replace(/\.$/, '').replace('EXISTING', 'EXTG')} ` : '';
            const num = mPref[2].padStart(2, '0');
            const sub = (mPref[3] || '').toUpperCase();
            const tail = mPref[4] ? ` (${mPref[4].toUpperCase().trim()})` : '';
            return `${lead}MH-${num}${sub}${tail}`;
          }

          // 3. Special prefix + number without "MH" (e.g. "EXTG 1" -> "EXTG MH-01", "STP 1" -> "STP-01", "FMH 1" -> "FMH-01")
          const mSpecNum = s.match(/^(EXTG\.?|EXISTING|STP|FMH|SMH|PS|SPS|SUMP|OUTFALL)\s*[-_.]?\s*0*(\d+)(?:\.0+)?([A-Za-z]?)$/i);
          if (mSpecNum) {
            const tag = mSpecNum[1].toUpperCase().replace(/\.$/, '').replace('EXISTING', 'EXTG');
            const num = mSpecNum[2].padStart(2, '0');
            const sub = (mSpecNum[3] || '').toUpperCase();
            return tag === 'EXTG' ? `EXTG MH-${num}${sub}` : `${tag}-${num}${sub}`;
          }

          // 4. Standalone special structure (e.g. "STP", "EXTG MH", "OUTFALL", "PUMP STATION")
          return s.toUpperCase();
        } else {
          // Drainage ID normalization (preserves EXTG, CROSSING, OUTFALL, SUMP, etc.)
          const mDrn = s.match(/^([a-zA-Z]{1,3})\s*[-_]?\s*(\d+)$/);
          if (mDrn) {
            const prefix = mDrn[1].toUpperCase();
            const num = mDrn[2].padStart(2, '0');
            return `${prefix}${num}`;
          }
          return s.toUpperCase();
        }
      };

      const formatRow = (row) => {
        if (effectiveMode === 'UNKNOWN') return null;

        const sewerIdBase = composeId(row[columnMap.sewerId], columnMap.sewerIdSub ? row[columnMap.sewerIdSub] : '');
        const drainIdBase = composeId(row[columnMap.drainId], columnMap.drainIdSub ? row[columnMap.drainIdSub] : '');

        // Enrich ID with any EXTG / STP / OUTFALL / SUMP / CROSSING tag found in the row
        const sewerIdRaw = seEnrichIdWithRowTags(sewerIdBase, row, columnMap, columns);
        const drainIdRaw = seEnrichIdWithRowTags(drainIdBase, row, columnMap, columns);

        let glRaw = String(row[columnMap.gl] || '').trim();
        let ilRaw = String(row[columnMap.il] || '').trim();
        let depthRaw = String(row[columnMap.depth] || '').trim();
        let sizeRaw = String(row[columnMap.size] || '').trim();
        let lengthRaw = String(row[columnMap.length] || '').trim();
        let gradRaw = String(row[columnMap.gradient] || '').trim();

        if (gradRaw === '1' && columnMap.gradient) {
          const gIdx = columns.indexOf(columnMap.gradient);
          if (gIdx !== -1 && gIdx + 2 < columns.length) {
            const colonCell = String(row[columns[gIdx + 1]] || '').trim();
            const denomCell = String(row[columns[gIdx + 2]] || '').trim();
            if (colonCell === ':' && /^\d+(\.\d+)?$/.test(denomCell)) {
              gradRaw = denomCell;
            }
          }
        }

        let ilUpRaw = String(row[columnMap.drainIlUp] || '').trim();
        let ilDownRaw = String(row[columnMap.drainIlDown] || '').trim();

        const cleanNumber = (val) => {
          if (!val) return '';
          if (val.includes('#DIV/0!') || val.includes('#REF!') || val.includes('#VALUE!')) return '?';
          return val.replace(/[^0-9.-]/g, '');
        };

        sizeRaw = cleanNumber(sizeRaw);
        lengthRaw = cleanNumber(lengthRaw);
        glRaw = cleanNumber(glRaw);
        ilRaw = cleanNumber(ilRaw);
        depthRaw = cleanNumber(depthRaw);
        ilUpRaw = cleanNumber(ilUpRaw);
        ilDownRaw = cleanNumber(ilDownRaw);

        if (settings.cleanGradientPrefix) {
          gradRaw = gradRaw.replace(/^1\s*[:/]\s*/i, '');
        }
        gradRaw = cleanNumber(gradRaw);

        const rawIdCheck = (sewerIdRaw || drainIdRaw).toUpperCase();
        if (!rawIdCheck || rawIdCheck === 'D' || rawIdCheck === 'ID' || rawIdCheck === 'MANHOLE' || rawIdCheck.startsWith('PE FROM')) {
          return null;
        }

        const hasSewerData = Boolean((glRaw && glRaw !== '?') || (ilRaw && ilRaw !== '?') || (depthRaw && depthRaw !== '?'));
        const hasDrainData = Boolean((sizeRaw && sizeRaw !== '?') || (lengthRaw && lengthRaw !== '?') || (gradRaw && gradRaw !== '?'));

        if (!hasSewerData && !hasDrainData) return null;

        let isSewerRow = false;
        if (effectiveMode === 'SEWERAGE') {
          if (!hasSewerData) return null;
          isSewerRow = true;
        } else if (effectiveMode === 'DRAINAGE') {
          if (!hasDrainData && !hasSewerData) return null;
          isSewerRow = false;
        } else {
          isSewerRow = hasSewerData && (!hasDrainData || /(^|\b)(MH|STP|FMH)/i.test(sewerIdRaw));
        }

        let effectiveId = normalizeCadId(isSewerRow ? (sewerIdRaw || drainIdRaw) : (drainIdRaw || sewerIdRaw), isSewerRow);
        if (!effectiveId || effectiveId === '?') return null;

        const candidateILs = [ilRaw, ilDownRaw, ilUpRaw]
          .map(v => parseFloat(v))
          .filter(n => !isNaN(n));
        const effectiveIL = candidateILs.length > 0 ? Math.min(...candidateILs) : NaN;

        const hasSpecialTag = SE_SPECIAL_TAG_EXTRACT_RE.test(effectiveId);

        if (isSewerRow) {
          const sewBuilt = buildSewerageCadString(
            effectiveId,
            glRaw,
            !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : ilRaw,
            depthRaw
          );
          const visualLines = sewBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').replace(/%%c/g, 'Ø').split('\\P');
          return {
            id: effectiveId,
            category: 'SEWERAGE',
            cadString: sewBuilt.cadString,
            conditionBadge: hasSpecialTag ? 'Special Node (EXTG/STP Included)' : 'Manhole (4-Line Label)',
            visualLines,
            effectiveIL,
            drainDetails: { size: sizeRaw, length: lengthRaw, gradient: gradRaw, il: !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : '' },
            sewerDetails: { gl: sewBuilt.glDisplay, il: sewBuilt.ilDisplay, depth: sewBuilt.depthDisplay },
            rawRow: row,
          };
        } else {
          const drnBuilt = buildDrainageCadString(effectiveId, sizeRaw, lengthRaw, gradRaw);
          const visualLines = drnBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').replace(/%%c/g, 'Ø').split('\\P');
          return {
            id: effectiveId,
            category: 'DRAINAGE',
            cadString: drnBuilt.cadString,
            conditionBadge: hasSpecialTag ? `${drnBuilt.conditionBadge} • EXTG/Special` : drnBuilt.conditionBadge,
            visualLines,
            effectiveIL,
            drainDetails: {
              size: drnBuilt.sizeDisplay,
              length: drnBuilt.lenDisplay,
              gradient: drnBuilt.gradDisplay,
              il: !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : '',
            },
            sewerDetails: { gl: glRaw, il: ilRaw, depth: depthRaw },
            rawRow: row,
          };
        }
      };

      const processedRows = useMemo(() => {
        const rawFormatted = rawRows.map((r, i) => formatRow(r, i)).filter(Boolean);
        const uniqueMap = new Map();

        rawFormatted.forEach(item => {
          const cleanId = item.id.toUpperCase();

          if (!uniqueMap.has(cleanId)) {
            uniqueMap.set(cleanId, { ...item, duplicateCount: 1 });
          } else {
            const existing = uniqueMap.get(cleanId);
            const dupCount = (existing.duplicateCount || 1) + 1;
            const existingIL = existing.effectiveIL;
            const newIL = item.effectiveIL;

            const newIsLower = (!isNaN(newIL) && (isNaN(existingIL) || newIL < existingIL));

            if (item.category === 'SEWERAGE') {
              if (newIsLower) {
                const gl = parseFloat(item.sewerDetails.gl) || parseFloat(existing.sewerDetails.gl) || 0;
                const sewBuilt = buildSewerageCadString(item.id, gl.toFixed(2), newIL.toFixed(2), '');
                const updatedItem = {
                  ...item,
                  duplicateCount: dupCount,
                  effectiveIL: newIL,
                  cadString: sewBuilt.cadString,
                  sewerDetails: { gl: sewBuilt.glDisplay, il: sewBuilt.ilDisplay, depth: sewBuilt.depthDisplay },
                  conditionBadge: `Merged ${dupCount} Rows (Lowest IL: ${newIL.toFixed(2)}m)`,
                  visualLines: sewBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').split('\\P'),
                };
                uniqueMap.set(cleanId, updatedItem);
              } else {
                const bestILText = !isNaN(existingIL) ? `${existingIL.toFixed(2)}m` : 'Kept';
                existing.duplicateCount = dupCount;
                existing.conditionBadge = `Merged ${dupCount} Rows (Lowest IL: ${bestILText})`;
              }
            } else {
              if (newIsLower) {
                const updatedItem = {
                  ...item,
                  duplicateCount: dupCount,
                  effectiveIL: newIL,
                  conditionBadge: `${item.conditionBadge} • Lowest IL (${newIL.toFixed(2)}m of ${dupCount})`,
                };
                uniqueMap.set(cleanId, updatedItem);
              } else {
                const bestILText = !isNaN(existingIL) ? `${existingIL.toFixed(2)}m` : 'Kept';
                existing.duplicateCount = dupCount;
                if (!existing.conditionBadge.includes('Lowest IL')) {
                  existing.conditionBadge = `${existing.conditionBadge} • Lowest IL (${bestILText} of ${dupCount})`;
                }
              }
            }
          }
        });

        return Array.from(uniqueMap.values());
      }, [rawRows, columnMap, settings, effectiveMode]);

      // ─────────────────────────────────────────────────────────────
      // 2. SEWSECTION ENGINE (Longitudinal Section Profile Chains & 200m Splitter)
      //    Supports EXTG, STP, OUTFALL, SUMP, FMH & Tagged Manholes
      // ─────────────────────────────────────────────────────────────
      const computeSectionDatum = (nodes) => {
        if (!settings.secAutoDatum) {
          return parseFloat(settings.secManualDatum) || 0;
        }
        const minIL = Math.min(...nodes.map(n => n.ilOut));
        const baseU10 = parseFloat(settings.secBaseDatumUnder10) || 0;
        let dVal = minIL >= 10.0
          ? Math.floor(minIL / 10.0) * 10.0 + baseU10
          : baseU10;
        if (dVal > minIL - 1.0) {
          dVal = Math.max(0, Math.floor(minIL - 2.0));
        }
        return dVal;
      };

      const sewSections = useMemo(() => {
        const limitM = parseFloat(settings.secMaxDist) || 200;
        const splitMode = settings.secSplitMode || 'CROSS';
        const allSections = [];
        let curRun = [];
        let pendingPipe = null;
        let cumDist = 0.0;

        const cleanNum = (val) => {
          if (val === null || val === undefined) return NaN;
          const s = String(val).trim();
          if (!s || s === '-' || /#DIV|#REF|#VALUE|#N\/A/i.test(s)) return NaN;
          const cleaned = s.replace(/[^0-9.-]/g, '');
          return cleaned ? parseFloat(cleaned) : NaN;
        };

        // Formats Manhole / Structure IDs while preserving EXTG, STP, OUTFALL, SUMP, FMH, etc.
        const formatMhTag = (rawPrefix, rawSub, row) => {
          const baseCombined = composeId(rawPrefix, rawSub).trim();
          const combined = seEnrichIdWithRowTags(baseCombined, row, columnMap, columns);
          if (!combined) return '';
          if (/^(PE\s+FROM|TOTAL|REMARK|NOTE|MANHOLE|MH\s*NO|BRANCH|LOCATION)/i.test(combined)) return '';

          // 1. Pure number (e.g. "1" or "1.0" -> "MH1")
          const mNum = combined.match(/^0*(\d+)(?:\.0+)?([A-Za-z]?)$/);
          if (mNum) {
            return `MH${mNum[1]}${mNum[2].toUpperCase()}`;
          }

          // 2. Standard or Prefixed/Suffixed MH (e.g. "MH 1", "EXTG MH 1", "MH 8 (EXTG)", "MH26 (STP)")
          const mMh = combined.match(/^(?:(EXTG\.?|EXISTING|PROP\.?|NEW)\s*[-_.]?\s*)?MH\s*[-_.]?\s*0*(\d+)(?:\.0+)?([A-Za-z]?)(?:\s*\(?([A-Za-z0-9.\s-]+)\)?)?$/i);
          if (mMh) {
            const lead = mMh[1] ? `${mMh[1].toUpperCase().replace(/\.$/, '').replace('EXISTING', 'EXTG')} ` : '';
            const num = mMh[2];
            const sub = (mMh[3] || '').toUpperCase();
            const tail = mMh[4] ? ` (${mMh[4].toUpperCase().trim()})` : '';
            return `${lead}MH${num}${sub}${tail}`;
          }

          // 3. Number + Tag (e.g. "1 (EXTG)" -> "MH1 (EXTG)", "26 (STP)" -> "MH26 (STP)")
          const mNumTag = combined.match(/^0*(\d+)(?:\.0+)?([A-Za-z]?)\s*\(([A-Za-z0-9.\s-]+)\)$/);
          if (mNumTag) {
            return `MH${mNumTag[1]}${mNumTag[2].toUpperCase()} (${mNumTag[3].toUpperCase().trim()})`;
          }

          // 4. Special tag + number (e.g. "EXTG 1" -> "EXTG MH1", "STP 1" -> "STP1", "FMH 1" -> "FMH1")
          const mSpecNum = combined.match(/^(EXTG\.?|EXISTING|STP|FMH|SMH|PS|SPS|SUMP|OUTFALL|CROSSING)\s*[-_.]?\s*0*(\d+)(?:\.0+)?([A-Za-z]?)$/i);
          if (mSpecNum) {
            const tag = mSpecNum[1].toUpperCase().replace(/\.$/, '').replace('EXISTING', 'EXTG');
            const num = mSpecNum[2];
            const sub = (mSpecNum[3] || '').toUpperCase();
            return tag === 'EXTG' ? `EXTG MH${num}${sub}` : `${tag}${num}${sub}`;
          }

          // 5. Any valid standalone special tag or custom structure ID (e.g. "STP", "EXTG MH", "EXTG", "OUTFALL", "PUMP STATION")
          if (SE_SPECIAL_TAG_EXTRACT_RE.test(combined) || /^[A-Za-z0-9][A-Za-z0-9\s\-_.()]{0,18}$/.test(combined)) {
            return combined.toUpperCase().replace(/\s+/g, ' ').trim();
          }

          return '';
        };

        rawRows.forEach((row) => {
          const idMainCol = columnMap.sewerId || columnMap.drainId;
          const idSubCol = columnMap.sewerId ? columnMap.sewerIdSub : columnMap.drainIdSub;
          const rawA = idMainCol ? row[idMainCol] : '';
          const rawB = idSubCol ? row[idSubCol] : '';
          const rawCheck = `${String(rawA || '')} ${String(rawB || '')}`.trim().toUpperCase();

          // If row is an explicit branch header like "PE FROM MH 1 TO MH 5", close current non-connected run
          if (rawCheck.startsWith('PE FROM') || rawCheck.startsWith('BRANCH')) {
            if (curRun.length >= 2) {
              allSections.push(curRun);
            }
            curRun = [];
            pendingPipe = null;
            cumDist = 0.0;
            return;
          }

          const mhID = formatMhTag(rawA, rawB, row);
          if (!mhID) return;

          const lenVal = cleanNum(row[columnMap.length]);
          const sizeVal = cleanNum(row[columnMap.size]);
          let glVal = cleanNum(row[columnMap.gl]);
          let ilVal = cleanNum(row[columnMap.il]);
          const depthColVal = cleanNum(row[columnMap.depth]);
          const bdVal = cleanNum(row[columnMap.backdrop]);
          let matVal = String(row[columnMap.pipeType] || '').trim().toUpperCase();
          if (!matVal || matVal === '-') matVal = 'VCP';

          // Fallback for terminal EXTG / STP rows where only IL or only GL+Depth is entered
          if (isNaN(glVal) && !isNaN(ilVal)) {
            if (!isNaN(depthColVal) && depthColVal > 0) {
              glVal = ilVal + depthColVal;
            } else if (curRun.length > 0 && SE_SPECIAL_TAG_EXTRACT_RE.test(mhID)) {
              glVal = curRun[curRun.length - 1].gl;
            }
          } else if (isNaN(ilVal) && !isNaN(glVal) && !isNaN(depthColVal)) {
            ilVal = glVal - depthColVal;
          }

          // Parse gradient (handles "1:200", "200", or 3-col "1 | : | 200")
          let gradRaw = String(row[columnMap.gradient] || '').trim();
          if (gradRaw === '1' && columnMap.gradient) {
            const gIdx = columns.indexOf(columnMap.gradient);
            if (gIdx !== -1 && gIdx + 2 < columns.length) {
              const colonCell = String(row[columns[gIdx + 1]] || '').trim();
              const denomCell = String(row[columns[gIdx + 2]] || '').trim();
              if (colonCell === ':' && !isNaN(cleanNum(denomCell))) {
                gradRaw = denomCell;
              }
            }
          }
          gradRaw = gradRaw.replace(/^1\s*[:/]\s*/i, '');
          const gradNum = cleanNum(gradRaw);
          const gradStr = !isNaN(gradNum) && gradNum > 0 ? String(Math.round(gradNum)) : '200';
          const sizeStr = !isNaN(sizeVal) && sizeVal > 0 ? String(Math.round(sizeVal)) : '225';

          if (isNaN(glVal) || isNaN(ilVal)) return;

          // Case 1: Same Manhole ID as last node in curRun (Attaches outgoing pipe & checks Backdrop)
          if (curRun.length > 0 && curRun[curRun.length - 1].id === mhID) {
            const lastNode = curRun[curRun.length - 1];
            if (ilVal < lastNode.ilIn - 0.005) {
              lastNode.ilOut = ilVal;
            }
            if (!isNaN(bdVal) && bdVal > 0.005 && Math.abs(lastNode.ilIn - lastNode.ilOut) < 0.005) {
              lastNode.ilIn = lastNode.ilOut + bdVal;
            }
            if (!isNaN(sizeVal) && sizeVal > 0) lastNode.size = sizeStr;
            if (matVal) lastNode.mat = matVal;
            if (!isNaN(gradNum) && gradNum > 0) lastNode.grad = gradStr;

            if (!isNaN(lenVal) && lenVal > 0) {
              lastNode.outLen = lenVal;
              pendingPipe = { len: lenVal, size: sizeStr, mat: matVal, grad: gradStr };
            }
          }
          // Case 2: Downstream Manhole (including EXTG / STP) arriving via pendingPipe
          else if (curRun.length > 0 && pendingPipe) {
            const nextDist = cumDist + pendingPipe.len;

            if (splitMode === 'STRICT' && nextDist > limitM && curRun.length >= 2) {
              allSections.push(curRun);
              const prevLast = curRun[curRun.length - 1];
              curRun = [{
                ...prevLast,
                dist: 0.0,
                ilIn: prevLast.ilOut,
                ilOut: prevLast.ilOut,
              }];
              cumDist = pendingPipe.len;
            } else {
              cumDist = nextDist;
            }

            const ilIn = (!isNaN(bdVal) && bdVal > 0.005) ? (ilVal + bdVal) : ilVal;
            const newNode = {
              id: mhID,
              dist: cumDist,
              gl: glVal,
              ilIn,
              ilOut: ilVal,
              depth: glVal - ilVal,
              bd: (!isNaN(bdVal) && bdVal > 0.005) ? bdVal : 0,
              size: sizeStr,
              mat: matVal,
              grad: gradStr,
              outLen: (!isNaN(lenVal) && lenVal > 0) ? lenVal : null,
            };
            curRun.push(newNode);

            if (!isNaN(lenVal) && lenVal > 0) {
              pendingPipe = { len: lenVal, size: sizeStr, mat: matVal, grad: gradStr };
            } else {
              pendingPipe = null;
            }

            if (splitMode === 'CROSS' && cumDist >= limitM && pendingPipe) {
              allSections.push(curRun);
              curRun = [{
                ...newNode,
                dist: 0.0,
                ilIn: newNode.ilOut,
                ilOut: newNode.ilOut,
                bd: 0,
              }];
              cumDist = 0.0;
            }
          }
          // Case 3: Start of a New Branch
          else {
            if (curRun.length >= 2) {
              allSections.push(curRun);
            }
            cumDist = 0.0;
            const ilIn = (!isNaN(bdVal) && bdVal > 0.005) ? (ilVal + bdVal) : ilVal;
            const firstNode = {
              id: mhID,
              dist: 0.0,
              gl: glVal,
              ilIn,
              ilOut: ilVal,
              depth: glVal - ilVal,
              bd: (!isNaN(bdVal) && bdVal > 0.005) ? bdVal : 0,
              size: sizeStr,
              mat: matVal,
              grad: gradStr,
              outLen: (!isNaN(lenVal) && lenVal > 0) ? lenVal : null,
            };
            curRun = [firstNode];
            if (!isNaN(lenVal) && lenVal > 0) {
              pendingPipe = { len: lenVal, size: sizeStr, mat: matVal, grad: gradStr };
            } else {
              pendingPipe = null;
            }
          }
        });

        if (curRun.length >= 2) {
          allSections.push(curRun);
        }

        return allSections.map((nodes, idx) => {
          const datum = computeSectionDatum(nodes);
          const titleMHs = nodes.map(n => n.id).join(', ');
          const totalLength = nodes[nodes.length - 1].dist;
          return {
            index: idx + 1,
            title: `LONG. SECTION OF ${titleMHs}`,
            datum,
            totalLength,
            nodes,
          };
        });
      }, [rawRows, columnMap, columns, settings]);

      // Filtered rows for CSVUPDATE table view
      const filteredRows = useMemo(() => {
        return processedRows.filter(item => {
          if (filterCategory === 'DRAINAGE' && item.category !== 'DRAINAGE') return false;
          if (filterCategory === 'SEWERAGE' && item.category !== 'SEWERAGE') return false;
          if (filterCategory === 'SHORT' && !item.conditionBadge.includes('Short')) return false;
          if (filterCategory === 'MEDIUM' && !item.conditionBadge.includes('Medium')) return false;
          if (filterCategory === 'LONG' && !item.conditionBadge.includes('Long')) return false;
          if (filterCategory === 'MERGED' && !(item.duplicateCount > 1)) return false;

          if (!searchTerm.trim()) return true;
          const s = searchTerm.toLowerCase();
          return (
            item.id.toLowerCase().includes(s) ||
            item.cadString.toLowerCase().includes(s) ||
            item.conditionBadge.toLowerCase().includes(s)
          );
        });
      }, [processedRows, searchTerm, filterCategory]);

      // Summary Statistics
      const stats = useMemo(() => {
        const total = processedRows.length;
        const drainageCount = processedRows.filter(r => r.category === 'DRAINAGE').length;
        const sewerageCount = processedRows.filter(r => r.category === 'SEWERAGE').length;
        const shortCount = processedRows.filter(r => r.conditionBadge.includes('Short')).length;
        const medCount = processedRows.filter(r => r.conditionBadge.includes('Medium')).length;
        const longCount = processedRows.filter(r => r.conditionBadge.includes('Long') || r.conditionBadge.includes('OFF')).length;
        const mergedCount = processedRows.filter(r => r.duplicateCount > 1).length;
        const totalSecNodes = sewSections.reduce((acc, s) => acc + s.nodes.length, 0);
        return { total, drainageCount, sewerageCount, shortCount, medCount, longCount, mergedCount, totalSecNodes };
      }, [processedRows, sewSections]);

      // ─────────────────────────────────────────────────────────────
      // CSV EXPORT ENGINES (CSVUPDATE & SEWSECTION)
      // ─────────────────────────────────────────────────────────────
      const exportCSV = () => {
        if (processedRows.length === 0) {
          alert('No data to export.');
          return;
        }
        const csvLines = processedRows.map(item => {
          const id = escapeCSV(item.id);
          const category = escapeCSV(item.category);
          let val1, val2, val3;
          if (item.category === 'SEWERAGE') {
            val1 = escapeCSV(item.sewerDetails.gl || '00.00');
            val2 = escapeCSV(item.sewerDetails.il || '00.00');
            val3 = escapeCSV(item.sewerDetails.depth || '00.00');
          } else {
            val1 = escapeCSV(item.drainDetails.size || '600');
            val2 = escapeCSV(item.drainDetails.length || '0');
            val3 = escapeCSV(item.drainDetails.gradient || '1000');
          }
          return `${id},${val1},${val2},${val3},${category}`;
        });

        const csvContent = csvLines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'AutoCAD_Smart_Raw.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('Exported "AutoCAD_Smart_Raw.csv" for CSVUPDATE!');
      };

      const exportMtextCSV = () => {
        if (processedRows.length === 0) {
          alert('No data to export.');
          return;
        }
        const csvLines = processedRows.map(item => {
          const col1 = escapeCSV(item.id);
          const col2 = escapeCSV(item.cadString);
          return `${col1},${col2}`;
        });

        const csvContent = csvLines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'AutoCAD_Smart_Import.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('Exported "AutoCAD_Smart_Import.csv" (2-column MTEXT)!');
      };

      const exportSewSectionCSV = () => {
        if (sewSections.length === 0) {
          alert('No valid Sewerage Longitudinal Section chains found to export.');
          return;
        }

        const header = 'Manhole No.,Length,Pipe Size,Gradient,Pipe Type,Ground Level,Invert Level,Depth of Manhole,Backdrop';
        const lines = [header];

        sewSections.forEach((sec) => {
          sec.nodes.forEach((node, nIdx) => {
            const isLast = nIdx === sec.nodes.length - 1;
            const nextNode = !isLast ? sec.nodes[nIdx + 1] : null;
            const segLen = !isLast ? (nextNode.dist - node.dist) : '';
            const bdDiff = node.ilIn - node.ilOut;
            const bdStr = bdDiff > 0.005 ? bdDiff.toFixed(2) : '';
            const depthVal = (node.gl - node.ilOut).toFixed(2);

            lines.push([
              escapeCSV(node.id),
              escapeCSV(segLen !== '' ? Number(segLen.toFixed(2)) : ''),
              escapeCSV(!isLast ? node.size : ''),
              escapeCSV(!isLast ? node.grad : ''),
              escapeCSV(!isLast ? node.mat : ''),
              escapeCSV(node.gl.toFixed(2)),
              escapeCSV(node.ilOut.toFixed(2)),
              escapeCSV(depthVal),
              escapeCSV(bdStr),
            ].join(','));
          });
        });

        const csvContent = lines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'AutoCAD_SewSection.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast(`Exported "AutoCAD_SewSection.csv" (${sewSections.length} Longitudinal Section(s))!`);
      };

      const copyEntireCSV = () => {
        if (processedRows.length === 0) return;
        const csvContent = processedRows
          .map(item => `${escapeCSV(item.id)},${escapeCSV(item.cadString)}`)

      const currentPreviewSection = sewSections[activeSecIdx] || sewSections[0] || null;

                      v3.1 JRK

                  title={theme === 'dark' ? 'Switch to Light Mode' : 'Switch to Night (Dark) Mode'}
                >
                  {theme === 'dark' ? (
                    <>
                      <svg className="w-4 h-4 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                      </svg>
                      <span className="hidden md:inline">Light Mode</span>
                    </>

                >
                  <svg className="w-4 h-4 text-cadcyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />

                  </p>

            {/* ─────────────────────────────────────────────────────────
                2B. DISCIPLINE / LONG-SECTION SETTINGS BAR
            ───────────────────────────────────────────────────────── */}
            {targetTool === 'CSVUPDATE' ? (
              <div className="bg-cadslate-900 border border-cadslate-800 rounded-xl p-4 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 shadow-lg">

                  <button

                      const plotW = svgW - leftHdrW - 35;
                      const yDatum = 165;
                      const plotTop = 35;
                      const yScale = (yDatum - plotTop - 15) / elevSpan;

                    <label className="block text-slate-300 font-semibold mb-1">Description</label>
                    <textarea
                      rows={6}
                      value={feedbackText}
                      onChange={(e) => setFeedbackText(e.target.value)}
                      placeholder="Describe the Excel file, column, or AutoLISP command issue..."
                      className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg p-2.5 text-white focus:border-amber-500 resize-y"
                    />
                  </div>
                </div>

                <div className="flex items-center justify-end space-x-3 pt-4 border-t border-cadslate-800">
                  <button type="button" onClick={() => setIsFeedbackOpen(false)} className="px-4 py-2 text-xs text-slate-400 hover:text-white">
                    Cancel
                  </button>
                  <button type="button" onClick={sendFeedbackEmail} className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-lg text-xs transition">
                    Send via Email
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ─────────────────────────────────────────────────────────
              CAD LISP INTEGRATION GUIDE MODAL (CSVUPDATE + SEWSECTION)
          ───────────────────────────────────────────────────────── */}
          {isGuideOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-cadslate-900 border border-cadslate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5">
                <div className="flex items-center justify-between border-b border-cadslate-800 pb-3">
                  <div className="flex items-center space-x-2 text-white font-bold text-base">
                    <svg className="w-5 h-5 text-cadcyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
                    </svg>
                    <span>AutoCAD / GstarCAD Workflow (CSVUPDATE & SEWSECTION)</span>
                  </div>
                  <button onClick={() => setIsGuideOpen(false)} className="text-slate-400 hover:text-white p-1 rounded-lg">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
                  <div className="p-3 rounded-lg bg-cadslate-950 border border-cadslate-800">
                    <div className="font-bold text-cadcyan-400 mb-1">Workflow A: Plan View Updates (CSVUPDATE)</div>
                    <p className="text-slate-400">
                      1. Select <strong className="text-white">"1. CSVUPDATE Workflow"</strong> at the top.<br/>
                      2. Drop your Drainage or Sewerage Excel file and click <strong className="text-white">"Export CSVUPDATE Raw .CSV"</strong>.<br/>
                      3. In CAD, run <code className="text-cadcyan-400">CSVUPDATE</code>, select <code className="text-cadcyan-400">AutoCAD_Smart_Raw.csv</code>, and click a sample text on the target layer.
                    </p>
                  </div>
                  <div className="p-3 rounded-lg bg-cadslate-950 border border-cadslate-800">
                    <div className="font-bold text-cadcyan-400 mb-1">Workflow B: Sewerage Longitudinal Sections (SEWSECTION)</div>
                    <p className="text-slate-400">
                      1. Select <strong className="text-white">"2. SEWSECTION Workflow"</strong> at the top.<br/>
                      2. Drop your Sewerage calculation sheet, preview the 200m split sections, and click <strong className="text-white">"Export SEWSECTION .CSV"</strong>.<br/>
                      3. In CAD, run <code className="text-cadcyan-400">SEWSECTION</code> (or <code className="text-cadcyan-400">LONGSEC</code>), choose your scales (<code className="text-white">1:1000</code> Hor, <code className="text-white">1:200 / 1:500 / 1:1000</code> Ver), select <code className="text-cadcyan-400">AutoCAD_SewSection.csv</code>, and click an insertion point!
                    </p>
                  </div>
                </div>

                <div className="text-right pt-2 border-t border-cadslate-800">
                  <button type="button" onClick={() => setIsGuideOpen(false)} className="px-4 py-2 bg-cadcyan-500 hover:bg-cadcyan-400 text-black font-bold rounded-lg text-xs transition">
                    Got it
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="fixed bottom-20 right-6 z-50 bg-cadcyan-500 text-black font-bold text-xs px-4 py-2.5 rounded-xl shadow-2xl flex items-center space-x-2">
              <svg className="w-4 h-4 stroke-[2.5]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />
              </svg>
              <span>{toastMsg}</span>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
