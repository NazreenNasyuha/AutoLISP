  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const STORAGE_KEY = 'autocad_smart_bridge_settings';
    const THEME_KEY = 'autocad_smart_bridge_theme';

    const DEFAULT_SETTINGS = {

    // Realistic Demo Datasets for 1-Click Testing
    const DEMO_DRAINAGE_DATA = [

      { 'Drain Name': '1E', 'U-Drain Width / Ø': '1200', 'Length': 22.5, 'Grade': '500', 'Invert Level (Upstream)': '7.70', 'Invert Level (Downstream)': '7.40' },

    const DEMO_SEWERAGE_DATA = [
      { 'Manhole No.': 'MH1', 'Length': '65', 'Pipe Size': '300', 'Gradient': '294', 'Pipe Type': 'VCP', 'Ground Level': '6.60', 'Invert Level': '4.74', 'Depth of Manhole': '1.86', 'Backdrop': '' },
      { 'Manhole No.': 'MH2', 'Length': '65', 'Pipe Size': '300', 'Gradient': '294', 'Pipe Type': 'VCP', 'Ground Level': '6.75', 'Invert Level': '4.52', 'Depth of Manhole': '2.23', 'Backdrop': '' },
      { 'Manhole No.': 'MH3', 'Length': '65', 'Pipe Size': '300', 'Gradient': '294', 'Pipe Type': 'VCP', 'Ground Level': '6.65', 'Invert Level': '4.30', 'Depth of Manhole': '2.35', 'Backdrop': '' },
      { 'Manhole No.': 'MH4', 'Length': '27', 'Pipe Size': '225', 'Gradient': '204', 'Pipe Type': 'VCP', 'Ground Level': '6.50', 'Invert Level': '4.08', 'Depth of Manhole': '2.42', 'Backdrop': '' },
      { 'Manhole No.': 'MH8', 'Length': '',   'Pipe Size': '',    'Gradient': '',    'Pipe Type': '',    'Ground Level': '6.40', 'Invert Level': '3.62', 'Depth of Manhole': '2.78', 'Backdrop': '0.33' },
      { 'Manhole No.': 'MH21', 'Length': '55', 'Pipe Size': '300', 'Gradient': '294', 'Pipe Type': 'VCP', 'Ground Level': '16.00', 'Invert Level': '14.12', 'Depth of Manhole': '1.88', 'Backdrop': '' },
      { 'Manhole No.': 'MH26', 'Length': '9',  'Pipe Size': '375', 'Gradient': '400', 'Pipe Type': 'VCP', 'Ground Level': '15.80', 'Invert Level': '13.93', 'Depth of Manhole': '1.87', 'Backdrop': '' },
      { 'Manhole No.': 'MH27', 'Length': '39', 'Pipe Size': '375', 'Gradient': '294', 'Pipe Type': 'VCP', 'Ground Level': '15.80', 'Invert Level': '13.91', 'Depth of Manhole': '1.89', 'Backdrop': '' },
      { 'Manhole No.': 'MH28', 'Length': '12', 'Pipe Size': '375', 'Gradient': '400', 'Pipe Type': 'VCP', 'Ground Level': '15.70', 'Invert Level': '13.78', 'Depth of Manhole': '1.92', 'Backdrop': '' },
      { 'Manhole No.': 'MH30', 'Length': '19', 'Pipe Size': '375', 'Gradient': '400', 'Pipe Type': 'VCP', 'Ground Level': '15.70', 'Invert Level': '13.75', 'Depth of Manhole': '1.95', 'Backdrop': '' },
      { 'Manhole No.': 'MH36', 'Length': '',   'Pipe Size': '',    'Gradient': '',    'Pipe Type': '',    'Ground Level': '15.55', 'Invert Level': '13.70', 'Depth of Manhole': '1.85', 'Backdrop': '' },
    ];

    const DEMO_MIXED_DATA = [
      { 'ID': 'D01', 'Size': '600', 'Length': '5.2', 'Gradient': '1000', 'GL': '', 'IL': '7.32', 'Depth': '' },
      { 'ID': 'D02', 'Size': '900', 'Length': '10.5', 'Gradient': '800', 'GL': '', 'IL': '7.15', 'Depth': '' },
      { 'ID': 'D03', 'Size': '1200', 'Length': '24.0', 'Gradient': '500', 'GL': '', 'IL': '6.90', 'Depth': '' },
      { 'ID': 'MH-01', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '42.10', 'IL': '39.80', 'Depth': '2.30' },
      { 'ID': 'MH-02', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '41.80', 'IL': '39.00', 'Depth': '2.80' },
      { 'ID': 'MH-03', 'Size': '', 'Length': '', 'Gradient': '', 'GL': '41.20', 'IL': '38.00', 'Depth': '3.20' },
    ];

    function escapeCSV(val) {
      if (val === null || val === undefined) return '';
      const str = String(val);
      if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
        return `"${str.replace(/"/g, '""')}"`;
      }
      return str;
    }

    function App() {
      // 0. Theme State (Dark Mode is Default)
      const [theme, setTheme] = useState(() => {
        try {
          return localStorage.getItem(THEME_KEY) || 'dark';
        } catch (e) {
          return 'dark';
        }
      });

      useEffect(() => {
        const rootEl = document.documentElement;
        if (theme === 'light') {
          rootEl.classList.remove('dark');
          rootEl.classList.add('light');
        } else {
          rootEl.classList.remove('light');
          rootEl.classList.add('dark');
        }
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (e) {}
      }, [theme]);

      // 1. Target AutoCAD LISP Tool State ('CSVUPDATE' or 'SEWSECTION')
      const [targetTool, setTargetTool] = useState('CSVUPDATE');
      const [activeSecIdx, setActiveSecIdx] = useState(0);

      // 2. Settings state
      const [settings, setSettings] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? { ...DEFAULT_SETTINGS, ...JSON.parse(saved) } : DEFAULT_SETTINGS;
        } catch (e) {
          return DEFAULT_SETTINGS;
        }
      });

      // Modals
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isGuideOpen, setIsGuideOpen] = useState(false);
      const [showManualMapper, setShowManualMapper] = useState(false);
      const [isFeedbackOpen, setIsFeedbackOpen] = useState(false);
      const [feedbackType, setFeedbackType] = useState('Bug Report');
      const [feedbackText, setFeedbackText] = useState('');

      const sendFeedbackEmail = () => {
        const to = 'nazreen@jrksb.com';
        const subject = `[JRK CAD Bridge] ${feedbackType}`;
        window.location.href = `mailto:${to}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(feedbackText)}`;
        setIsFeedbackOpen(false);
      };

      // 3. Excel Parsing States
      const [fileInfo, setFileInfo] = useState(null);
      const [activeSheet, setActiveSheet] = useState('');
      const [workbook, setWorkbook] = useState(null);
      const [rawRows, setRawRows] = useState([]);
      const [columns, setColumns] = useState([]);

      // 4. Smart Column Mapping State (Includes Pipe Type & Backdrop for SEWSECTION)
      const [columnMap, setColumnMap] = useState({
        drainId: '',
        drainIdSub: '',
        size: '',
        length: '',
        gradient: '',
        drainIlUp: '',
        drainIlDown: '',
        sewerId: '',
        sewerIdSub: '',
        gl: '',
        il: '',
        depth: '',
        pipeType: '',
        backdrop: '',
      });

      const [detectedMode, setDetectedMode] = useState('DRAINAGE');
      const [userDesignMode, setUserDesignMode] = useState('AUTO');
      const [detectionReason, setDetectionReason] = useState('Ready for upload');

      const effectiveMode = targetTool === 'SEWSECTION'
        ? 'SEWERAGE'
        : (userDesignMode === 'AUTO' ? detectedMode : userDesignMode);

      // 5. UI search & filter
      const [searchTerm, setSearchTerm] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [toastMsg, setToastMsg] = useState(null);
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (e) {}
      }, [settings]);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3500);
      };

      // ─────────────────────────────────────────────────────────────
      // SMART MULTI-SIGNAL DISCIPLINE CLASSIFIER & COLUMN DETECTOR
      // ─────────────────────────────────────────────────────────────
      const detectColumns = (headerList, sampleRows = [], metaText = '') => {
        const mapping = {
          drainId: '',
          drainIdSub: '',
          size: '',
          length: '',
          gradient: '',
          drainIlUp: '',
          drainIlDown: '',
          sewerId: '',
          sewerIdSub: '',
          gl: '',
          il: '',
          depth: '',
          pipeType: '',
          backdrop: '',
        };

        const drainRules = {
          drainId: [
            /^(drain\s*name\.?|pipe\s*id\.?|drain\s*id\.?|pipe\s*name|line\s*id|drain\s*no\.?|pipe\s*no\.?|line\s*no\.?)$/i,
            /^(id|label|mark|tag)$/i,
          ],
          size: [
            /^(u-?drain\s*width.*|size|dia|diameter|pipe\s*size|drain\s*size|pipe\s*dia|width|span|dia\s*\(mm\)|size\s*\(mm\))$/i,
            /(u-?drain\s*width|dia|diameter|size)/i,
          ],
          length: [
            /^(length|len|pipe\s*len|pipe\s*length|distance|dist|run|length\s*\(m\)|len\s*\(m\))$/i,
            /(length|len)/i,
          ],
          gradient: [
            /^(grade|gradient|grad|1:?|slope|fall|ratio|gradient\s*\(1:s\))$/i,
            /(grade|gradient|grad|slope)/i,
          ],
          drainIlDown: [
            /invert\s*level\s*\(\s*downstream\s*\)/i,
            /(il\s*down|downstream\s*il|invert.*down)/i,
          ],
          drainIlUp: [
            /invert\s*level\s*\(\s*upstream\s*\)/i,
            /(il\s*up|upstream\s*il|invert.*up)/i,
          ],
        };

        const sewerRules = {
          sewerId: [
            /^(manhole\s*no\.?|mh\s*no\.?|mh|manhole|sewer\s*id|mh\s*id|node|node\s*id|chamber|structure\s*id)$/i,
            /(manhole\s*no|mh\s*no|^manhole$)/i,
            /^(id|label|mark)$/i,
          ],
          gl: [
            /^(gl|ground\s*level|ground\s*level\s*\(\s*upstream\s*\)|ground|cover\s*level|cl|surface\s*level|gl\s*\(m\)|top\s*level|rl\s*gl)$/i,
            /(ground\s*level|^gl$|cover\s*level)/i,
          ],
          il: [
            /^(il|invert\s*level|invert|sump\s*il|sewer\s*il|il\s*\(m\)|soffit|rl\s*il)$/i,
            /(invert\s*level|^il$)/i,
          ],
          depth: [
            /^(depth\s*of\s*manhole|depth|mh\s*depth|manhole\s*depth|drop|depth\s*\(m\)|depth\s*\(\s*downstream\s*\))$/i,
            /(depth)/i,
          ],
          pipeType: [
            /^(pipe\s*type|type\s*of\s*pipe|material|pipe\s*material|mat)$/i,
            /(pipe\s*type|material)/i,
          ],
          backdrop: [
            /^(backdrop|b\/d\s*il|b\/d|drop\s*height)$/i,
            /(backdrop|b\/d)/i,
          ],
        };

        Object.entries(drainRules).forEach(([field, patterns]) => {
          for (const pattern of patterns) {
            const found = headerList.find(h => pattern.test(String(h).trim()));
            if (found && !mapping[field]) {
              mapping[field] = found;
              break;
            }
          }
        });

        Object.entries(sewerRules).forEach(([field, patterns]) => {
          for (const pattern of patterns) {
            const found = headerList.find(h => pattern.test(String(h).trim()));
            if (found && !mapping[field]) {
              mapping[field] = found;
              break;
            }
          }
        });

        const genericId = headerList.find(h => /^(id|no\.?|name)$/i.test(String(h).trim()));
        if (genericId) {
          if (!mapping.drainId) mapping.drainId = genericId;
          if (!mapping.sewerId) mapping.sewerId = genericId;
        }

        // Row-Content ID Detector for merged JRK 'Manhole No.' headers
        if (sampleRows.length > 0 && headerList.length >= 2) {
          const c0 = headerList[0];
          const c1 = headerList[1];
          const c0HasMH = sampleRows.slice(0, 20).some(r => /^MH$/i.test(String(r[c0] || '').trim()));
          const c1HasNum = sampleRows.slice(0, 20).some(r => /^\d+(\.\d+)?$/.test(String(r[c1] || '').trim()));
          if (c0HasMH && c1HasNum) {
            mapping.sewerId = c0;
            mapping.sewerIdSub = c1;
          }
        }

        if (!mapping.drainId && !mapping.sewerId && headerList.length > 0) {
          const firstCol = headerList[0];
          if (firstCol && /empty/i.test(firstCol)) {
            mapping.drainId = firstCol;
            mapping.sewerId = firstCol;
          }
        }

        if (!mapping.drainId && mapping.sewerId) mapping.drainId = mapping.sewerId;
        if (!mapping.sewerId && mapping.drainId) mapping.sewerId = mapping.drainId;

        if (mapping.sewerId && !mapping.sewerIdSub && sampleRows.length > 0) {
          const sIdx = headerList.indexOf(mapping.sewerId);
          if (sIdx !== -1 && sIdx + 1 < headerList.length) {
            const nextCol = headerList[sIdx + 1];
            const hasMhPrefix = sampleRows.slice(0, 20).some(
              r => /^MH$/i.test(String(r[mapping.sewerId] || '').trim()) && /^\d+(\.\d+)?$/.test(String(r[nextCol] || '').trim())
            );
            if (hasMhPrefix) {
              mapping.sewerIdSub = nextCol;
            }
          }
        }

        if (mapping.drainId && !mapping.drainIdSub && sampleRows.length > 0) {
          const dIdx = headerList.indexOf(mapping.drainId);
          if (dIdx !== -1 && dIdx + 1 < headerList.length) {
            const nextCol = headerList[dIdx + 1];
            const hasSubLetter = sampleRows.slice(0, 20).some(
              r => /^\d+$/.test(String(r[mapping.drainId] || '').trim()) && /^[A-Z]$/i.test(String(r[nextCol] || '').trim())
            );
            if (hasSubLetter) {
              mapping.drainIdSub = nextCol;
            }
          }
        }

        // Multi-Signal Scoring (Sewerage vs Drainage)
        let sewScore = 0;
        let drnScore = 0;
        const reasons = [];
        const allContext = `${metaText} ${headerList.join(' ')}`.toLowerCase();

        if (/(sewer|sewage|iwk|manhole\s*no|manhole\s*details|sewer\s*pipe|population\s*\(pe\)|accumulative\s*pe|peak\s*factor|backdrop)/i.test(allContext)) {
          sewScore += 8;
          reasons.push('Sewerage/PE/Manhole headers');
        }
        if (/(storm\s*drainage|masma|msma|catchment|coefficient\s*of\s*runoff|overland\s*time|time\s*of\s*concentration|rainfall\s*intensity|u-?drain|drain\s*name|receiveflow)/i.test(allContext)) {
          drnScore += 8;
          reasons.push('MSMA/Catchment/Drainage headers');
        }

        if (headerList.some(h => /^manhole/i.test(String(h).trim()))) sewScore += 5;
        if (headerList.some(h => /^drain\s*name|pipe\s*id|u-?drain/i.test(String(h).trim()))) drnScore += 5;

        let mhRowCount = 0;
        let drainRowCount = 0;
        sampleRows.slice(0, 20).forEach(r => {
          const sId = String(r[mapping.sewerId] || '').trim();
          const dId = String(r[mapping.drainId] || '').trim();
          if (/^MH/i.test(sId)) mhRowCount++;
          if (/^(\d+[A-Z]|[A-Z]\d+|D\d+|P\d+|CROSSING)/i.test(dId)) drainRowCount++;
        });
        if (mhRowCount > 0) {
          sewScore += 6;
          reasons.push('MH IDs in rows');
        }
        if (drainRowCount > 0) {
          drnScore += 6;
          reasons.push('Drain IDs in rows');
        }

        const hasDrainCols = Boolean(mapping.size || mapping.length || mapping.gradient);
        const hasSewerCols = Boolean(mapping.gl || mapping.il || mapping.depth);

        let mode = 'DRAINAGE';
        if (sewScore > drnScore) {
          mode = 'SEWERAGE';
        } else if (drnScore > sewScore) {
          mode = 'DRAINAGE';
        } else if (hasDrainCols && hasSewerCols) {
          mode = 'HYBRID';
        } else if (hasSewerCols) {
          mode = 'SEWERAGE';
        }

        setDetectedMode(mode);
        setDetectionReason(reasons.length > 0 ? reasons.join(' • ') : `Auto-detected ${mode}`);
        setColumnMap(mapping);
      };

      // ─────────────────────────────────────────────────────────────
      // EXCEL FILE PARSING VIA SHEETJS
      // ─────────────────────────────────────────────────────────────
      const isEngineeringHeaderRow = (rowText) => {
        return (
          rowText.includes('manhole no') ||
          rowText.includes('pipe size') ||
          rowText.includes('drain id') ||
          rowText.includes('drain name') ||
          rowText.includes('diameter') ||
          rowText.includes('u-drain') ||
          (rowText.includes('length') && (rowText.includes('grade') || rowText.includes('gradient') || rowText.includes('invert'))) ||
          rowText.includes('invert level')
        );
      };

      const handleFile = (file) => {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, { type: 'array' });

            let bestSheet = wb.SheetNames[0];
            for (const sn of wb.SheetNames) {
              if (/^(dni|copypaste|cover|instruction)/i.test(sn.trim())) continue;
              const ws = wb.Sheets[sn];
              const previewArr = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }).slice(0, 25);
              const foundHeader = previewArr.some(r => isEngineeringHeaderRow(r.join(' ').toLowerCase()));
              if (foundHeader) {
                bestSheet = sn;
                break;
              }
            }

            setWorkbook(wb);
            setFileInfo({
              name: file.name,
              size: (file.size / 1024).toFixed(1) + ' KB',
              sheetNames: wb.SheetNames,
            });

            setActiveSheet(bestSheet);
            setActiveSecIdx(0);
            setUserDesignMode('AUTO');
            parseSheet(wb, bestSheet, file.name);
            showToast(`Loaded "${file.name}" (${bestSheet})!`);
          } catch (err) {
            console.error('Error parsing Excel file:', err);
            alert('Failed to parse Excel file. Please ensure it is a valid .xls, .xlsx, or .xlsm file.');
          }
        };
        reader.readAsArrayBuffer(file);
      };

      const parseSheet = (wb, sheetName, fileNameOverride = '') => {
        const ws = wb.Sheets[sheetName];
        if (!ws) return;

        const rawArray = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

        let headerRowIndex = 0;
        for (let i = 0; i < Math.min(rawArray.length, 35); i++) {
          const rowText = rawArray[i].join(' ').toLowerCase();
          if (isEngineeringHeaderRow(rowText)) {
            headerRowIndex = i;
            break;
          }
        }

        const topBannerText = [
          fileNameOverride || (fileInfo ? fileInfo.name : ''),
          sheetName,
          ...rawArray.slice(0, headerRowIndex + 1).map(r => r.join(' '))
        ].join(' ');

        const jsonData = XLSX.utils.sheet_to_json(ws, {
          defval: '',
          raw: false,
          range: headerRowIndex,
        });

        if (jsonData.length === 0) {
          showToast(`Warning: Sheet "${sheetName}" is empty.`);
          setRawRows([]);
          setColumns([]);
          return;
        }

        const headers = Object.keys(jsonData[0]);
        setColumns(headers);
        setRawRows(jsonData);
        detectColumns(headers, jsonData, topBannerText);
      };

      // ─────────────────────────────────────────────────────────────
      // LOAD DEMO DATASETS
      // ─────────────────────────────────────────────────────────────
      const loadDemo = (type) => {
        let data, name, headers;
        if (type === 'drainage') {
          data = DEMO_DRAINAGE_DATA;
          name = 'MSMA_Road_Drainage_Schedule.xlsx';
          headers = Object.keys(DEMO_DRAINAGE_DATA[0]);
        } else if (type === 'sewerage' || type === 'sewsection') {
          data = DEMO_SEWERAGE_DATA;
          name = 'JRK_Sewerage_LongSection_Calculation.xlsx';
          headers = Object.keys(DEMO_SEWERAGE_DATA[0]);
          if (type === 'sewsection') {
            setTargetTool('SEWSECTION');
          }
        } else {
          data = DEMO_MIXED_DATA;
          name = 'Infrastructure_Combined_Schedule.xlsx';
          headers = Object.keys(DEMO_MIXED_DATA[0]);
        }

        setActiveSecIdx(0);
        setUserDesignMode('AUTO');
        setColumns(headers);
        setRawRows(data);
        setFileInfo({
          name: `${name} (Sample)`,
          size: '14.8 KB',
          sheetNames: ['Schedule'],
        });
        setActiveSheet('Schedule');
        detectColumns(headers, data, name);
        showToast(`Loaded sample ${type} schedule!`);
      };

      const downloadTemplate = () => {
        const wb = XLSX.utils.book_new();
        const wsDrain = XLSX.utils.json_to_sheet(DEMO_DRAINAGE_DATA);
        const wsSewer = XLSX.utils.json_to_sheet(DEMO_SEWERAGE_DATA);
        XLSX.utils.book_append_sheet(wb, wsDrain, 'Drainage_Pipes');
        XLSX.utils.book_append_sheet(wb, wsSewer, 'Sewer_LongSection');
        XLSX.writeFile(wb, 'JRK_AutoCAD_Smart_Schedule_Template.xlsx');
        showToast('Downloaded: JRK_AutoCAD_Smart_Schedule_Template.xlsx');
      };

      // ─────────────────────────────────────────────────────────────
      // 1. CSVUPDATE ENGINE (Plan View MTEXT & Lowest IL Deduplication)
      // ─────────────────────────────────────────────────────────────
      const buildDrainageCadString = (id, size, length, gradient) => {
        const widthVal = parseFloat(settings.textWidthFactor) || 0.5;
        const widthPrefix = `{\\W${widthVal};`;
        const sizeDisplay = size || '600';
        const gradDisplay = gradient || '1000';

        const lenNum = parseFloat(length);
        const hasValidLen = !isNaN(lenNum) && lenNum >= 0;
        const lenDisplay = hasValidLen
          ? (Number.isInteger(lenNum) ? lenNum.toString() : lenNum.toFixed(1))
          : '0';

        const isShort = hasValidLen && lenNum <= settings.shortPipeThreshold;
        const isMedium = hasValidLen && lenNum > settings.shortPipeThreshold && lenNum <= settings.mediumPipeThreshold;

        let cadString = '';
        let conditionBadge = '';

        if (settings.smartLengthFormatting && isShort) {
          cadString = `${widthPrefix}${id};\\P${sizeDisplay}%%c\\P${lenDisplay}m\\P1:${gradDisplay}}`;
          conditionBadge = `Short Pipe (<= ${settings.shortPipeThreshold}m, 4-Line)`;
        } else if (settings.smartLengthFormatting && isMedium) {
          cadString = `${widthPrefix}${id}; ${sizeDisplay}%%c\\P${lenDisplay}m 1:${gradDisplay}}`;
          conditionBadge = `Medium Pipe (<= ${settings.mediumPipeThreshold}m, 2-Line)`;
        } else {
          cadString = `${widthPrefix}${id}; ${sizeDisplay}%%c ${lenDisplay}m 1:${gradDisplay}}`;
          conditionBadge = settings.smartLengthFormatting
            ? `Long Pipe (> ${settings.mediumPipeThreshold}m, 1-Line)`
            : 'Smart Formatting OFF (1-Line)';
        }

        return { cadString, conditionBadge, sizeDisplay, lenDisplay, gradDisplay };
      };

      const buildSewerageCadString = (id, gl, il, depth) => {
        const widthVal = parseFloat(settings.textWidthFactor) || 0.5;
        const widthPrefix = `{\\W${widthVal};`;
        const numGL = parseFloat(gl);
        const numIL = parseFloat(il);
        let numDepth = parseFloat(depth);

        if (!isNaN(numGL) && !isNaN(numIL)) {
          numDepth = numGL - numIL;
        }

        const glDisplay = !isNaN(numGL) ? numGL.toFixed(2) : (gl || '00.00');
        const ilDisplay = !isNaN(numIL) ? numIL.toFixed(2) : (il || '00.00');
        const depthDisplay = !isNaN(numDepth) ? numDepth.toFixed(2) : (depth || '00.00');

        const cadString = `${widthPrefix}${id};\\PGL: ${glDisplay}m\\PIL: ${ilDisplay}m\\PDEPTH: ${depthDisplay}m}`;
        return { cadString, glDisplay, ilDisplay, depthDisplay };
      };

      const formatRow = (row) => {
        let sewerIdRaw = String(row[columnMap.sewerId] || '').trim();
        if (columnMap.sewerIdSub) {
          const subVal = String(row[columnMap.sewerIdSub] || '').trim();
          if (/^MH$/i.test(sewerIdRaw) && subVal) {
            sewerIdRaw = `MH-${subVal.replace(/\.0+$/, '')}`;
          } else if (!sewerIdRaw && subVal) {
            sewerIdRaw = subVal.replace(/\.0+$/, '');
          }
        }

        let drainIdRaw = String(row[columnMap.drainId] || '').trim();
        if (columnMap.drainIdSub) {
          const subLetter = String(row[columnMap.drainIdSub] || '').trim();
          if (/^\d+$/.test(drainIdRaw) && /^[A-Z]$/i.test(subLetter)) {
            drainIdRaw = `${drainIdRaw}${subLetter.toUpperCase()}`;
          }
        }

        let glRaw = String(row[columnMap.gl] || '').trim();
        let ilRaw = String(row[columnMap.il] || '').trim();
        let depthRaw = String(row[columnMap.depth] || '').trim();
        let sizeRaw = String(row[columnMap.size] || '').trim();
        let lengthRaw = String(row[columnMap.length] || '').trim();
        let gradRaw = String(row[columnMap.gradient] || '').trim();

        if (gradRaw === '1' && columnMap.gradient) {
          const gIdx = columns.indexOf(columnMap.gradient);
          if (gIdx !== -1 && gIdx + 2 < columns.length) {
            const colonCell = String(row[columns[gIdx + 1]] || '').trim();
            const denomCell = String(row[columns[gIdx + 2]] || '').trim();
            if (colonCell === ':' && /^\d+(\.\d+)?$/.test(denomCell)) {
              gradRaw = denomCell;
            }
          }
        }

        let ilUpRaw = String(row[columnMap.drainIlUp] || '').trim();
        let ilDownRaw = String(row[columnMap.drainIlDown] || '').trim();

        const cleanNumber = (val) => {
          if (!val) return '';
          if (val.includes('#DIV/0!') || val.includes('#REF!') || val.includes('#VALUE!')) return '?';
          return val.replace(/[^0-9.-]/g, '');
        };

        sizeRaw = cleanNumber(sizeRaw);
        lengthRaw = cleanNumber(lengthRaw);
        glRaw = cleanNumber(glRaw);
        ilRaw = cleanNumber(ilRaw);
        depthRaw = cleanNumber(depthRaw);
        ilUpRaw = cleanNumber(ilUpRaw);
        ilDownRaw = cleanNumber(ilDownRaw);

        if (settings.cleanGradientPrefix) {
          gradRaw = gradRaw.replace(/^1\s*[:/]\s*/i, '');
        }
        gradRaw = cleanNumber(gradRaw);

        const rawIdCheck = (sewerIdRaw || drainIdRaw).toUpperCase();
        if (!rawIdCheck || rawIdCheck === 'D' || rawIdCheck === 'ID' || rawIdCheck === 'MANHOLE' || rawIdCheck.startsWith('PE FROM')) {
          return null;
        }

        const hasSewerData = Boolean((glRaw && glRaw !== '?') || (ilRaw && ilRaw !== '?') || (depthRaw && depthRaw !== '?'));
        const hasDrainData = Boolean((sizeRaw && sizeRaw !== '?') || (lengthRaw && lengthRaw !== '?') || (gradRaw && gradRaw !== '?'));

        if (!hasSewerData && !hasDrainData) return null;

        let isSewerRow = false;
        if (effectiveMode === 'SEWERAGE') {
          if (!hasSewerData) return null;
          isSewerRow = true;
        } else if (effectiveMode === 'DRAINAGE') {
          if (!hasDrainData) return null;
          isSewerRow = false;
        } else {
          isSewerRow = hasSewerData && (!hasDrainData || /^MH/i.test(sewerIdRaw));
        }

        let effectiveId = isSewerRow ? (sewerIdRaw || drainIdRaw) : (drainIdRaw || sewerIdRaw);

        if (isSewerRow) {
          if (/^\d+(\.0+)?$/.test(effectiveId)) {
            const cleanInt = effectiveId.replace(/\.0+$/, '');
            effectiveId = `MH-${cleanInt.padStart(2, '0')}`;
          } else if (/^MH\s*-?\s*\d+(\.0+)?$/i.test(effectiveId)) {
            let num = effectiveId.replace(/\.0+$/, '').replace(/[^0-9]/g, '');
            effectiveId = `MH-${num.padStart(2, '0')}`;
          }
        } else {
          if (/^[a-zA-Z]\d+$/.test(effectiveId)) {
            let letter = effectiveId.charAt(0);
            let num = effectiveId.substring(1);
            if (num.length === 1) effectiveId = `${letter}0${num}`;
          }
        }

        if (!effectiveId || effectiveId === '?') return null;

        const candidateILs = [ilRaw, ilDownRaw, ilUpRaw]
          .map(v => parseFloat(v))
          .filter(n => !isNaN(n));
        const effectiveIL = candidateILs.length > 0 ? Math.min(...candidateILs) : NaN;

        if (isSewerRow) {
          const sewBuilt = buildSewerageCadString(
            effectiveId,
            glRaw,
            !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : ilRaw,
            depthRaw
          );
          const visualLines = sewBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').replace(/%%c/g, 'Ø').split('\\P');
          return {
            id: effectiveId,
            category: 'SEWERAGE',
            cadString: sewBuilt.cadString,
            conditionBadge: 'Manhole (4-Line Label)',
            visualLines,
            effectiveIL,
            drainDetails: { size: sizeRaw, length: lengthRaw, gradient: gradRaw, il: !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : '' },
            sewerDetails: { gl: sewBuilt.glDisplay, il: sewBuilt.ilDisplay, depth: sewBuilt.depthDisplay },
            rawRow: row,
          };
        } else {
          const drnBuilt = buildDrainageCadString(effectiveId, sizeRaw, lengthRaw, gradRaw);
          const visualLines = drnBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').replace(/%%c/g, 'Ø').split('\\P');
          return {
            id: effectiveId,
            category: 'DRAINAGE',
            cadString: drnBuilt.cadString,
            conditionBadge: drnBuilt.conditionBadge,
            visualLines,
            effectiveIL,
            drainDetails: {
              size: drnBuilt.sizeDisplay,
              length: drnBuilt.lenDisplay,
              gradient: drnBuilt.gradDisplay,
              il: !isNaN(effectiveIL) ? effectiveIL.toFixed(2) : '',
            },
            sewerDetails: { gl: glRaw, il: ilRaw, depth: depthRaw },
            rawRow: row,
          };
        }
      };

      const processedRows = useMemo(() => {
        const rawFormatted = rawRows.map((r, i) => formatRow(r, i)).filter(Boolean);
        const uniqueMap = new Map();

        rawFormatted.forEach(item => {
          const cleanId = item.id.toUpperCase();

          if (!uniqueMap.has(cleanId)) {
            uniqueMap.set(cleanId, { ...item, duplicateCount: 1 });
          } else {
            const existing = uniqueMap.get(cleanId);
            const dupCount = (existing.duplicateCount || 1) + 1;
            const existingIL = existing.effectiveIL;
            const newIL = item.effectiveIL;

            const newIsLower = (!isNaN(newIL) && (isNaN(existingIL) || newIL < existingIL));

            if (item.category === 'SEWERAGE') {
              if (newIsLower) {
                const gl = parseFloat(item.sewerDetails.gl) || parseFloat(existing.sewerDetails.gl) || 0;
                const sewBuilt = buildSewerageCadString(item.id, gl.toFixed(2), newIL.toFixed(2), '');
                const updatedItem = {
                  ...item,
                  duplicateCount: dupCount,
                  effectiveIL: newIL,
                  cadString: sewBuilt.cadString,
                  sewerDetails: { gl: sewBuilt.glDisplay, il: sewBuilt.ilDisplay, depth: sewBuilt.depthDisplay },
                  conditionBadge: `Merged ${dupCount} Rows (Lowest IL: ${newIL.toFixed(2)}m)`,
                  visualLines: sewBuilt.cadString.replace(/^\{\\W[\d.]+;/, '').replace(/\}$/, '').split('\\P'),
                };
                uniqueMap.set(cleanId, updatedItem);
              } else {
                const bestILText = !isNaN(existingIL) ? `${existingIL.toFixed(2)}m` : 'Kept';
                existing.duplicateCount = dupCount;
                existing.conditionBadge = `Merged ${dupCount} Rows (Lowest IL: ${bestILText})`;
              }
            } else {
              if (newIsLower) {
                const updatedItem = {
                  ...item,
                  duplicateCount: dupCount,
                  effectiveIL: newIL,
                  conditionBadge: `${item.conditionBadge} • Lowest IL (${newIL.toFixed(2)}m of ${dupCount})`,
                };
                uniqueMap.set(cleanId, updatedItem);
              } else {
                const bestILText = !isNaN(existingIL) ? `${existingIL.toFixed(2)}m` : 'Kept';
                existing.duplicateCount = dupCount;
                if (!existing.conditionBadge.includes('Lowest IL')) {
                  existing.conditionBadge = `${existing.conditionBadge} • Lowest IL (${bestILText} of ${dupCount})`;
                }
              }
            }
          }
        });

        return Array.from(uniqueMap.values());
      }, [rawRows, columnMap, settings, effectiveMode]);

      // ─────────────────────────────────────────────────────────────
      // 2. SEWSECTION ENGINE (Longitudinal Section Profile Chains & 200m Splitter)
      // ─────────────────────────────────────────────────────────────
      const computeSectionDatum = (nodes) => {
        if (!settings.secAutoDatum) {
          return parseFloat(settings.secManualDatum) || 0;
        }
        const minIL = Math.min(...nodes.map(n => n.ilOut));
        const baseU10 = parseFloat(settings.secBaseDatumUnder10) || 0;
        let dVal = minIL >= 10.0
          ? Math.floor(minIL / 10.0) * 10.0 + baseU10
          : baseU10;
        if (dVal > minIL - 1.0) {
          dVal = Math.max(0, Math.floor(minIL - 2.0));
        }
        return dVal;
      };

      const sewSections = useMemo(() => {
        const limitM = parseFloat(settings.secMaxDist) || 200;
        const splitMode = settings.secSplitMode || 'CROSS';
        const allSections = [];
        let curRun = [];
        let pendingPipe = null;
        let cumDist = 0.0;

        const cleanNum = (val) => {
          if (val === null || val === undefined) return NaN;
          const s = String(val).trim();
          if (!s || s === '-' || /#DIV|#REF|#VALUE|#N\/A/i.test(s)) return NaN;
          const cleaned = s.replace(/[^0-9.-]/g, '');
          return cleaned ? parseFloat(cleaned) : NaN;
        };

        const formatMhTag = (rawPrefix, rawSub) => {
          const p = String(rawPrefix || '').trim().toUpperCase();
          const sub = String(rawSub || '').trim();
          if (p === 'MH' && sub && !isNaN(cleanNum(sub))) {
            return `MH${Math.round(cleanNum(sub))}`;
          }
          if (/^MH/i.test(p)) {
            const rest = p.replace(/^MH\s*[-_]?\s*/i, '');
            if (!isNaN(cleanNum(rest))) return `MH${Math.round(cleanNum(rest))}`;
            return `MH${rest}`;
          }
          if (p && !isNaN(cleanNum(p))) {
            return `MH${Math.round(cleanNum(p))}`;
          }
          return '';
        };

        rawRows.forEach((row) => {
          const rowValuesStr = Object.values(row).join(' ').toUpperCase();
          // If row is an explicit branch header like "PE FROM MH 1 TO MH 5", close current non-connected run if needed
          const rawA = row[columnMap.sewerId || columnMap.drainId];
          const rawB = columnMap.sewerIdSub ? row[columnMap.sewerIdSub] : '';
          const mhID = formatMhTag(rawA, rawB);

          const lenVal = cleanNum(row[columnMap.length]);
          const sizeVal = cleanNum(row[columnMap.size]);
          const glVal = cleanNum(row[columnMap.gl]);
          const ilVal = cleanNum(row[columnMap.il]);
          const bdVal = cleanNum(row[columnMap.backdrop]);
          let matVal = String(row[columnMap.pipeType] || '').trim().toUpperCase();
          if (!matVal || matVal === '-') matVal = 'VCP';

          // Parse gradient (handles "1:200", "200", or 3-col "1 | : | 200")
          let gradRaw = String(row[columnMap.gradient] || '').trim();
          if (gradRaw === '1' && columnMap.gradient) {
            const gIdx = columns.indexOf(columnMap.gradient);
            if (gIdx !== -1 && gIdx + 2 < columns.length) {
              const colonCell = String(row[columns[gIdx + 1]] || '').trim();
              const denomCell = String(row[columns[gIdx + 2]] || '').trim();
              if (colonCell === ':' && !isNaN(cleanNum(denomCell))) {
                gradRaw = denomCell;
              }
            }
          }
          gradRaw = gradRaw.replace(/^1\s*[:/]\s*/i, '');
          const gradNum = cleanNum(gradRaw);
          const gradStr = !isNaN(gradNum) && gradNum > 0 ? String(Math.round(gradNum)) : '200';
          const sizeStr = !isNaN(sizeVal) && sizeVal > 0 ? String(Math.round(sizeVal)) : '225';

          if (!mhID || isNaN(glVal) || isNaN(ilVal)) return;

          // Case 1: Same Manhole ID as last node in curRun (Attaches outgoing pipe & checks Backdrop)
          if (curRun.length > 0 && curRun[curRun.length - 1].id === mhID) {
            const lastNode = curRun[curRun.length - 1];
            if (ilVal < lastNode.ilIn - 0.005) {
              lastNode.ilOut = ilVal;
            }
            if (!isNaN(bdVal) && bdVal > 0.005 && Math.abs(lastNode.ilIn - lastNode.ilOut) < 0.005) {
              lastNode.ilIn = lastNode.ilOut + bdVal;
            }
            if (!isNaN(sizeVal) && sizeVal > 0) lastNode.size = sizeStr;
            if (matVal) lastNode.mat = matVal;
            if (!isNaN(gradNum) && gradNum > 0) lastNode.grad = gradStr;

            if (!isNaN(lenVal) && lenVal > 0) {
              lastNode.outLen = lenVal;
              pendingPipe = { len: lenVal, size: sizeStr, mat: matVal, grad: gradStr };
            }
          }
          // Case 2: Downstream Manhole arriving via pendingPipe
          else if (curRun.length > 0 && pendingPipe) {
            const nextDist = cumDist + pendingPipe.len;

            if (splitMode === 'STRICT' && nextDist > limitM && curRun.length >= 2) {
              allSections.push(curRun);
              const prevLast = curRun[curRun.length - 1];
              curRun = [{
                ...prevLast,
                dist: 0.0,
                ilIn: prevLast.ilOut,
                ilOut: prevLast.ilOut,
              }];
              cumDist = pendingPipe.len;
            } else {
              cumDist = nextDist;
            }

            const ilIn = (!isNaN(bdVal) && bdVal > 0.005) ? (ilVal + bdVal) : ilVal;
            const newNode = {
              id: mhID,
              dist: cumDist,
              gl: glVal,
              ilIn,
              ilOut: ilVal,
              depth: glVal - ilVal,
              bd: (!isNaN(bdVal) && bdVal > 0.005) ? bdVal : 0,
              size: sizeStr,
              mat: matVal,
              grad: gradStr,
              outLen: (!isNaN(lenVal) && lenVal > 0) ? lenVal : null,
            };
            curRun.push(newNode);

            if (!isNaN(lenVal) && lenVal > 0) {
              pendingPipe = { len: lenVal, size: sizeStr, mat: matVal, grad: gradStr };
            } else {
              pendingPipe = null;
            }

            if (splitMode === 'CROSS' && cumDist >= limitM && pendingPipe) {
              allSections.push(curRun);
              curRun = [{
                ...newNode,
                dist: 0.0,
                ilIn: newNode.ilOut,
                ilOut: newNode.ilOut,
                bd: 0,
              }];
              cumDist = 0.0;
            }
          }
          // Case 3: Start of a New Branch
          else {
            if (curRun.length >= 2) {
              allSections.push(curRun);
            }
            cumDist = 0.0;
            const ilIn = (!isNaN(bdVal) && bdVal > 0.005) ? (ilVal + bdVal) : ilVal;
            const firstNode = {
              id: mhID,
              dist: 0.0,
              gl: glVal,
              ilIn,
              ilOut: ilVal,
              depth: glVal - ilVal,
              bd: (!isNaN(bdVal) && bdVal > 0.005) ? bdVal : 0,
              size: sizeStr,
              mat: matVal,
              grad: gradStr,
              outLen: (!isNaN(lenVal) && lenVal > 0) ? lenVal : null,
            };
            curRun = [firstNode];
            if (!isNaN(lenVal) && lenVal > 0) {
              pendingPipe = { len: lenVal, size: sizeStr, mat: matVal, grad: gradStr };
            } else {
              pendingPipe = null;
            }
          }
        });

        if (curRun.length >= 2) {
          allSections.push(curRun);
        }

        return allSections.map((nodes, idx) => {
          const datum = computeSectionDatum(nodes);
          const titleMHs = nodes.map(n => n.id).join(', ');
          const totalLength = nodes[nodes.length - 1].dist;
          return {
            index: idx + 1,
            title: `LONG. SECTION OF ${titleMHs}`,
            datum,
            totalLength,
            nodes,
          };
        });
      }, [rawRows, columnMap, columns, settings]);

      // Filtered rows for CSVUPDATE table view
      const filteredRows = useMemo(() => {
        return processedRows.filter(item => {
          if (filterCategory === 'DRAINAGE' && item.category !== 'DRAINAGE') return false;
          if (filterCategory === 'SEWERAGE' && item.category !== 'SEWERAGE') return false;
          if (filterCategory === 'SHORT' && !item.conditionBadge.includes('Short')) return false;
          if (filterCategory === 'MEDIUM' && !item.conditionBadge.includes('Medium')) return false;
          if (filterCategory === 'LONG' && !item.conditionBadge.includes('Long')) return false;
          if (filterCategory === 'MERGED' && !(item.duplicateCount > 1)) return false;

          if (!searchTerm.trim()) return true;
          const s = searchTerm.toLowerCase();
          return (
            item.id.toLowerCase().includes(s) ||
            item.cadString.toLowerCase().includes(s) ||
            item.conditionBadge.toLowerCase().includes(s)
          );
        });
      }, [processedRows, searchTerm, filterCategory]);

      // Summary Statistics
      const stats = useMemo(() => {
        const total = processedRows.length;
        const drainageCount = processedRows.filter(r => r.category === 'DRAINAGE').length;
        const sewerageCount = processedRows.filter(r => r.category === 'SEWERAGE').length;
        const shortCount = processedRows.filter(r => r.conditionBadge.includes('Short')).length;
        const medCount = processedRows.filter(r => r.conditionBadge.includes('Medium')).length;
        const longCount = processedRows.filter(r => r.conditionBadge.includes('Long') || r.conditionBadge.includes('OFF')).length;
        const mergedCount = processedRows.filter(r => r.duplicateCount > 1).length;
        const totalSecNodes = sewSections.reduce((acc, s) => acc + s.nodes.length, 0);
        return { total, drainageCount, sewerageCount, shortCount, medCount, longCount, mergedCount, totalSecNodes };
      }, [processedRows, sewSections]);

      // ─────────────────────────────────────────────────────────────
      // CSV EXPORT ENGINES (CSVUPDATE & SEWSECTION)

      const exportCSV = () => {
        if (processedRows.length === 0) {
          alert('No data to export.');
          return;

        const csvLines = processedRows.map(item => {
          const id = escapeCSV(item.id);
          const category = escapeCSV(item.category);
          let val1, val2, val3;
          if (item.category === 'SEWERAGE') {
            val1 = escapeCSV(item.sewerDetails.gl || '00.00');
            val2 = escapeCSV(item.sewerDetails.il || '00.00');
            val3 = escapeCSV(item.sewerDetails.depth || '00.00');
          } else {
            val1 = escapeCSV(item.drainDetails.size || '600');
            val2 = escapeCSV(item.drainDetails.length || '0');
            val3 = escapeCSV(item.drainDetails.gradient || '1000');
          }
          return `${id},${val1},${val2},${val3},${category}`;
        });

        const csvContent = csvLines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'AutoCAD_Smart_Raw.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showToast('Exported "AutoCAD_Smart_Raw.csv" for CSVUPDATE!');
      };

      const exportMtextCSV = () => {
        if (processedRows.length === 0) {
          alert('No data to export.');
          return;
        }
        const csvLines = processedRows.map(item => {
          const col1 = escapeCSV(item.id);
          const col2 = escapeCSV(item.cadString);
          return `${col1},${col2}`;
        });

        const csvContent = csvLines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

      // Dedicated Exporter for SEWSECTION (sewsection.lsp)
      const exportSewSectionCSV = () => {
        if (sewSections.length === 0) {
          alert('No valid Sewerage Longitudinal Section chains found to export.');
          return;
        }

        const header = 'Manhole No.,Length,Pipe Size,Gradient,Pipe Type,Ground Level,Invert Level,Depth of Manhole,Backdrop';
        const lines = [header];

        sewSections.forEach((sec) => {
          sec.nodes.forEach((node, nIdx) => {

            const nextNode = !isLast ? sec.nodes[nIdx + 1] : null;
            const segLen = !isLast ? (nextNode.dist - node.dist) : '';
            const bdDiff = node.ilIn - node.ilOut;
            const bdStr = bdDiff > 0.005 ? bdDiff.toFixed(2) : '';
            const depthVal = (node.gl - node.ilOut).toFixed(2);

            lines.push([
              escapeCSV(node.id),
              escapeCSV(segLen !== '' ? Number(segLen.toFixed(2)) : ''),
              escapeCSV(!isLast ? node.size : ''),
              escapeCSV(!isLast ? node.grad : ''),
              escapeCSV(!isLast ? node.mat : ''),
              escapeCSV(node.gl.toFixed(2)),
              escapeCSV(node.ilOut.toFixed(2)),
              escapeCSV(depthVal),
              escapeCSV(bdStr),
            ].join(','));
          });
        });

        const csvContent = lines.join('\r\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');

                          Click any section tab below to inspect its CAD profile preview, Auto Datum, and manhole chainage table.
                        </p>
                      </div>

                      <div className="flex flex-wrap gap-1.5">
                        {sewSections.map((sec, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => setActiveSecIdx(idx)}
                            className={`px-3 py-1.5 rounded-lg text-xs font-mono font-bold transition ${
                              activeSecIdx === idx
                                ? 'bg-cadcyan-500 text-black shadow-md'
                                : 'bg-cadslate-950 text-slate-300 border border-cadslate-800 hover:border-cadcyan-500/40'
                            }`}
                          >
                            Sec {sec.index}: {sec.nodes[0].id}→{sec.nodes[sec.nodes.length - 1].id} ({sec.totalLength.toFixed(0)}m)
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Visual AutoCAD Longitudinal Section Canvas Simulation */}
                    {currentPreviewSection && (() => {
                      const sec = currentPreviewSection;
                      const datum = sec.datum;
                      const maxGL = Math.max(...sec.nodes.map(n => n.gl));
                      const minIL = Math.min(...sec.nodes.map(n => n.ilOut));
                      const elevSpan = Math.max(4.0, (maxGL - datum) + 2.0);
                      const totalDist = Math.max(10.0, sec.totalLength);

                      const svgW = 920;
                      const svgH = 340;
                      const leftHdrW = 195;
                      const plotW = svgW - leftHdrW - 35;
                      const yDatum = 165;
                      const plotTop = 35;
                      const yScale = (yDatum - plotTop - 15) / elevSpan;

                      const xAt = (d) => leftHdrW + (d / totalDist) * plotW;
                      const yAt = (elev) => yDatum - (elev - datum) * yScale;

                      return (
                        <div className="space-y-4">
                          <div className="cad-preview-box rounded-xl border border-cadslate-800 p-4 overflow-x-auto shadow-inner">
                            <svg viewBox={`0 0 ${svgW} ${svgH}`} className="w-full min-w-[740px] h-auto select-none font-mono">
                              {/* Datum & Table Horizontal Lines (Layer TITLE = White) */}
                              <line x1="12" y1={yDatum} x2={leftHdrW + plotW} y2={yDatum} stroke="#f8fafc" strokeWidth="1.2" />
                              <line x1="12" y1={yDatum + 30} x2={leftHdrW + plotW} y2={yDatum + 30} stroke="#f8fafc" strokeWidth="1.2" />
                              <line x1="12" y1={yDatum + 60} x2={leftHdrW + plotW} y2={yDatum + 60} stroke="#f8fafc" strokeWidth="1.2" />
                              <line x1="12" y1={yDatum + 90} x2={leftHdrW + plotW} y2={yDatum + 90} stroke="#f8fafc" strokeWidth="1.2" />

                              {/* Left Table Labels */}
                              <text x="16" y={yDatum - 6} fill="#f8fafc" fontSize="10" fontWeight="bold">
                                DATUM {Number.isInteger(datum) ? datum : datum.toFixed(1)}m
                              </text>
                              <text x="16" y={yDatum + 13} fill="#f8fafc" fontSize="8.5">MANHOLES INVERT LEVEL</text>
                              <text x="16" y={yDatum + 24} fill="#f8fafc" fontSize="8.5">IN METERS</text>
                              <line x1="145" y1={yDatum + 15} x2="185" y2={yDatum + 15} stroke="#ff00ff" strokeWidth="1.5" />

                              <text x="16" y={yDatum + 43} fill="#f8fafc" fontSize="8.5">PROPOSED ROAD LEVEL</text>
                              <text x="16" y={yDatum + 54} fill="#f8fafc" fontSize="8.5">IN METERS</text>
                              <line x1="145" y1={yDatum + 45} x2="185" y2={yDatum + 45} stroke="#facc15" strokeWidth="1.5" strokeDasharray="5,3" />

                              <text x="16" y={yDatum + 78} fill="#f8fafc" fontSize="8.5">DISTANCE IN METERS</text>

                              {/* Profile Lines & Manhole Verticals */}
                              {sec.nodes.map((node, i) => {
                                const x = xAt(node.dist);
                                const yGl = yAt(node.gl);
                                const yIlIn = yAt(node.ilIn);
                                const yIlOut = yAt(node.ilOut);
                                const next = i < sec.nodes.length - 1 ? sec.nodes[i + 1] : null;
                                const xNext = next ? xAt(next.dist) : null;
                                const yGlNext = next ? yAt(next.gl) : null;
                                const yIlNextIn = next ? yAt(next.ilIn) : null;

                                return (
                                  <g key={i}>
                                    {/* Vertical Manhole Line from Bottom of Table to Top */}
                                    <line x1={x} y1={yDatum + 90} x2={x} y2="20" stroke="#f8fafc" strokeWidth="1" />
                                    {/* Manhole Shaft Twin Lines between IL and GL */}
                                    <line x1={x - 2.5} y1={yIlOut} x2={x - 2.5} y2={yGl} stroke="#f8fafc" strokeWidth="1" />
                                    <line x1={x + 2.5} y1={yIlOut} x2={x + 2.5} y2={yGl} stroke="#f8fafc" strokeWidth="1" />

                                    {/* Top Magenta Manhole Label */}
                                    <text
                                      x={x - 4}
                                      y="36"
                                      fill="#ff00ff"
                                      fontSize="9.5"
                                      fontWeight="bold"
                                      transform={`rotate(-90 ${x - 4} 36)`}
                                    >
                                      {node.id}
                                    </text>

                                    {/* Backdrop vertical step if present */}
                                    {i > 0 && (node.ilIn - node.ilOut) > 0.01 && (
                                      <line x1={x} y1={yIlIn} x2={x} y2={yIlOut} stroke="#ff00ff" strokeWidth="1.8" />
                                    )}

                                    {/* Segment Profile Lines & Pipe Label to Next Manhole */}
                                    {next && (
                                      <>
                                        {/* Magenta Invert Line */}
                                        <line x1={x} y1={yIlOut} x2={xNext} y2={yIlNextIn} stroke="#ff00ff" strokeWidth="1.6" />
                                        {/* Yellow Dashed Proposed Road Line */}
                                        <line x1={x} y1={yGl} x2={xNext} y2={yGlNext} stroke="#facc15" strokeWidth="1.5" strokeDasharray="6,4" />
                                        {/* Pipe Spec Label in Row 1 */}
                                        <text
                                          x={(x + xNext) / 2}
                                          y={yDatum + 18}
                                          fill="#f8fafc"
                                          fontSize="8"
                                          textAnchor="middle"
                                        >
                                          {`${node.size}Ø ${node.mat} 1:${node.grad}`}
                                        </text>
                                      </>
                                    )}

                                    {/* Rotated Table Numbers (IL, GL, Distance) */}
                                    <text
                                      x={i === 0 ? x + 8 : x - 5}
                                      y={yDatum + 24}
                                      fill="#f8fafc"
                                      fontSize="7.5"
                                      transform={`rotate(-90 ${i === 0 ? x + 8 : x - 5} ${yDatum + 24})`}
                                    >
                                      {node.ilOut.toFixed(2)}
                                    </text>
                                    <text
                                      x={i === 0 ? x + 8 : x - 5}
                                      y={yDatum + 54}
                                      fill="#f8fafc"
                                      fontSize="7.5"
                                      transform={`rotate(-90 ${i === 0 ? x + 8 : x - 5} ${yDatum + 54})`}
                                    >
                                      {node.gl.toFixed(2)}
                                    </text>
                                    <text
                                      x={i === 0 ? x + 8 : x - 5}
                                      y={yDatum + 84}
                                      fill="#f8fafc"
                                      fontSize="7.5"
                                      transform={`rotate(-90 ${i === 0 ? x + 8 : x - 5} ${yDatum + 84})`}
                                    >
                                      {node.dist.toFixed(2)}
                                    </text>
                                  </g>
                                );
                              })}

                              {/* Bottom Section Title & Scale */}
                              <text x="16" y={yDatum + 122} fill="#f8fafc" fontSize="14" fontWeight="bold" letterSpacing="1">
                                {sec.title}
                              </text>
                              <text x="20" y={yDatum + 136} fill="#94a3b8" fontSize="8.5">
                                SCALE   HOR = 1:{settings.secHorScale}    VER = 1:{settings.secVerScale}
                              </text>
                            </svg>
                          </div>

                          {/* Section Node Schedule Table */}
                          <div className="overflow-x-auto border border-cadslate-800 rounded-xl">
                            <table className="w-full text-left text-xs border-collapse">
                              <thead>
                                <tr className="bg-cadslate-950 text-slate-400 border-b border-cadslate-800 uppercase tracking-wider font-semibold">
                                  <th className="py-2.5 px-4">#</th>
                                  <th className="py-2.5 px-4">Manhole ID</th>
                                  <th className="py-2.5 px-4">Chainage Dist (m)</th>
                                  <th className="py-2.5 px-4">Road Level GL (m)</th>
                                  <th className="py-2.5 px-4">Invert Level IL (m)</th>
                                  <th className="py-2.5 px-4">Depth (m)</th>
                                  <th className="py-2.5 px-4">Backdrop (B/D IL)</th>
                                  <th className="py-2.5 px-4">Outgoing Pipe Spec</th>
                                </tr>
                              </thead>
                              <tbody className="divide-y divide-cadslate-800/60 font-mono">
                                {sec.nodes.map((n, nIdx) => {
                                  const isLast = nIdx === sec.nodes.length - 1;
                                  const segLen = !isLast ? (sec.nodes[nIdx + 1].dist - n.dist) : null;
                                  const hasBd = (n.ilIn - n.ilOut) > 0.005;
                                  return (
                                    <tr key={nIdx} className="hover:bg-cadslate-800/40 transition">
                                      <td className="py-2.5 px-4 text-slate-500">{nIdx + 1}</td>
                                      <td className="py-2.5 px-4 font-bold text-fuchsia-400">{n.id}</td>
                                      <td className="py-2.5 px-4 text-white font-semibold">{n.dist.toFixed(2)}m</td>
                                      <td className="py-2.5 px-4 text-amber-300">{n.gl.toFixed(2)}m</td>
                                      <td className="py-2.5 px-4 text-cadcyan-300 font-bold">{n.ilOut.toFixed(2)}m</td>
                                      <td className="py-2.5 px-4 text-slate-300">{(n.gl - n.ilOut).toFixed(2)}m</td>
                                      <td className="py-2.5 px-4">
                                        {hasBd ? (
                                          <span className="px-2 py-0.5 rounded bg-fuchsia-950/50 text-fuchsia-300 border border-fuchsia-500/30 text-[11px]">
                                            B/D IL: {n.ilIn.toFixed(2)}m (Drop {(n.ilIn - n.ilOut).toFixed(2)}m)
                                          </span>
                                        ) : (
                                          <span className="text-slate-500">—</span>
                                        )}
                                      </td>
                                      <td className="py-2.5 px-4">
                                        {!isLast ? (
                                          <span className="text-white bg-cadslate-950 px-2.5 py-1 rounded border border-cadslate-800">
                                            {n.size}Ø {n.mat} 1:{n.grad} ({segLen.toFixed(1)}m)
                                          </span>
                                        ) : (
                                          <span className="text-slate-500 italic">End of Section ({sec.totalLength.toFixed(2)}m)</span>
                                        )}
                                      </td>
                                    </tr>
                                  );
                                })}
                              </tbody>
                            </table>
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                )}
              </div>
            )}

            {/* ─────────────────────────────────────────────────────────
                5B. CSVUPDATE WORKSPACE (Data Preview Table & Stats Bar)
            ───────────────────────────────────────────────────────── */}
            {targetTool === 'CSVUPDATE' && processedRows.length > 0 && (
              <div className="bg-cadslate-900 border border-cadslate-800 rounded-xl overflow-hidden shadow-2xl space-y-4">
                
                {/* Statistics & Filters Bar */}
                <div className="p-4 bg-cadslate-850 border-b border-cadslate-800 flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3">
                  
                  <div className="flex flex-wrap items-center gap-1.5 text-xs">
                    <button
                      onClick={() => setFilterCategory('ALL')}
                      className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                        filterCategory === 'ALL'
                          ? 'bg-cadcyan-500 text-black shadow'
                          : 'bg-cadslate-800 text-slate-300 hover:bg-cadslate-750'
                      }`}
                    >
                      All ({stats.total})
                    </button>
                    {stats.drainageCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('DRAINAGE')}
                        className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                          filterCategory === 'DRAINAGE'
                            ? 'bg-cadcyan-500 text-black shadow'
                            : 'bg-cadslate-800 text-slate-300 hover:bg-cadslate-750'
                        }`}
                      >
                        Drainage ({stats.drainageCount})
                      </button>
                    )}
                    {stats.sewerageCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('SEWERAGE')}
                        className={`px-3 py-1.5 rounded-lg font-semibold transition ${
                          filterCategory === 'SEWERAGE'
                            ? 'bg-cadcyan-500 text-black shadow'
                            : 'bg-cadslate-800 text-slate-300 hover:bg-cadslate-750'
                        }`}
                      >
                        Sewerage ({stats.sewerageCount})
                      </button>
                    )}
                    {stats.mergedCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('MERGED')}
                        className={`px-2.5 py-1.5 rounded-lg font-semibold transition ${
                          filterCategory === 'MERGED'
                            ? 'bg-amber-500 text-black shadow'
                            : 'bg-amber-950/50 text-amber-300 border border-amber-500/30 hover:bg-amber-900/50'
                        }`}
                      >
                        Lowest-IL Merged ({stats.mergedCount})
                      </button>
                    )}
                    {stats.shortCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('SHORT')}
                        className={`px-2.5 py-1.5 rounded-lg font-medium transition ${
                          filterCategory === 'SHORT'
                            ? 'bg-cadcyan-600 text-white shadow'
                            : 'bg-cadslate-800 text-slate-400 hover:bg-cadslate-750'
                        }`}
                      >
                        Short (4-Line): {stats.shortCount}
                      </button>
                    )}
                    {stats.medCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('MEDIUM')}
                        className={`px-2.5 py-1.5 rounded-lg font-medium transition ${
                          filterCategory === 'MEDIUM'
                            ? 'bg-cadcyan-600 text-white shadow'
                            : 'bg-cadslate-800 text-slate-400 hover:bg-cadslate-750'
                        }`}
                      >
                        Med (2-Line): {stats.medCount}
                      </button>
                    )}
                    {stats.longCount > 0 && (
                      <button
                        onClick={() => setFilterCategory('LONG')}
                        className={`px-2.5 py-1.5 rounded-lg font-medium transition ${
                          filterCategory === 'LONG'
                            ? 'bg-cadcyan-600 text-white shadow'
                            : 'bg-cadslate-800 text-slate-400 hover:bg-cadslate-750'
                        }`}
                      >
                        Long (1-Line): {stats.longCount}
                      </button>
                    )}
                  </div>

                  {/* Search Input & Quick Copy */}
                  <div className="flex items-center space-x-2">
                    <div className="relative flex-1 md:w-64">
                      <input
                        type="text"
                        placeholder="Search ID or CAD string..."
                        value={searchTerm}
                        onChange={(e) => setSearchTerm(e.target.value)}
                        className="w-full bg-cadslate-950 border border-cadslate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cadcyan-500"
                      />
                      <svg className="w-4 h-4 text-slate-500 absolute left-2.5 top-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                      </svg>
                    </div>

                    <button
                      type="button"
                      onClick={copyEntireCSV}
                      className="px-3 py-1.5 text-xs font-semibold text-slate-200 bg-cadslate-800 hover:bg-cadslate-750 border border-cadslate-700 rounded-lg transition flex items-center space-x-1.5 whitespace-nowrap"
                    >
                      <svg className="w-3.5 h-3.5 text-cadcyan-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                      </svg>
                      <span>Copy CSV</span>
                    </button>
                  </div>
                </div>

                {/* The Preview Table */}
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="bg-cadslate-950 text-slate-400 border-b border-cadslate-800 uppercase tracking-wider font-semibold">
                        <th className="py-3 px-4 w-12 text-center">#</th>
                        <th className="py-3 px-4 w-28">Discipline</th>
                        <th className="py-3 px-4 w-32">CAD ID</th>
                        <th className="py-3 px-4 w-64">Extracted Parameters</th>
                        <th className="py-3 px-4">Generated AutoCAD MTEXT String</th>
                        <th className="py-3 px-4 w-52">Visual CAD Render</th>
                        <th className="py-3 px-4 w-16 text-center">Copy</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-cadslate-800/60 font-mono">
                      {filteredRows.map((row, idx) => (
                        <tr key={idx} className="hover:bg-cadslate-800/40 transition">
                          <td className="py-3 px-4 text-center text-slate-500 font-sans text-[11px]">
                            {idx + 1}
                          </td>

                          <td className="py-3 px-4 font-sans">
                            {row.category === 'SEWERAGE' ? (
                              <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
                                Sewerage
                              </span>
                            ) : (
                              <span className="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-bold bg-cadcyan-500/15 text-cadcyan-400 border border-cadcyan-500/30">
                                Drainage
                              </span>
                            )}
                          </td>

                          <td className="py-3 px-4 font-bold text-white tracking-wide">
                            <span className="bg-cadslate-950 px-2 py-1 rounded border border-cadslate-800 text-cadcyan-300">
                              {row.id}
                            </span>
                          </td>

                          <td className="py-3 px-4 font-sans text-xs">
                            {row.category === 'SEWERAGE' ? (
                              <div className="space-y-0.5 text-slate-300">
                                <div><span className="text-slate-500">GL:</span> {row.sewerDetails.gl || '—'}m</div>
                                <div><span className="text-slate-500">Lowest IL:</span> <strong className="text-cadcyan-400">{row.sewerDetails.il || '—'}m</strong></div>
                                <div><span className="text-slate-500">Depth:</span> {row.sewerDetails.depth || '—'}m</div>
                              </div>
                            ) : (
                              <div className="space-y-0.5 text-slate-300">
                                <div><span className="text-slate-500">Dia:</span> {row.drainDetails.size || '—'}%%c</div>
                                <div><span className="text-slate-500">Len:</span> {row.drainDetails.length || '—'}m</div>
                                <div>
                                  <span className="text-slate-500">Slope:</span> 1:{row.drainDetails.gradient || '—'}
                                  {row.drainDetails.il && (
                                    <span className="ml-2 text-[11px] text-cadcyan-400">(Min IL: {row.drainDetails.il}m)</span>
                                  )}
                                </div>
                              </div>
                            )}
                            <div className={`text-[10px] italic mt-1 font-mono ${row.duplicateCount > 1 ? 'text-amber-400 font-semibold' : 'text-slate-400'}`}>
                              {row.conditionBadge}
                            </div>
                          </td>

                          <td className="py-3 px-4">
                            <div className="bg-cadslate-950 text-cadcyan-300 px-3 py-2 rounded-lg border border-cadslate-800 text-[11px] break-all select-all shadow-inner">
                              {row.cadString}
                            </div>
                          </td>

                          <td className="py-3 px-4">
                            <div className="cad-preview-box p-2.5 rounded-lg border border-cadslate-800 text-xs shadow-inner leading-relaxed font-sans">
                              {row.visualLines.map((line, lidx) => (
                                <div key={lidx} className="cad-preview-line whitespace-nowrap truncate font-medium text-slate-100">
                                  {line}
                                </div>

                            </div>

                          <td className="py-3 px-4 text-center">

                              onClick={() => copySingleString(row.cadString)}
