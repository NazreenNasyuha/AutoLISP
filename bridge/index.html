<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JRK AutoCAD Smart XLS-to-CSV Bridge | CSVUPDATE &amp; SEWSECTION Suite</title>

  <!-- Google Fonts: Inter, JetBrains Mono & Libre Baskerville -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS & Theme Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./js/tailwind.config.js"></script>

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="./css/styles.css">

  <!-- External Libraries: SheetJS (xlsx), React 18, ReactDOM 18 & Babel Standalone -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-cadslate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-cadcyan-500 selection:text-black transition-colors duration-200">

  <div id="root" class="flex flex-col min-h-screen"></div>

  <!-- Core Pure-JS Engines (Constants, Smart Sheet Classifier, CAD Formatter & CSV Exporter) -->
  <script src="./js/constants.js"></script>
  <script src="./js/smart-engine.js"></script>
  <script src="./js/cad-engine.js"></script>
  <script src="./js/csv-exporter.js"></script>

  <!-- Modular React UI Components -->
  <script type="text/babel" src="./js/components/Header.js"></script>
  <script type="text/babel" src="./js/components/WorkflowBar.js"></script>
  <script type="text/babel" src="./js/components/UploadZone.js"></script>
  <script type="text/babel" src="./js/components/DetectionPanel.js"></script>
  <script type="text/babel" src="./js/components/SewSectionView.js"></script>
  <script type="text/babel" src="./js/components/CsvUpdateView.js"></script>
  <script type="text/babel" src="./js/components/Footer.js"></script>
  <script type="text/babel" src="./js/components/Modals.js"></script>

  <!-- Main React Application Controller -->
  <script type="text/babel" src="./js/app.js"></script>
</body>
</html>
